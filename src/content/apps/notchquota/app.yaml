features:
  eyebrow: { zh: 日常使用, en: Everyday use }
  title: { zh: 按你的习惯，放在手边。, en: Make it part of your desktop. }
  lead: { zh: 显示方式、账号顺序和卡通外观都由你选择。, en: "Choose the display mode, account order and character that suit you." }
  items:
    - kicker: { zh: 三种模式, en: Three display modes }
      title: { zh: 刘海、菜单栏或侧边栏, en: "Notch, menu bar or sidebar" }
      body: { zh: 灵动岛常驻图标与百分比；菜单栏点击查看一个账号；侧边栏同时排列已选账号，可自由拖动到任意显示器。, en: "A compact icon and percentage by the notch, one account at a time in the menu bar, or all selected accounts in a sidebar you can drag to any display." }
      details:
        - { zh: 灵动岛详情在 15 秒无操作后收起；菜单栏点击头像切换账号。, en: "Notch details close after 15 seconds of inactivity. Click the avatar in the menu bar panel to switch accounts." }
        - { zh: 灵动岛和菜单栏可每分钟自动轮换；侧边栏按设定顺序固定排列。, en: "Optional one-minute rotation in notch and menu bar modes; the sidebar keeps accounts in your chosen order." }
        - { zh: 侧边栏靠近左右边缘时吸附；鼠标跨屏不会带走它，只有主动拖动才换屏。, en: "Dock the sidebar to either edge. Moving your pointer between displays does not move it; dragging does." }
    - kicker: { zh: 卡通伙伴, en: Cartoon companions }
      title: { zh: 八种角色，一点小陪伴, en: Eight characters to keep you company }
      body: { zh: 小幽灵、小兔、小熊、云朵、小猫、小狐、熊猫和企鹅，收起外观可随时切换。移入展开账号面板，空闲时冒出额度思考泡泡。, en: "Choose a ghost, bunny, bear, cloud, cat, fox, panda or penguin. Hover to open your accounts; a thought bubble can show quota reminders while idle." }
      details:
        - { zh: 每 10 分钟按顺序尝试提醒一个账号，提醒前先查询；失败或旧数据跳过。, en: "Every 10 minutes, try one account at a time in order. Refresh before reminding and skip failed or stale results." }
        - { zh: 监测到 5 小时或每周额度恢复至 100% 时，随机播放一种短暂庆祝动画。, en: "When a five-hour or weekly quota is observed recovering to 100%, show a randomly chosen short celebration." }
        - { zh: 静置不播放循环动画；拖动、查看详情、临时隐藏与休眠时不弹出思考提醒。, en: "No looping animation at rest. Thought reminders pause during dragging, detail viewing, temporary hiding and sleep." }
    - kicker: { zh: 多账号, en: Multiple accounts }
      title: { zh: 只看你关心的账号, en: Show the accounts you care about }
      body: { zh: 支持 Antigravity 多实例，用头像、身份和别名区分。勾选需要的账号，拖动调整顺序；额外实例默认不启用。, en: "Identify Antigravity instances by avatar, identity and alias. Select your accounts and drag to reorder them; additional instances start disabled." }
      details:
        - { zh: 普通运行中未勾选的账号不显示、不查询；只有一个账号时固定显示。, en: "In normal use, unchecked accounts are neither shown nor queried. A single selected account stays fixed." }
        - { zh: 受支持的实例可自动发现，也可手动指定应用与登录文件。, en: "Supported instances can be discovered automatically or added with their app and sign-in file." }
        - { zh: 账号身份变化时暂停该项，需重新确认；不同账号的额度不会相加。, en: "An identity change pauses the instance until confirmed again. Quotas from different accounts are never added together." }
    - kicker: { zh: 原生轻量, en: Native and lightweight }
      title: { zh: 原应用关闭后也能查询, en: Query even with the original apps closed }
      body: { zh: 原生 Swift / AppKit，读取本机已有有效登录。不需要额外安装 Homebrew、Python 或 Node；仍需对应订阅授权和可用网络。, en: "Native Swift and AppKit using valid sign-ins already on your Mac. No extra Homebrew, Python or Node installation; a supported subscription and working connection are still required." }
      details:
        - { zh: 正常运行每 3 分钟刷新已选账号，常规请求同账号至少间隔 30 秒。, en: "Selected accounts refresh every 3 minutes in normal use, with at least 30 seconds between regular requests to the same account." }
        - { zh: 自动轮换读取缓存，悬停和固定详情不额外查询；休眠时暂停新请求。, en: "Rotation reads the cache. Hovering and pinning details do not query again; new requests pause during sleep." }
        - { zh: 未提供的周期和重置时间明确标注，不自行推算。, en: "Missing quota windows and reset times are labeled rather than estimated." }
    - kicker: { zh: 随时收起, en: Out of the way }
      title: { zh: 需要专注时，临时隐藏, en: Hide it when you need to focus }
      body: { zh: 可临时隐藏 15 分钟、1 小时、3 小时或 5 小时，也可通过菜单栏恢复入口立即显示。位置、外观和账号选择会保存在本机。, en: "Hide for 15 minutes, 1 hour, 3 hours or 5 hours, or show it immediately from the menu bar recovery entry. Position, appearance and account choices are saved locally." }
      details:
        - { zh: 可以开启开机启动，退出应用后不保留后台进程。, en: "Launch at login is optional. No app processes remain after quitting." }
    - kicker: { zh: 安装与更新, en: Install and update }
      title: { zh: 签名、公证，应用内升级, en: Signed and notarized with in-app updates }
      body: { zh: 面向 Apple 芯片 Mac，支持 macOS 13+。正式 DMG 经过 Developer ID 签名和 Apple 公证，使用 Sparkle 检查、下载、校验并安装更新。, en: "For Apple silicon Macs on macOS 13 or later. Official DMGs are Developer ID–signed and Apple-notarized; Sparkle checks, downloads, verifies and installs updates." }
      details:
        - { zh: 默认每天检查一次，也可手动检查；检查不会自动下载或安装。, en: "Checks daily by default or on demand. Checking alone does not download or install updates." }
        - { zh: 应用不收集使用遥测，不向开发者上传账号或额度；数据查询发送到对应服务。, en: "No usage telemetry or account and quota uploads to the developer. Quota requests go to the matching service." }

faq:
  eyebrow: FAQ
  title: { zh: 使用前，你可能想知道。, en: Before you start. }
  lead: { zh: 登录条件、刷新方式和数据边界，说明白。, en: "Sign-in requirements, refresh behavior and data boundaries." }
  items:
    - q: { zh: 需要一直开着 Codex、Claude 或 Antigravity 吗？, en: Do the original apps need to stay open? }
      a: { zh: 不需要。先在对应软件登录订阅账号，有效登录仍在且网络可用时，原应用关闭后也能查询。授权失效或需要网页验证时，请在原应用重新登录或完成验证。, en: "No. Sign in to a supported subscription first. Valid local sign-ins and a working connection allow queries with the original apps closed. If authorization expires or verification is needed, sign in or complete verification in the original app." }
    - q: { zh: 所有周期都有 5 小时和每周额度吗？, en: Does every service provide five-hour and weekly quotas? }
      a: { zh: 不一定。周期、模型额度和重置时间取决于服务返回的数据。紧凑视图显示已知窗口中最少的剩余比例，展开后分别查看；未提供的字段会明确标注。, en: "Not always. Windows, model quotas and reset times depend on the service response. Compact views show the lowest known remaining percentage; open details for each window. Missing fields are labeled." }
    - q: { zh: 多个 Antigravity 账号怎么区分？, en: How are multiple Antigravity accounts distinguished? }
      a: { zh: 使用头像、账号身份、实例名称和自定义别名。可选择哪些显示并调整顺序；额外实例默认关闭，手动添加后也需勾选启用。, en: "By avatar, account identity, instance name and a custom alias. Choose which to show and set the order. Extra instances start disabled; manually added instances also need to be enabled." }
    - q: { zh: 额度多久刷新一次？, en: How often do quotas refresh? }
      a: { zh: 正常运行每 3 分钟刷新已勾选账号，常规请求同账号至少间隔 30 秒。每分钟自动轮换只读缓存；角色思考提醒每 10 分钟单独尝试一次，提醒前先查询。, en: "Selected accounts refresh every 3 minutes in normal use, with at least 30 seconds between regular requests to the same account. One-minute rotation reads the cache. Thought reminders separately try every 10 minutes and refresh before showing." }
    - q: { zh: 认证信息和额度会发送到哪里？, en: Where are credentials and quotas sent? }
      a: { zh: 为查询额度，认证信息仅通过 HTTPS 发往对应服务，不向开发者上传账号、额度或使用遥测。应用会保存本地偏好；头像下载和版本检查会产生普通网络请求，详细处理方式见隐私政策。, en: "For quota queries, credentials go over HTTPS only to the matching service. No accounts, quotas or usage telemetry are uploaded to the developer. Preferences are stored locally; avatar downloads and update checks make ordinary network requests. See the privacy policy for details." }
    - q: { zh: 显示灰色或数据过期怎么办？, en: What if a quota is gray or stale? }
      a: { zh: 灰色表示暂时无法读取。查看详情中的原因，检查网络或在原应用重新登录；旧数据会保留并标注。接口变化也可能导致兼容问题，反馈时不要上传凭据、Cookie 或完整认证文件。, en: "Gray means data is unavailable. Read the reason in details, check the connection or sign in again in the original app. Old data stays marked as stale. Upstream changes may also cause compatibility issues; never include credentials, cookies or complete sign-in files in reports." }
    - q: { zh: 支持第三方 API 中转站余额吗？, en: Does it support API relay balances? }
      a: { zh: 目前只适配订阅额度，不支持第三方 API 中转站余额，也不能用第三方 API Key 查询官方订阅额度。, en: "Only subscription quotas are supported. Third-party API relay balances and official subscription queries using third-party API keys are not supported." }

cta:
  title: { zh: 把 AI 额度，放在手边。, en: Keep your AI quotas close. }
  note: { zh: Apple 芯片 · macOS 13+ · 签名并公证 · 应用内更新, en: Apple silicon · macOS 13+ · Signed & notarized · In-app updates }
