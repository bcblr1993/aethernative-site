# 软件开启了 SURequireSignedFeed，更新清单必须原样转发软件自己签名的 appcast.xml
appcastMode: mirror
icon: ./media/icon.png
tech: [Swift / AppKit]

tagline:
  zh: 你的 Mac 上的 AI 额度助手
  en: An AI quota companion for your Mac
summary:
  zh: 原生 macOS AI 订阅额度助手。查看 Codex、Claude、Antigravity 的剩余额度和重置时间，支持三种显示模式、多账号与八种卡通伙伴。
  en: A native macOS companion for AI subscription quotas. Track Codex, Claude and Antigravity with three display modes, multiple accounts and eight cartoon companions.

platforms:
  - id: mac
    status: available
    requirement: { zh: Apple 芯片 · macOS 13+, en: Apple silicon · macOS 13+ }

hero:
  eyebrow: { zh: Codex · Claude · Antigravity, en: Codex · Claude · Antigravity }
  title: { zh: "AI 额度，\n一眼就知道。", en: "Your AI quotas.\nAt a glance." }
  lead:
    zh: "把 Codex、Claude、Antigravity 的订阅额度放在刘海、菜单栏或可拖动侧边栏。\n按自己的习惯选账号、调顺序、换上卡通伙伴。"
    en: "Keep Codex, Claude and Antigravity quotas in the notch, menu bar or a draggable sidebar.\nChoose your accounts, set their order and pick a cartoon companion."
  requirements:
    zh: Apple 芯片 / macOS 13+ · 需要先在对应软件中登录订阅账号
    en: "Apple silicon / macOS 13+ · Sign in to each service's own app first"
notice:
  zh: AetherNotchQuota 是独立开发的非官方工具，与 OpenAI、Anthropic、Google 无关联。Codex、Claude、Antigravity 及相关标识归各自权利人所有。
  en: AetherNotchQuota is an independent, unofficial tool and is not affiliated with OpenAI, Anthropic or Google. Codex, Claude, Antigravity and related marks belong to their respective owners.

