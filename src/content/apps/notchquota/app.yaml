# 软件开启了 SURequireSignedFeed，更新清单必须原样转发软件自己签名的 appcast.xml
appcastMode: mirror
icon: ./media/icon.png
tech: [Swift / AppKit]

tagline:
  zh: 刘海旁的 AI 额度仪表
  en: Your AI quotas, right by the notch
summary:
  zh: 轻量原生的 AI 额度工具。在 Codex、Claude、Antigravity 之间查看剩余额度和重置时间，支持灵动岛、菜单栏和侧边栏。
  en: A lightweight native quota monitor. See remaining usage and reset times for Codex, Claude and Antigravity — in the notch, the menu bar or a floating sidebar.

platforms:
  - id: mac
    status: available
    requirement: { zh: Apple 芯片 · macOS 13+, en: Apple silicon · macOS 13+ }

hero:
  eyebrow: { zh: Codex · Claude · Antigravity, en: Codex · Claude · Antigravity }
  title: { zh: "额度还剩多少，\n抬眼就知道。", en: "How much is left?\nJust glance up." }
  lead:
    zh: "在刘海、菜单栏或侧边栏查看 AI 订阅的剩余额度和重置时间。\n原生 Swift / AppKit，无 Electron、无后台浏览器。"
    en: "Remaining quota and reset times for your AI subscriptions — in the notch, the menu bar or a sidebar.\nNative Swift and AppKit. No Electron, no background browser."
  requirements:
    zh: Apple 芯片 / macOS 13+ · 需要先在对应软件中登录订阅账号
    en: "Apple silicon / macOS 13+ · Sign in to each service's own app first"
notice:
  zh: NotchQuota 是独立开发的非官方工具，与 OpenAI、Anthropic、Google 无关联。Codex、Claude、Antigravity 及相关标识归各自权利人所有。
  en: NotchQuota is an independent, unofficial tool and is not affiliated with OpenAI, Anthropic or Google. Codex, Claude, Antigravity and related marks belong to their respective owners.

