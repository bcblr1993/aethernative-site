  title: { zh: 三种显示方式，随你摆放。, en: Three ways to see it. Put it anywhere. }
  lead:
    zh: 刘海附近紧凑显示、菜单栏点击查看，或在任意显示器上放置可拖动的侧边栏。
    en: Compact in the notch, one click away in the menu bar, or a draggable sidebar on any display.
  note:
    zh: 图片来自本次 0.1.21 发布对应的原生界面渲染，额度、账号名称和时间为演示数据。
    en: Native interface renders for the 0.1.21 release. Quotas, account names and times are demo data.
