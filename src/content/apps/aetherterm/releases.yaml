      en: ApexTerm v1.5.6 — Resolved terminal viewport top clipping on split, Vim arrow key cursor sync/DECCKM support, and Chinese IME colon exit command issues.
    badge:
      zh: 正式版 · 已通过 Apple 公证
      en: Release · Apple notarized
    notes:
      - title:
          zh: 问题修复 (Bug Fixes)
          en: Bug Fixes
        items:
          - zh: 彻底解决打开文件面板/分屏时终端首行被遮挡削头缺陷。建立备用屏幕原点锁定门禁，禁止在备用屏幕下调用 scrollToBottom，视口与文档视图垂直原点严格锚定在 (0, 0)，保留 10px 安全内边距。
            en: Fixed terminal top line clipping on split/SFTP panel open by locking viewport origin to (0, 0) in alternate screen mode and preventing invalid scrollToBottom calls.
          - zh: 彻底修复 Vim 模式下方向键移动光标看不见、不跟随问题。支持 DECCKM (\e[?1h) 应用光标键模式，光标移动指令原子自增屏幕修订号触发重绘，并支持 Shift / Ctrl 方向键组合。
            en: Fixed invisible and non-following cursor in Vim with DECCKM application cursor keys mode support, revision-driven refresh on cursor movements, and Shift/Ctrl key combos.
          - zh: 重构光标渲染与双矩形清除机制。移动光标时新旧矩形同步擦除重绘杜绝残影，非焦点状态下呈现优雅空心描边矩形（Hollow Outline），光标位置始终清晰可见。
            en: Overhauled cursor invalidation with dual-rect dirty clearing and elegant hollow outline rendering when unfocused.
          - zh: 彻底修复 Vim 模式下无法退出（Esc / :q / 输入法拦截）问题。智能规整中文输入法全角冒号「：」为半角「:」，并在备用屏幕下保障 Esc 键直通发送，一键打断插入模式。
            en: Resolved Vim exit failure by normalizing Chinese IME full-width colons to ASCII and ensuring reliable ESC key pass-through.
      - title:
          zh: 质量门禁与性能对比 (Verification & Benchmarks)
          en: Verification & Benchmarks
        items:
