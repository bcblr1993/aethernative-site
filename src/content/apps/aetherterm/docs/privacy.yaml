title: { zh: 隐私政策, en: Privacy }
heading: { zh: "你的服务器，\n只由你连接。", en: "Your servers.\nOnly you connect." }
meta: { zh: 适用于 AetherTerm 客户端, en: Applies to the AetherTerm app }
lead:
  zh: AetherTerm 不包含统计分析或遥测，不向开发者发送任何使用数据。
  en: AetherTerm contains no analytics or telemetry and sends no usage data to the developer.
sections:
  - heading:
      zh: 网络连接
      en: Network connections
    body:
      - zh: 终端、SFTP 和系统监控连接由你选择的 SSH 服务器。官网下载渠道可访问 GitHub 检查和下载更新；商店渠道通过 App Store 获取更新。你打开官网、帮助或反馈链接时，浏览器会连接相应网站。
        en: Terminal sessions, SFTP, and monitoring connect to SSH servers you choose. Direct downloads may contact GitHub to check for and download updates; the App Store edition uses the App Store. Opening website, help, or feedback links connects your browser to the corresponding website.
  - heading:
      zh: 凭据保存
      en: Credentials
    body:
      - zh: SSH 密码与私钥口令保存在本机 macOS 钥匙串。导入密钥保险库的私钥也由钥匙串保存；文件方式使用你选择的本地私钥路径。SSH 密码认证通过加密连接发送到你选择的服务器，私钥认证使用本地签名，不上传私钥给开发者。
        en: SSH passwords and passphrases are stored in the local macOS Keychain. Private keys imported into the vault also use Keychain; file-based keys use your chosen local paths. Password authentication sends credentials over an encrypted connection to your chosen server; key authentication signs locally without uploading private keys to the developer.
  - heading:
      zh: 本地数据
      en: Local data
    body:
      - zh: 会话配置、文件授权书签和应用设置保存在本机。终端数据与文件操作在本机及你选择的服务器之间传输；拖拽下载会暂存文件以交给 Finder。你可以管理本地会话及自行导入、导出或下载的文件。
        en: Session configuration, file authorization bookmarks, and settings are stored locally. Terminal data and file operations are transferred between your Mac and the servers you choose; drag downloads temporarily stage files for Finder. You manage local sessions and any files you import, export, or download.
  - heading:
      zh: 联系
      en: Contact
    links:
      - label: GitHub Issues ↗
        href: https://github.com/bcblr1993/ApexTerm/issues
  - heading:
      zh: 会话日志
      en: Session logs
    body:
      - zh: 启用会话记录后，终端内容保存到你选择的本机日志目录，可记录纯文本或原始流并进行大小轮转。日志可能包含命令输出中的敏感信息，请按需启用、管理和分享。
        en: When session recording is enabled, terminal content is saved to your chosen local log directory as plain text or raw streams with size-based rotation. Logs can contain sensitive command output; enable, manage and share them accordingly.
