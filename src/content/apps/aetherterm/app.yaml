name: AetherTerm
order: 3
repo: https://github.com/bcblr1993/ApexTerm
minimumSystemVersion: "14.0"
icon: ./media/icon.png
tech:
  - Swift 6
  - SwiftUI
tagline:
  zh: 原生的本地终端、SSH 与文件工作台
  en: A native local terminal, SSH and file workspace
summary:
  zh: "原生 Mac 终端与运维工作台。把本地终端、SSH、SFTP、Linux 进程监视、密钥保险库与会话日志放在一个窗口里。"
  en: "A native Mac terminal workspace with local shells, SSH, SFTP, Linux process monitoring, an SSH key vault and session logs."
platforms:
  - id: mac
    status: available
    requirement:
      zh: Apple 芯片 · macOS 14+
      en: Apple silicon · macOS 14+
hero:
  eyebrow:
    zh: SSH · SFTP · 服务器监控
    en: SSH · SFTP · Server metrics
  title:
    zh: |-
      远程运维，
      也可以很原生。
    en: |-
      Remote work,
      natively done.
  lead:
    zh: |-
      终端、文件和服务器状态，放在同一个原生窗口里。
      Swift 6 与 SwiftUI 构建，专为 Apple 芯片优化。
    en: |-
      Your terminal, files and server health in one native window.
      Built with Swift 6 and SwiftUI, tuned for Apple silicon.
  requirements:
    zh: Apple 芯片（M1 及更新）/ macOS 14+
    en: Apple silicon (M1 or later) / macOS 14+
features:
  eyebrow:
    zh: 功能
    en: Features
  title:
    zh: 常用的，都在一个窗口里。
    en: Everything you reach for, in one window.
  lead:
    zh: 把终端、文件管理和服务器监控这几件最常做的事，用原生的方式重新组合。
    en: The things you do most — terminal, files and monitoring — brought together, natively.
  items:
    - kicker:
        zh: 终端 + SFTP
        en: Terminal + SFTP
      title:
        zh: 终端与文件，上下联动
        en: Terminal and files, linked
      body:
        zh: 上方敲命令，下方管理远程文件。在终端里 cd 到某个目录，SFTP 视图会自动跟过去（OSC 7）。
        en: Type commands above and manage remote files below. cd somewhere in the terminal and the SFTP view follows (OSC 7).
      details:
        - zh: 内嵌快速代码编辑器，支持语法行号与 ⌘S 就地保存。
          en: Built-in Quick Editor with line numbers and ⌘S in-place save.
        - zh: 支持与访达（Finder）原生双向拖拽传输文件。
          en: Bidirectional drag-and-drop with macOS Finder.
        - zh: 路径栏一键复制当前目录，操作失败可查看完整错误原因。
          en: Copy the current directory from the path bar and inspect full operation errors.
        - zh: 原生中文拼音输入法优化，Escape 智能撤回，中文字符严谨对齐。
          en: Native Chinese IME optimization with intelligent Escape cancellation.
    - kicker:
        zh: 服务器监控
        en: Server metrics
      title:
        zh: 无需安装探针的实时监控
        en: Live metrics without an agent
      body:
        zh: 远程服务器不需要安装任何客户端，复用 SSH 通道采样 CPU、内存、网络与磁盘，用原生图表实时显示。
        en: Nothing to install on the server. CPU, memory, network and disk are sampled over the existing SSH connection and charted natively.
      details:
        - zh: 集成 Swift Charts 历史时序折线图，直观掌握近 60 秒 CPU 与内存趋势。
          en: Swift Charts telemetry trends for 60-second CPU and memory history.
    - kicker:
        zh: 安全
        en: Security
      title:
        zh: 凭据交给系统钥匙串
        en: Credentials stay in the Keychain
      body:
        zh: 密码与口令保存在 macOS 钥匙串。新增密钥保险库统一管理 Ed25519、RSA-4096 和 ECDSA 密钥，可向会话绑定密钥、查看 SHA256 指纹并部署公钥。
        en: Passwords and passphrases use macOS Keychain. The key vault manages Ed25519, RSA-4096 and ECDSA keys, with session bindings, SHA256 fingerprints and public-key deployment.
    - kicker:
        zh: 批量运维
        en: Working at scale
      title:
        zh: 多会话广播与关键词高亮
        en: Broadcast input and keyword highlighting
      body:
        zh: 一次输入，同步发送到选中的一组主机；按规则自动高亮 ERROR、FATAL 等关键词。
        en: Type once and send it to a group of hosts. Rules highlight keywords such as ERROR and FATAL as output arrives.
    - kicker:
        zh: 进程与服务
        en: Processes and services
      title:
        zh: 查看 Linux 进程和服务状态
        en: Inspect Linux processes and services
      body:
        zh: 通过 SSH 查看进程 CPU、内存与命令行，按关键词搜索和排序；查看 systemd 服务状态，并对允许操作的进程发送终止或重载信号。
        en: Inspect process CPU, memory and command lines over SSH, with search and sorting. Check systemd service status and send termination or reload signals to eligible processes.
    - kicker:
        zh: 会话记录
        en: Session logs
      title:
        zh: 保留日志，快速复制命令输出
        en: Keep logs and copy command output
      body:
        zh: 会话日志支持纯文本与原始数据流，达到 50 MB 时轮转。使用 ⌘⌥C 提取上一条命令的输出，并可在设置中选择日志目录。
        en: Record plain text or raw terminal streams with rotation at 50 MB. Use ⌘⌥C to extract the previous command output and choose the log folder in Settings.
gallery:
  - label:
      zh: 工作台 · 经典白色
      en: Workspace · Classic Light
    zh: ./media/classic-main.png
experience:
  eyebrow:
    zh: "终端工作流"
    en: "Terminal workflows"
  title:
    zh: "从连接到排查，常用操作触手可及。"
    en: "From connecting to troubleshooting."
  cards:
    - title:
        zh: "键盘操作与分屏"
        en: "Keyboard navigation and panes"
      body:
        zh: "⌘⇧T 打开本地终端，⌘⇧Enter 放大或还原分屏，⌘⌥方向键切换窗格；可选择系统已安装的等宽字体。"
        en: "Open a local terminal with ⌘⇧T, zoom or restore a pane with ⌘⇧Enter, and move focus with ⌘⌥arrow keys. Choose from installed monospaced fonts."
    - title:
        zh: "端口转发与快捷命令"
        en: "Tunnels and quick commands"
      body:
        zh: "配置本地、远程与动态 SOCKS5 转发，使用可折叠快捷命令栏填入变量并执行常用命令。"
        en: "Configure local, remote and dynamic SOCKS5 forwarding. Fill variables in reusable commands from the collapsible quick-command bar."
    - title:
        zh: "命令面板与路径书签"
        en: "Command palette and bookmarks"
      body:
        zh: "⌘P 搜索操作、主机、路径与快捷命令；SFTP 常用目录和自定义书签帮助快速定位。"
        en: "Use ⌘P to find actions, hosts, paths and quick commands. SFTP presets and custom bookmarks provide quick directory access."
notice:
  zh: "AetherTerm 原名 ApexTerm，已有会话与钥匙串凭据可继续使用。GitHub 仓库保留 ApexTerm 名称；安装与版本记录使用 AetherTerm。"
  en: "Formerly ApexTerm, with existing sessions and Keychain credentials preserved. The GitHub repository retains the ApexTerm name; downloads and release notes use AetherTerm."
faq:
  eyebrow: FAQ
  title:
    zh: 常见问题
    en: Questions
  lead:
    zh: 开源、免费，欢迎反馈。
    en: Open source, free, and feedback is welcome.
  items:
    - q:
        zh: 改名会影响已有会话和密码吗？
        en: Does the rename affect my sessions and passwords?
      a:
        zh: 完全不影响。原有会话、本地偏好设置和钥匙串凭据均严格保持向下兼容。
        en: Not at all. Existing session storage, local preferences, and Keychain credentials remain fully compatible.
    - q:
        zh: AetherTerm 免费吗？
        en: Is AetherTerm free?
      a:
        zh: 免费，并以 MIT 许可证开源。
        en: Yes. It's free and open source under the MIT License.
    - q:
        zh: 需要在服务器上安装什么吗？
        en: Do I need to install anything on my servers?
      a:
        zh: 不需要。服务器监控复用 SSH 连接读取系统信息，远端无需安装客户端或守护进程。
        en: No. Monitoring reads system information over the SSH connection; nothing needs to run on the server.
    - q:
        zh: 我的密码和私钥存在哪里？
        en: Where are my passwords and keys stored?
      a:
        zh: "密码与口令保存在本机钥匙串。导入保险库的私钥由钥匙串保存，文件方式使用你选择的本机路径；SSH 认证不会上传私钥。"
        en: "Passwords and passphrases stay in the local Keychain. Imported vault keys are stored in Keychain; file-based keys use your chosen local paths. SSH authentication does not upload private keys."
