  "notice": {
    "zh": "2.0.0 大版本正式发布：新增旭日图 / 树状图 / 分栏树多维空间可视化与四种配色模式、磁盘友好三档扫描策略（含 IOPOL_THROTTLE 限流）、挂载卷只读切换与 APFS 本地快照透视、纯元数据疑似重复大文件线索、Quick Look 快速预览及多快照占用走势图。目录占用不等于实际可释放空间；移入废纸篓不会立即释放空间。",
    "en": "AetherDisk 2.0.0 is now released with Sunburst, Treemap and Miller Columns visualizations across four color modes, three disk-friendly scan performance profiles with IOPOL_THROTTLE throttling, mounted volume switching and read-only APFS snapshot insights, metadata-only duplicate clues, Quick Look previews and multi-snapshot trend charts. Folder usage is not a promise of reclaimable space; moving files to Trash does not immediately free space."
