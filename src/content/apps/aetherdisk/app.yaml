    "items": [
      {
        "kicker": {
          "zh": "可视化",
          "en": "Visualize"
        },
        "title": {
          "zh": "旭日图、树状图与分栏树联动",
          "en": "Sunburst, Treemap & Miller Columns"
        },
        "body": {
          "zh": "支持四种空间视图与按目录、文件类型、陈旧度、保护状态四种配色语义；点击选中、再次点击目录快速下钻，受保护节点带斜纹与盾牌标识。",
          "en": "Switch across four spatial views with four semantic color modes. Click to inspect, click again to drill down, with diagonal hatching and shields for protected paths."
        }
      },
      {
        "kicker": {
          "zh": "性能",
          "en": "Performance"
        },
        "title": {
          "zh": "磁盘友好并发与 I/O 限流",
          "en": "Disk-friendly bounded concurrency"
        },
        "body": {
          "zh": "提供节能低 I/O、均衡并发与极速并发三档策略，结合 Darwin IOPOL_THROTTLE 线程级限流与硬链接去重；绝不读取文件内容、不跟随符号链接、不跨卷。",
          "en": "Choose Eco, Balanced or Fast scan profiles with Darwin IOPOL_THROTTLE disk throttling and hard-link deduplication. Never reads file contents, follows symlinks or crosses volumes."
        }
      },
      {
        "kicker": {
          "zh": "系统透视",
          "en": "System Insights"
        },
        "title": {
          "zh": "挂载卷切换与 APFS 快照透视",
          "en": "Volumes & read-only APFS snapshots"
        },
        "body": {
          "zh": "侧边栏一键切换已挂载卷（外部卷锁定仅只读分析）；只读查看 APFS 本地快照清单、废纸篓占用与完整磁盘访问权限状态，绝不删除系统快照。",
          "en": "Switch mounted volumes in the sidebar (external volumes are strictly read-only). Inspect APFS local snapshots, Trash usage and Full Disk Access read-only without deleting snapshots."
        }
      },
      {
        "kicker": {
          "zh": "线索与预览",
          "en": "Clues & Preview"
        },
        "title": {
          "zh": "纯元数据重复线索与 Quick Look",
          "en": "Metadata duplicate clues & Quick Look"
        },
        "body": {
          "zh": "在不读取文件正文的情况下，按大于等于 1 MiB 文件的逻辑大小与扩展名归组提示潜在重复占用；支持原生 Quick Look（⌘Y）与文件夹拖放只读扫描。",
          "en": "Groups ≥1 MiB unique-inode files by logical size and extension without reading file contents. Includes native Quick Look (⌘Y) and drag-and-drop folder scanning."
        }
      },
      {
        "kicker": {
          "zh": "保护",
          "en": "Protect"
        },
        "title": {
          "zh": "源码、安装包与自定义目录保护",
          "en": "Source, installers & custom protection"
        },
        "body": {
          "zh": "自动识别开发工程并校验普通文件清单；包含源码、Git 工作树、安装包、签名归档或链接的候选阻止清理，支持添加本机自定义保护目录并在清理前再次校验指纹。",
          "en": "Validates regular-file project manifests and blocks cleanup for source code, Git worktrees, installers, signing archives or symlinks, alongside local custom protected folders and pre-Trash fingerprint revalidation."
        }
      },
      {
        "kicker": {
          "zh": "趋势与审计",
          "en": "Trends & Audit"
        },
        "title": {
          "zh": "多快照走势、审计账本与 CSV 报告",
          "en": "Snapshot trends, audit ledger & CSV"
        },
        "body": {
          "zh": "保留最近 10 份完整扫描快照与连续增长热点，展示多快照柱状走势图；本机审计账本记录最近 50 次废纸篓操作，支持 10 列 CSV 安全导出。",
          "en": "Retains up to 10 completed scan snapshots with continuous growth hotspots and a bar trend chart, logs the last 50 Trash actions locally, and exports 10-column sanitized CSV reports."
        }
      }
