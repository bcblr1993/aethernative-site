    "zh": "原生 macOS 磁盘空间分析与安全清理工具。提供旭日图、树状图、分栏树与占比条四种可视化视图，磁盘友好有界并发扫描、挂载卷与 APFS 快照只读透视、纯元数据重复线索及 Quick Look 预览；重要目录默认保护，清理前先校验再移入废纸篓。",
    "en": "A native macOS disk analyzer and safe cleanup tool. Offers Sunburst, Treemap, Miller Columns and Space Bar visualizations, disk-friendly bounded concurrency profiles, mounted volume & read-only APFS snapshot insights, metadata-only duplicate clues and Quick Look previews, with source/installer protection and Trash-only confirmation."
