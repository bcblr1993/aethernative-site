  "features": {
    "eyebrow": {
      "zh": "看清，再整理",
      "en": "Understand before cleaning"
    },
    "title": {
      "zh": "每一步，都清楚。",
      "en": "Clarity at every step."
    },
    "lead": {
      "zh": "本机扫描、保守建议、明确确认。",
      "en": "Local scans. Conservative suggestions. Explicit confirmation."
    },
    "items": [
      {
        "kicker": {
          "zh": "分析",
          "en": "Analyze"
        },
        "title": {
          "zh": "包含隐藏目录的占用排行",
          "en": "Rankings including hidden folders"
        },
        "body": {
          "zh": "扫描文件元数据，区分已分配大小与逻辑大小，不跟随符号链接、不跨卷；可以随时停止，并明确显示权限遗漏与部分结果。",
          "en": "Scans file metadata with separate allocated and logical sizes. Does not follow symlinks or cross volumes. Cancel any time; permission gaps and partial results are visible."
        }
      },
      {
        "kicker": {
          "zh": "保护",
          "en": "Protect"
        },
        "title": {
          "zh": "源码和安装包默认保留",
          "en": "Source and installers stay protected"
        },
        "body": {
          "zh": "结合项目标记识别构建缓存；包含源码、Git 跟踪文件、安装包、签名材料或链接的候选会阻止清理。检查进程占用，执行前再次核对目录内容。",
          "en": "Identifies build caches using project markers. Candidates containing source files, Git-tracked files, installers, signing materials or links are blocked. Checks open files and revalidates before cleanup."
        }
      },
      {
        "kicker": {
          "zh": "记录",
          "en": "Compare"
        },
        "title": {
          "zh": "知道空间去了哪里",
          "en": "See what changed"
        },
        "body": {
          "zh": "对比相同目录的两次扫描，包括新增与已移除的项目。扫描记录只在本机保存，可在 Finder 中查看文件位置。",
          "en": "Compares scans of the same folder including added and removed items. History stays on your Mac; reveal items in Finder."
        }
      },
      {
        "kicker": {
          "zh": "定位",
          "en": "Locate"
        },
        "title": {
          "zh": "大文件与类型占比，一起看",
          "en": "Large files and file types in one place"
        },
        "body": {
          "zh": "跨目录查看大文件，按类型、大小和路径筛选，区分磁盘占用与逻辑大小。类型汇总覆盖已读取的深层文件，不受目录列表显示上限影响。",
          "en": "Find large files across folders and filter by type, size or path. Separate physical and logical sizes; file-type totals include scanned deep files beyond the directory display limit."
        }
      },
      {
        "kicker": {
          "zh": "自定义",
          "en": "Customize"
        },
        "title": {
          "zh": "重要目录，由你额外保护",
          "en": "Add your own protected folders"
        },
        "body": {
          "zh": "保护目录仍参与扫描，但清理时连同它的内部文件与包含它的缓存父目录一起保留。设置只在本机保存。",
          "en": "Protected folders remain in scans but cannot be cleaned, including their contents and cache ancestors. Settings remain local."
        }
      },
      {
        "kicker": {
          "zh": "报告",
          "en": "Reports"
        },
        "title": {
          "zh": "导出报告，查看未读取路径",
          "en": "Export reports and inspect unreadable paths"
        },
        "body": {
          "zh": "通过系统保存面板导出 CSV 元数据报告，保留大小、类型汇总和权限遗漏；不读取或导出文件内容，报告不会自动上传。",
          "en": "Export CSV metadata through the native save panel, including sizes, file-type totals and permission gaps. File contents are never read or exported; reports are not uploaded automatically."
        }
      }
    ]
  },
  "faq": {
    "eyebrow": "FAQ",
    "title": {
      "zh": "整理之前，了解这些。",
      "en": "Before you tidy up."
    },
    "lead": {
      "zh": "关于权限、保护和更新。",
      "en": "Permissions, protection and updates."
    },
    "items": [
      {
        "q": {
          "zh": "清理有风险吗？误删由谁负责？",
          "en": "What are the cleanup risks and responsibilities?"
        },
        "a": {
          "zh": "软件及清理建议可能存在问题或误判，请谨慎操作。重要文件请先备份，并逐项核对清理目录。误删或数据丢失由用户自行承担，开发者概不负责。",
          "en": "The software and cleanup suggestions may contain errors or misclassifications. Use caution, back up important files and review every folder before cleaning. Users assume responsibility for accidental deletion or data loss; the developer accepts no liability."
        }
      },
      {
        "q": {
          "zh": "会自动删除文件吗？",
          "en": "Does it delete files automatically?"
        },
        "a": {
          "zh": "不会。建议默认不勾选，检查后还需确认；执行仅移入系统废纸篓，不永久删除、不自动清空废纸篓。",
          "en": "No. Suggestions are unselected by default and require review and confirmation. Cleanup moves items to system Trash without permanently deleting them or emptying Trash."
        }
      },
      {
        "q": {
          "zh": "为什么部分目录无法统计？",
          "en": "Why are some folders unreadable?"
        },
        "a": {
          "zh": "macOS 隐私权限可能限制访问。应用会明确标记遗漏，可按需在系统设置允许完整磁盘访问；它不会将遗漏当作零占用。",
          "en": "macOS privacy permissions may restrict access. The app reports gaps and links to Full Disk Access settings rather than treating unreadable content as zero usage."
        }
      },
      {
        "q": {
          "zh": "支持应用内更新吗？",
          "en": "Are in-app updates supported?"
        },
        "a": {
          "zh": "支持通过官网签名更新源检查更新。下载与安装需要你决定，更新包在解压前验证签名，不发送系统概况。",
          "en": "Yes. Updates use the signed website feed and require your decision to download and install. Update signatures are verified before extraction; system profiles are not sent."
        }
      }
    ]
  },
