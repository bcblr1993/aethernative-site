title: { zh: 隐私政策, en: Privacy Policy }
heading: { zh: "你的设备，\n完全由你掌控。", en: "Your device.\nCompletely private." }
meta: { zh: 适用于 AetherSwitch 客户端, en: Applies to AetherSwitch }
lead:
  zh: AetherSwitch 在本机采集并显示系统指标，不包含数据埋点、统计分析或指标遥测。应用只会访问官网获取更新清单，并在你更新时从 GitHub 下载安装包。
  en: AetherSwitch collects and displays system metrics locally, without analytics or metric telemetry. It only contacts our website for the update feed, and GitHub when you download an update.
sections:
  - heading: { zh: 硬件数据采集, en: Hardware Metrics }
    body:
      - zh: 所有 CPU、GPU、RAM、磁盘及网速数据均通过 macOS 本地 Mach 内核与 IOKit 接口在内存中瞬时计算显示，绝不进行本地持久化落盘，更不会向任何远程服务器回传。
        en: All CPU, GPU, RAM, disk and network bandwidth rates are computed transiently in memory via macOS Mach kernel and IOKit APIs. Nothing is ever written to disk or sent to remote servers.
  - heading: { zh: 系统开关控制, en: System Toggles }
    body:
      - zh: 快捷开关仅直接调用系统公开命令与原生 IOKit 接口（修改访达偏好或声明屏幕防休眠断言），不采集、不干预任何用户个人文件或浏览记录。
        en: Toggles interact solely with public system APIs (Finder defaults and IOKit assertions). The app does not access, modify, or inspect any of your personal files or browsing history.
  - heading: { zh: 更新检查, en: Update Checks }
    body:
      - zh: 应用使用 Sparkle 做在线更新，默认每天在后台访问一次 https://aethernative.com 获取已签名的更新清单，你也可以随时在右键菜单关闭“自动检查更新”。请求不附带系统指标、硬件信息或个人信息（已关闭系统信息上报）。
        en: The app uses Sparkle for in-app updates. By default it fetches a signed update feed from https://aethernative.com once a day in the background; you can turn off Automatic Update Checks from the right-click menu at any time. Requests carry no metrics, hardware profile or personal data (system profiling is disabled).
      - zh: 只有当你选择更新时，才会从对应的 GitHub Release 下载安装包；更新清单和安装包都带有签名，校验失败的更新不会被安装。
        en: The installer is downloaded from the matching GitHub release only when you choose to update. Both the feed and the archive are signed, and updates that fail verification are never installed.
  - heading: { zh: 问题与建议, en: Contact }
    links:
      - { label: GitHub Issues ↗, href: "https://github.com/bcblr1993/AetherSwitch/issues" }
