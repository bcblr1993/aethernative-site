faq:
  eyebrow: FAQ
  title: { zh: 常见问题, en: Questions }
  lead: { zh: 关于 AetherSwitch 的常见问题与设计细节。, en: Answers to common questions about AetherSwitch. }
  items:
    - q: { zh: AetherSwitch 与 Stats / One Switch 有什么不同？, en: How does AetherSwitch differ from Stats and One Switch? }
      a: { zh: Stats 功能强大但代码库庞大、后台采样较重；One Switch 是闭源商业软件且包含大量日常无需的功能。AetherSwitch 将最常用的 4 大高频开关与核心 5 栏硬件监控完美融合成一个不到 1MB 的纯原生 App，空载内存仅 15MB，后台 CPU ≤ 0.1%。, en: Stats is versatile but heavy, while One Switch is a paid app with many toggles you rarely need. AetherSwitch combines the top 4 essential toggles and 5-column hardware monitoring into a 1MB native utility with under 15MB RAM and ≤0.1% background CPU. }
    - q: { zh: 保持常亮（Keep Awake）会导致系统意外不休眠吗？, en: Does Keep Awake cause unintended battery drain or sleep failure? }
      a: { zh: 不会。AetherSwitch 采用系统底层原生 IOKit 电源断言（IOPMAssertionCreateWithName），关闭开关或直接退出 App 时操作系统会立即自动释放断言，绝不会残留任何后台脚本或阻碍系统正常休眠。, en: No. AetherSwitch uses native IOKit power assertions. Toggling off or quitting the app immediately releases the assertion, preventing orphaned scripts or sleep blockage. }
    - q: { zh: 为什么 Apple Silicon 上的 GPU 监控不再频繁跳 0%？, en: Why does the GPU monitor no longer jump down to 0%? }
      a: { zh: Apple 统一内存架构下，轻量任务的 GPU 占用往往极其短暂，常规瞬态采样很容易恰好抓到 0%。AetherSwitch 搭载独创的 Peak-Hold 衰减平滑滤波算法，既能捕捉瞬时峰值，又能平滑回落，呈现真实流畅的图形负载。, en: On Apple Silicon unified memory, GPU activity from lightweight tasks is brief and instantaneous, causing discrete samplers to record 0%. AetherSwitch employs proprietary Peak-Hold decay filtering to capture peaks while smoothly decaying, reflecting realistic workloads. }
    - q: { zh: 会收集或上传我的任何隐私数据吗？, en: Does it collect or upload any personal data? }
      a: { zh: 绝不收集。AetherSwitch 100% 离线运行，无任何服务器、无数据分析埋点、无远程遥测。所有监控数据均通过系统公开内核接口在内存中瞬时计算展示，不落盘、不回传。, en: Absolutely not. AetherSwitch runs 100% offline with no servers, no analytics, and no telemetry. All metrics are computed transiently in memory via public kernel APIs. }

