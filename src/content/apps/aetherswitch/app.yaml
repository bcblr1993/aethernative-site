# AetherSwitch 软件介绍
name: AetherSwitch
order: 4
repo: https://github.com/bcblr1993/AetherSwitch
minimumSystemVersion: "14.0"
icon: ./media/icon.png
tech: [Swift 6, AppKit, Mach, IOKit]

tagline:
  zh: 极轻量 macOS 状态监控与高频快捷开关
  en: Ultra-lightweight macOS status monitor & essential quick toggles

summary:
  zh: "Apple 芯片 Mac 的原生状态栏工具：一眼查看 CPU、GPU、内存、磁盘和双向网速，点开面板查看详情并使用 4 个常用系统开关。"
  en: "A native menu bar utility for Apple silicon Macs: glance at CPU, GPU, memory, storage and network rates, then open detailed views and four system toggles."

platforms:
  - id: mac
    status: available
    requirement: { zh: Apple 芯片 · macOS 14+, en: Apple silicon · macOS 14+ }

cardStats:
  - value: "≈ 15 MB"
    label: { zh: 空载驻留内存, en: Idle Footprint }
  - value: "≤ 0.1%"
    label: { zh: 后台 CPU 占用, en: Background CPU }
  - value: "0 依赖"
    label: { zh: 纯原生系统底座, en: Zero Dependencies }

hero:
  eyebrow: { zh: 极简 · 零依赖 · 极致低耗, en: Minimal · Zero Dependencies · Ultra-Low Overhead }
  title: { zh: "告别臃肿堆叠，\n只需你真正用的功能。", en: "Say goodbye to bloat.\nOnly the features you actually use." }
  lead:
    zh: "折叠面板时，本机实测物理内存约 15 MB。\n原生菜单栏读数、五类详情和高频开关集中在一个轻巧工具中。"
    en: "The collapsed app used about 15 MB of physical memory in a local test.\nNative menu bar readings, five detail views and everyday toggles live in one compact utility."
  requirements:
    zh: Apple 芯片（M1 及更新）/ macOS 14+
    en: Apple silicon (M1 or later) / macOS 14+

showcase:
  eyebrow: { zh: 界面设计与交互体验, en: Interface and Experience }
  title: { zh: 抬眼即览系统脉搏，点按随心掌控。, en: System pulse at a glance, controls at your fingertips. }
  lead:
    zh: 告别臃肿后台常驻，将高频快捷开关与全方位硬件监控汇聚于纯净原生下拉面板。
    en: Strip away bloated background daemons. Essential quick toggles and comprehensive hardware telemetry in one native glassmorphism panel.
  note:
    zh: 截图由 AetherSwitch 原生视图直接渲染，数据来自本机实时采样；左侧为浅色外观，右侧为深色外观。
    en: Rendered from AetherSwitch's native views with live local readings; light appearance on the left, dark on the right.
  items:
    - title: { zh: 按需显示的菜单栏指标, en: Menu Bar Metrics You Choose }
      caption:
        zh: CPU、GPU、RAM、SSD 与上下行网速分栏显示，数字按利用率分 4 档变色；在各详情页即可开关对应指标，状态栏宽度随之收缩。
        en: CPU, GPU, RAM, SSD and network rates in aligned columns, colored in four load tiers; toggle each metric from its detail view and the status item shrinks to fit.
      image: ./media/menubar-zh.png
    - title: { zh: 4 大高频快捷开关，一触即发, en: 4 Essential Quick Toggles }
      caption:
        zh: 保持常亮（原生电源断言）、隐藏桌面、显示隐藏文件、深色模式一键瞬切；告别终端命令与臃肿工具。
        en: Keep screen awake, hide desktop icons, toggle dotfiles and switch dark appearance instantly — zero command-line hassles.
      image: ./media/toggles-zh.png
    - title: { zh: 概览四宫格与网络实时吞吐, en: Overview Dashboard & Network Bandwidth }
      caption:
        zh: CPU、GPU、RAM、SSD 四宫格与实时上下行速率集中在概览页。
        en: The overview brings CPU, GPU, RAM and SSD cards together with live upload and download rates.
      image: ./media/overview-zh.png
    - title: { zh: CPU 利用率与历史, en: CPU Usage & History }
      caption:
        zh: 查看用户、系统、空闲及能效/性能核心利用率，配有实时历史曲线和系统负载均值。
        en: Inspect user, system, idle and efficiency/performance core usage with a live history chart and load averages.
      image: ./media/cpu-zh.png
    - title: { zh: Apple 芯片 GPU 利用率, en: Apple Silicon GPU Usage }
      caption:
        zh: 直接显示系统提供的 GPU、渲染器和 Tiler 瞬时利用率；不可用时明确标注。
        en: Displays the system-provided GPU, renderer and Tiler utilization readings, with clear unavailable states.
      image: ./media/gpu-zh.png
    - title: { zh: RAM 内存分段占用与压力指示, en: RAM Segmentation & Pressure Ring }
      caption:
        zh: 展示已用、应用、联结、压缩和可用内存，以及系统内存压力等级与历史曲线。
        en: Shows used, app, wired, compressed and available memory, plus the system pressure level and usage history.
      image: ./media/ram-zh.png
    - title: { zh: 磁盘容量与读写速率, en: Disk Capacity & Throughput }
      caption:
        zh: 显示物理磁盘读写速率与历史曲线，以及 APFS 共享容器的已用与可用空间。
        en: Shows physical disk read and write rates with history, plus used and free space in the shared APFS container.
      image: ./media/disk-zh.png

features:
  eyebrow: { zh: 核心优势, en: Core Strengths }
  title: { zh: 原生监控与快捷控制，集中在菜单栏。, en: Native monitoring and controls in the menu bar. }
  lead:
    zh: 使用 macOS 原生系统接口采样，并在弹出面板中提供各指标的历史曲线与细分信息。
    en: Samples through native macOS APIs and presents history charts and detailed readings in the popover.
  items:
    - kicker: { zh: 4 大快捷开关, en: 4 Instant Toggles }
      title: { zh: 解决高频痛点，一触即发, en: Tackle daily friction with a single click }
      body:
        zh: 包含保持屏幕常亮、隐藏桌面图标、显示 Finder 隐藏文件与深色模式切换。
        en: Keep screen awake, hide desktop icons, toggle hidden dotfiles and switch dark mode with zero friction.
      details:
        - { zh: 保持常亮基于原生 IOKit 电源断言（IOPMAssertion），退出即自动归还，绝不残留僵尸子进程。, en: Keep Awake uses native IOKit power assertions, releasing cleanly upon exit. }
        - { zh: 隐藏桌面一键收起杂乱文件，录屏与投屏演示更清爽专业。, en: Clear cluttered desktop icons instantly for clean screencasts and presentations. }
        - { zh: 显示隐藏文件一键切换访达点文件，无需终端重复输入 defaults 命令。, en: Toggle dotfiles in Finder without repetitive terminal defaults commands. }
    - kicker: { zh: 5 栏 Stats 菜单栏, en: 5-Column Stats Menubar }
      title: { zh: 等宽防抖排版，抬头即知系统脉搏, en: Monospaced layout, glanceable system health }
      body:
        zh: 菜单栏展示 CPU、GPU、RAM、SSD 占比与双向网速，点击后打开适配浅色与深色外观的原生面板。
        en: The menu bar shows CPU, GPU, RAM, SSD and both network rates; clicking opens a native popover for light and dark appearances.
      details:
        - { zh: "数字按利用率 4 档变色：低于 50% 绿色、50–70% 黄色、70–85% 橙色、85% 以上红色，浅色与深色菜单栏分别调校色值。", en: "Values change color in four tiers: green below 50%, yellow 50–70%, orange 70–85% and red above 85%, tuned separately for light and dark menu bars." }
        - { zh: 在 CPU、GPU、内存、磁盘与网络详情页可单独选择是否在菜单栏显示，全部关闭时只保留图标入口。, en: Choose which metrics appear in the menu bar from each detail view; with all of them off, only the icon remains. }
        - { zh: 纯原生系统字体排版，杜绝数字跳动与截断省略号问题。, en: Native system font alignment prevents numeric jitter and truncation ellipsis. }
    - kicker: { zh: 智能能耗调度, en: Adaptive Power Management }
      title: { zh: 折叠深度休眠，后台 CPU 占用 ≤ 0.1%, en: "Deep sleep when collapsed, idle CPU ≤ 0.1%" }
      body:
        zh: 独创自适应采样调度机制，在面板收起时彻底停止 GPU 与 CPU 多核轮询，杜绝任何不必要的电池消耗。
        en: Proprietary adaptive scheduler puts GPU and multi-core polling to sleep when collapsed, eliminating background battery drain.
      details:
        - { zh: 本机折叠状态连续监测了 CPU 时间、物理内存和主线程响应，详情面板另行逐页验收。, en: Local collapsed-state checks measure CPU time, physical memory and main-thread response; detail views are checked separately. }
        - { zh: 纯原生 Swift 6 编译，零外部二进制依赖，空载常驻物理内存仅约 15MB。, en: Compiled with pure Swift 6 and zero external libraries, running in ~15MB idle physical memory. }

benchmarks:
  eyebrow: { zh: 实测数据, en: Benchmarks }
  title: { zh: 在真实 Mac 上检查资源占用。, en: Resource usage measured on a real Mac. }
