# AetherSwitch 软件介绍
name: AetherSwitch
order: 4
repo: https://github.com/bcblr1993/AetherSwitch
minimumSystemVersion: "14.0"
sparklePublicKey: Ks+dYalMGrthBEP6rSTv8Cjs9Um5R9a5VO6cXH6tDq0=
# 软件开启了 SURequireSignedFeed，更新清单必须原样转发软件自己签名的 appcast.xml
appcastMode: mirror
icon: ./media/icon.png
tech: [Swift 6, AppKit, AppIntents, Mach, IOKit, Sparkle]

tagline:
  zh: 极轻量 macOS 状态监控与高频快捷开关
  en: Ultra-lightweight macOS status monitor & essential quick toggles

summary:
  zh: "Apple 芯片 Mac 的原生中英双语状态栏工具：支持 6 项菜单栏指标按需组合，展开查看进程、风扇、SoC 功耗、充电瓦数与零权限蓝牙外设电量；集成多显示器独立亮度抽屉、限时常亮与 4 个高频开关、原生 AppIntents 快捷指令与 Spotlight，以及低电量/高温自适应节能守护。"
  en: "A native bilingual (English & Simplified Chinese) menu bar utility for Apple silicon Macs: customize up to six menu bar metrics, inspect processes, fan RPM, SoC power, charging wattage and zero-permission Bluetooth accessory batteries, with a per-display brightness drawer, timed Keep Awake, native AppIntents for Shortcuts & Spotlight, and adaptive low-power/thermal throttling."

platforms:
  - id: mac
    status: available
    requirement: { zh: Apple 芯片 · macOS 14+, en: Apple silicon · macOS 14+ }

cardStats:
  - value: "≤ 50 MB"
    label: { zh: 物理内存峰值门槛, en: Peak Footprint Gate }
  - value: "≤ 0.1%"
    label: { zh: 后台 CPU 占用, en: Background CPU }
  - value: "原生底座"
    label: { zh: 纯原生系统底座, en: Native Frameworks }

hero:
  eyebrow: { zh: 极简 · 原生 · 低耗, en: Minimal · Native Frameworks · Ultra-Low Overhead }
  title: { zh: "告别臃肿堆叠，\n只需你真正用的功能。", en: "Say goodbye to bloat.\nOnly the features you actually use." }
  lead:
    zh: "按需采样，折叠态常驻约 14 MB，发布前逐页验证全量弹窗物理内存峰值 ≤ 50 MB。\n6 项可定制菜单栏指标、六类深度详情与高频开关集中在一个轻巧工具中。"
    en: "On-demand sampling at ~14 MB collapsed with a strict ≤ 50 MB peak-footprint release gate.\nSix customizable menu bar metrics, six detail views and everyday toggles live in one compact utility."
  requirements:
    zh: Apple 芯片（M1 及更新）/ macOS 14+
    en: Apple silicon (M1 or later) / macOS 14+

showcase:
  eyebrow: { zh: 界面设计与交互体验, en: Interface and Experience }
  title: { zh: "抬眼即览系统脉搏，点按随心掌控。", en: "System pulse at a glance, controls at your fingertips." }
  lead:
    zh: 告别臃肿后台常驻，将高频快捷开关与全方位硬件监控汇聚于纯净原生下拉面板。
    en: Strip away bloated background daemons. Essential quick toggles and comprehensive hardware telemetry in one native glassmorphism panel.
  note:
    zh: 截图由 AetherSwitch 原生视图直接渲染，数据来自本机实时采样，网络地址已脱敏；图库包含浅色与深色外观。
    en: Rendered from AetherSwitch's native views with live local readings and anonymized network addresses; the gallery includes light and dark appearances.
  items:
    - title: { zh: 按需显示的 6 项菜单栏指标, en: 6 Customizable Menu Bar Metrics }
      caption:
        zh: 支持 CPU、GPU、RAM、SSD、温度与上下行网速 6 项指标自由开关与排序；首次启动默认精简为高频 3 列（CPU、RAM、网速）防止刘海屏遮挡，数值按利用率、内存压力或专属热状态独立着色。
        en: Freely toggle and reorder CPU, GPU, RAM, SSD, temperature and network rates; defaults to 3 essential columns on first launch to fit notched MacBooks, with utilization, memory-pressure and thermal color mapping.
      image: ./media/menubar-zh.png
    - title: { zh: 4 大高频快捷开关，一触即发, en: 4 Essential Quick Toggles }
      caption:
        zh: 保持常亮（原生电源断言）、隐藏桌面、显示隐藏文件、深色模式一键瞬切；告别终端命令与臃肿工具。
        en: Keep screen awake, hide desktop icons, toggle dotfiles and switch dark appearance instantly — zero command-line hassles.
      image: ./media/toggles-zh.png
    - title: { zh: "概览看板、温控风扇与网络实时吞吐", en: "Overview Dashboard, Thermal/Fan & Bandwidth" }
      caption:
        zh: CPU、GPU、RAM、SSD 概览卡片、系统状态条（热状态、风扇转速、Swap 与运行时长）及实时上下行速率集中在概览页。
        en: The overview brings CPU, GPU, RAM and SSD cards together with a compact thermal/fan status strip and live upload/download rates.
      image: ./media/overview-zh.png
    - title: { zh: "CPU 利用率、传感器温度与风扇转速", en: "CPU Usage, Thermal Sensors & Fan RPM" }
      caption:
        zh: 查看用户、系统、空闲及能效/性能核心利用率，集成 Apple Silicon SMC 传感器温度、只读风扇转速、实时历史曲线和系统负载均值。
        en: Inspect user, system, idle and efficiency/performance core usage with Apple silicon SMC temperatures, read-only fan RPM, live history and load averages.
      image: ./media/cpu-zh.png
    - title: { zh: Apple 芯片 GPU 利用率, en: Apple Silicon GPU Usage }
      caption:
        zh: 直接显示系统提供的 GPU、渲染器和 Tiler 瞬时利用率；不可用时明确标注。
        en: Displays the system-provided GPU, renderer and Tiler utilization readings, with clear unavailable states.
      image: ./media/gpu-zh.png
    - title: { zh: RAM 内存分段占用与压力指示, en: RAM Segmentation & Pressure Ring }
      caption:
        zh: 展示已用、应用、联结、压缩和可用内存，以及系统内存压力等级与历史曲线。
        en: Shows used, app, wired, compressed and available memory, plus the system pressure level and usage history.
      image: ./media/ram-zh.png
    - title: { zh: 磁盘容量与读写速率, en: Disk Capacity & Throughput }
      caption:
        zh: 显示物理磁盘读写速率与历史曲线，以及 APFS 共享容器的已用与可用空间。
        en: Shows physical disk read and write rates with history, plus used and free space in the shared APFS container.
      image: ./media/disk-zh.png
    - title: { zh: 网络接口与连接详情, en: Network Interface Details }
      caption:
        zh: 自动跟随主接口或手动选择，查看双向速率、IPv4、Wi-Fi 连接信息和本次监测累计流量。
        en: Follow the primary interface or choose one, with rates, IPv4, Wi-Fi details and monitored transfer totals.
      image: ./media/network-light.png
    - title: { zh: "原生电池、充电瓦数与零权限外设电量", en: "Native Battery, Wattage & Zero-Permission Accessory Power" }
      caption:
        zh: 电量、充电状态、充电器瓦数、瞬时充放电功率、健康度与循环次数，并基于零权限 IOKit 只读展示蓝牙键鼠、触控板与耳机电量（60 秒按需缓存，无蓝牙隐私弹窗）。
        en: Charge, power state, adapter wattage, live battery power, health and cycles, plus zero-permission IOKit readings for Bluetooth mice, trackpads, keyboards and headphones (60s on-demand cache, no Bluetooth privacy prompts).
      image: ./media/battery-light.png

features:
  eyebrow: { zh: 核心优势, en: Core Strengths }
  title: { zh: 原生监控与快捷控制，集中在菜单栏。, en: Native monitoring and controls in the menu bar. }
  lead:
    zh: 使用 macOS 原生系统接口采样，并在弹出面板中提供各指标的历史曲线与细分信息。
    en: Samples through native macOS APIs and presents history charts and detailed readings in the popover.
  items:
    - kicker: { zh: "快捷开关 · 分屏亮度 · AppIntents", en: "Quick Toggles · Per-Display Brightness · AppIntents" }
      title: { zh: "高频控制一触即发，深度融入 macOS 生态", en: "Effortless daily control, deeply integrated with macOS" }
      body:
        zh: 集成 4 大快捷开关、多显示器独立亮度抽屉与原生 AppIntents，支持通过快捷指令与 Spotlight 一键自动化调度。
        en: Combines four instant toggles, an on-demand per-display brightness drawer and native AppIntents for Shortcuts and Spotlight automation.
      details:
        - { zh: "保持常亮基于原生 IOKit 内核超时电源断言（IOPMAssertion），支持无限期 / 30 分钟 / 1 小时 / 2 小时定时与低电量（≤ 20%）自动释放，零应用内轮询定时器，退出即归还。", en: "Keep Awake uses native IOKit kernel-timed power assertions with Indefinite / 30m / 1h / 2h presets and ≤ 20% low-battery auto-release, zero in-app polling timers, and clean release on exit." }
        - { zh: "多显示器独立亮度抽屉按需展开，独立微调内置屏与各外接屏（DDC/原生），并可随时开关「外屏跟随系统自动亮度」，收起后即刻销毁子视图零内存滞留。", en: "On-demand per-display brightness drawer adjusts built-in and external displays (DDC/native) independently with a toggle for system auto-brightness following, releasing drawer views immediately on collapse." }
        - { zh: "原生 AppIntents 接入快捷指令与 Spotlight：支持一键开启限时常亮、演示模式（隐藏桌面图标 + 屏幕常亮原子联动）及获取结构化系统状态快照。", en: "Native AppIntents power Shortcuts and Spotlight: enable timed Keep Awake, toggle Presentation Mode (atomic hide-desktop + Keep Awake) and fetch a structured system status snapshot." }
    - kicker: { zh: "6 项 Stats 菜单栏指标与零权限外设电量", en: "6-Metric Stats Menubar & Accessory Batteries" }
      title: { zh: "等宽防抖与精简默认列，契合刘海屏 Mac", en: "Monospaced layout, notch-friendly out of the box" }
      body:
        zh: 支持 CPU、GPU、内存、磁盘、温度与双向网速 6 项菜单栏指标自由组合与排序，面板内同步提供只读风扇转速、SoC 功耗与零权限蓝牙外设电量。
        en: Supports CPU, GPU, memory, storage, temperature and network rates in customizable columns, plus read-only fan RPM, SoC power and zero-permission Bluetooth accessory battery readings inside the panel.
      details:
        - { zh: "负载指标按 4 档利用率变色，温度指标采用独立量程（25–110°C）与专属热状态色彩映射，浅色与深色菜单栏分别调校色值。", en: "Utilization uses four color tiers while temperature uses a dedicated 25–110°C scale and thermal color mapping, tuned separately for light and dark menu bars." }
        - { zh: "首次启动默认开启高频精简 3 列（CPU、内存与网速）防止 MacBook 刘海屏截断隐藏；可在详情页或菜单栏外观设置中任意开关排序，全部关闭时只保留图标入口。", en: "Defaults to 3 essential columns (CPU, memory and network) on first launch to avoid MacBook notch clipping; toggle or reorder all six metrics anytime, or keep only the icon." }
        - { zh: "零权限只读外设电量仅通过原生 IOKit IOPS 与 IORegistry 采集键鼠、触控板与耳机电量，不引入 CoreBluetooth、零蓝牙权限弹窗，60 秒按需缓存仅在电池页采样。", en: "Zero-permission accessory battery monitoring reads mice, trackpads, keyboards and headphones via native IOKit IOPS and IORegistry—no CoreBluetooth, no Bluetooth permission prompt, cached for 60s only on the Battery tab." }
    - kicker: { zh: "低电量 / 高温自适应节能守护", en: "Adaptive Power & Thermal Guard" }
      title: { zh: "折叠深度休眠与事件驱动降频，后台 CPU ≤ 0.1%", en: "Event-driven throttling & deep sleep, idle CPU ≤ 0.1%" }
      body:
        zh: 面板收起时彻底停止 GPU、多核 CPU 与未显示传感器轮询；系统进入低电量模式或高温热压力时自动将折叠态采样间隔翻倍，展开后即刻恢复流畅交互。
        en: Detail readers sleep completely when collapsed; event-driven listeners automatically double the folded sampling interval in Low Power Mode or under serious/critical thermal pressure, restoring 1.0x responsiveness when opened.
      details:
        - { zh: "100% 监听系统低电量与热状态通知（零轮询定时器），折叠态自动启用 2.0x 节能降频并在概览系统状态条提供双语提示。", en: "100% notification-driven for Low Power Mode and thermal state transitions (zero polling timers), activating 2.0x folded throttling with a bilingual indicator in the overview strip." }
        - { zh: "纯原生 Swift 6 + 系统框架架构（仅内嵌唯一在线更新组件 Sparkle），折叠态常驻内存约 14 MB，全量详情弹窗物理内存峰值严格 ≤ 50 MB。", en: "Built on pure Swift 6 and native macOS frameworks (with Sparkle as the sole updater component), idling around ~14 MB collapsed with a strict ≤ 50 MB peak physical footprint across all popovers." }

