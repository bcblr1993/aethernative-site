showcase:
  eyebrow: { zh: 界面设计与交互体验, en: Interface and Experience }
  title: { zh: 抬眼即览系统脉搏，点按随心掌控。, en: System pulse at a glance, controls at your fingertips. }
  lead:
    zh: 告别臃肿后台常驻，将高频快捷开关与全方位硬件监控汇聚于纯净原生下拉面板。
    en: Strip away bloated background daemons. Essential quick toggles and comprehensive hardware telemetry in one native glassmorphism panel.
  note:
    zh: 截图采集自 AetherSwitch 原生运行界面，各项监控数据由系统 Mach 内核与 IOKit 原生实时采样。
    en: Captured directly from the running AetherSwitch native interface, sampled in real time via Darwin Mach kernel and IOKit.
