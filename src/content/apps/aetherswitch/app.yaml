  zh: 极轻量 macOS 状态监控与高频快捷开关
  en: Ultra-lightweight macOS status monitor & essential quick toggles

summary:
  zh: "为 Apple 芯片量身打造的极简原生工具：五栏独立 Stats 状态栏与实时上下行网速抬头可见，常亮、隐藏桌面等 4 大开关一触即发，空载常驻物理内存仅约 15MB。"
  en: "A featherweight native companion engineered exclusively for Apple silicon: 5-column menu bar monitor and live bandwidth at a glance, plus 4 essential toggles in ~15MB memory."

