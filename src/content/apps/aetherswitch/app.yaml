    - value: "≤ 50 MB"
      label: { zh: 物理内存峰值验收门槛, en: Peak Physical Footprint Gate }
      note: { zh: "折叠态约 14 MB；发布前覆盖全详情页、设置窗与更新器", en: "~14 MB collapsed; checked across all detail pages, settings and updater" }
    - value: "6 项"
      label: { zh: 菜单栏指标与详情页, en: Menu Bar Metrics & Views }
      note: { zh: "CPU、GPU、内存、磁盘、温度、网速及风扇/电池详情", en: "CPU, GPU, memory, disk, temperature, network plus fan & battery details" }
    - value: "Swift 6"
      label: { zh: 纯原生系统底座, en: Native System Frameworks }
      note: { zh: "零重量级依赖，仅内嵌 Sparkle 签名更新组件", en: "Pure native APIs with Sparkle as sole signed updater" }

faq:
  eyebrow: FAQ
  title: { zh: 常见问题, en: Questions }
  lead: { zh: 关于 AetherSwitch 的常见问题与设计细节。, en: Answers to common questions about AetherSwitch. }
  items:
    - q: { zh: "AetherSwitch 与 Stats / One Switch 有什么不同？", en: "How does AetherSwitch differ from Stats and One Switch?" }
      a: { zh: "AetherSwitch 将 6 项菜单栏硬件指标（CPU、GPU、内存、磁盘、温度、网速）、六类独立详情页（含进程与只读风扇转速）、同步外屏亮度以及 4 个常用系统开关汇聚在同一个极轻量原生工具里，首次启动默认精简 3 列适配刘海屏。Stats 提供更丰富的全量模块与自定义项，可按需求选择。", en: "AetherSwitch brings six menu bar metrics (CPU, GPU, memory, disk, temperature and network), six detail views (including top processes and read-only fan RPM), synchronized display brightness and four everyday system toggles into one lightweight native app, defaulting to 3 notch-friendly columns on first launch. Stats offers broader customization modules if needed." }
    - q: { zh: "保持常亮（Keep Awake）会导致系统意外不休眠吗？", en: "Does Keep Awake cause unintended battery drain or sleep failure?" }
      a: { zh: "不会。AetherSwitch 采用系统底层原生 IOKit 电源断言（IOPMAssertionCreateWithName），关闭开关或直接退出 App 时操作系统会立即自动释放断言，绝不会残留任何后台脚本或阻碍系统正常休眠。", en: "No. AetherSwitch uses native IOKit power assertions. Toggling off or quitting the app immediately releases the assertion, preventing orphaned scripts or sleep blockage." }
    - q: { zh: "为什么 Apple Silicon 上的 GPU 监控不再频繁跳 0%？", en: "Why does the GPU monitor no longer jump down to 0%?" }
      a: { zh: "AetherSwitch 展示系统 IOAccelerator 提供的瞬时读数，不人为抬高或延长峰值。轻量任务可能在采样间隔之间完成，此时读数为 0% 是正常现象。", en: "AetherSwitch displays instantaneous readings from IOAccelerator without extending peaks. Short tasks may finish between samples, so an occasional 0% reading is expected." }
    - q: { zh: "会收集或上传我的任何隐私数据吗？", en: "Does it collect or upload any personal data?" }
      a: { zh: "系统指标只在本机采集和展示，不上传遥测。应用每天会访问一次官网获取已签名的更新清单（可在右键菜单关闭“自动检查更新”），清单请求不包含系统指标或个人信息；下载更新时才会从 GitHub Release 获取安装包。", en: "System metrics are collected and displayed locally without telemetry. Once a day the app fetches a signed update feed from our website (you can turn off Automatic Update Checks in the right-click menu); the request carries no metrics or personal data, and the installer is downloaded from GitHub Releases only when you update." }
    - q: { zh: "如何更新 AetherSwitch？需要手动下载覆盖吗？", en: "How do I update AetherSwitch? Do I need to download and replace it manually?" }
      a: { zh: "不需要。点击面板底部的“检查更新”（或右键菜单中的“检查更新”），发现新版本后按提示下载，安装完成会自动重新启动。更新包和更新清单都经过签名校验。1.3.0 之前的版本不含在线更新，需要手动安装 1.3.0 一次。", en: "No. Click Check for Updates at the bottom of the panel (or in the right-click menu); when a new version is found, follow the prompts to download it and the app restarts automatically after installing. Both the update archive and the feed are signature-verified. Versions before 1.3.0 have no in-app updates, so install 1.3.0 manually once." }

