  title: { zh: 告别臃肿，体验极致纯粹的 Mac 状态控制。, en: Eliminate the bloat. Experience pure native Mac control. }
  note: { zh: 适用于 Apple 芯片 Mac · macOS 14.0+ · Swift 6 原生底座 · Sparkle 更新, en: For Apple silicon Mac · macOS 14.0+ · Native Swift 6 · Sparkle Updates }
