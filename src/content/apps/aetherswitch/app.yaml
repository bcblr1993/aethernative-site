    zh: 折叠面板在本机持续采样并检查主线程响应；详情面板在本机及另一台 Apple 芯片 Mac 上逐页测试。
    en: The collapsed app was sampled locally with responsiveness checks, and detail views were exercised on two Apple silicon Macs.
