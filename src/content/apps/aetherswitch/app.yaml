        en: Dedicated columns for CPU, GPU, RAM, SSD and network throughput. Monospaced SF Pro Semibold typography eliminates jitter and text truncation.
      image: ./media/menubar-zh.png
    - title: { zh: 概览面板与 4 大高频开关, en: Overview Panel & 4 Core Toggles }
      caption:
        zh: 保持常亮（原生电源断言）、隐藏桌面、显示隐藏文件、深色模式一键瞬切；搭配硬件监控四宫格与实时速率。
        en: Keep screen awake, hide desktop icons, toggle dotfiles and switch dark appearance instantly, alongside 4 core hardware status cards.
      image: ./media/overview-zh.png
    - title: { zh: CPU 深度监控与核心拓扑, en: CPU Deep Telemetry & Topology }
      caption:
        zh: 实时呈现能效核 (E-Core) 与性能核 (P-Core) 柱状图、多核拓扑与负载历史折线波形。
        en: Real-time Efficiency/Performance core bars, multi-core utilization topology and rolling historical wave.
      image: ./media/cpu-zh.png
