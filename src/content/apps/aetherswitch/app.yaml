features:
  eyebrow: { zh: 核心优势, en: Core Strengths }
  title: { zh: 原生纯粹，每一行代码都为性能而生。, en: Purely native. Every line crafted for performance. }
  lead:
    zh: 砍掉一切花哨无用的图表和臃肿后台，用纯原生系统底座带来毫秒级交互体验。
    en: Stripped of bloated background services and redundant layers. Pure system-level Mach and IOKit calls for sub-millisecond responsiveness.
  items:
    - kicker: { zh: 4 大快捷开关, en: 4 Instant Toggles }
      title: { zh: 解决高频痛点，一触即发, en: Tackle daily friction with a single click }
      body:
        zh: 包含保持屏幕常亮、隐藏桌面图标、显示 Finder 隐藏文件与深色模式切换。
        en: Keep screen awake, hide desktop icons, toggle hidden dotfiles and switch dark mode with zero friction.
      details:
        - { zh: 保持常亮基于原生 IOKit 电源断言（IOPMAssertion），退出即自动归还，绝不残留僵尸子进程。, en: Keep Awake uses native IOKit power assertions, releasing cleanly upon exit. }
        - { zh: 隐藏桌面一键收起杂乱文件，录屏与投屏演示更清爽专业。, en: Clear cluttered desktop icons instantly for clean screencasts and presentations. }
        - { zh: 显示隐藏文件一键切换访达点文件，无需终端重复输入 defaults 命令。, en: Toggle dotfiles in Finder without repetitive terminal defaults commands. }
    - kicker: { zh: 5 栏 Stats 菜单栏, en: 5-Column Stats Menubar }
      title: { zh: 等宽防抖排版，抬头即知系统脉搏, en: Monospaced layout, glanceable system health }
      body:
        zh: 菜单栏常驻展示 CPU、GPU、RAM、SSD 占比与双向上下行实时网速，无缝融入 macOS Sequoia 视觉风格。
        en: Menubar displays CPU, GPU, RAM, SSD and bi-directional network speed, seamlessly blending with macOS Sequoia design.
      details:
        - { zh: "动态变色阈值预警：正常低载青蓝、中载活力暖橙、高载高亮警示红，任何壁纸下均清晰可辨。", en: "Dynamic color thresholds: cyan for normal, amber for moderate, and vivid red for heavy loads." }
        - { zh: 纯原生系统字体排版，杜绝数字跳动与截断省略号问题。, en: Native system font alignment prevents numeric jitter and truncation ellipsis. }
    - kicker: { zh: 智能能耗调度, en: Adaptive Power Management }
      title: { zh: 折叠深度休眠，后台 CPU 占用 ≤ 0.1%, en: "Deep sleep when collapsed, idle CPU ≤ 0.1%" }
      body:
        zh: 独创自适应采样调度机制，在面板收起时彻底停止 GPU 与 CPU 多核轮询，杜绝任何不必要的电池消耗。
        en: Proprietary adaptive scheduler puts GPU and multi-core polling to sleep when collapsed, eliminating background battery drain.
      details:
        - { zh: "通过 6 小时极限无人值守监控：720 个周期 0 崩溃、0 内存泄漏、0 界面卡顿。", en: "Verified by 6-hour unattended stress test: 720 cycles with zero crashes, zero leaks, zero hangs." }
        - { zh: 纯原生 Swift 6 编译，零外部二进制依赖，空载常驻物理内存仅约 15MB。, en: Compiled with pure Swift 6 and zero external libraries, running in ~15MB idle physical memory. }

