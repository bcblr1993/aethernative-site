    - value: "≈ 15 MB"
      label: { zh: 空载常驻物理内存, en: Idle Physical Footprint }
      note: { zh: 本机折叠状态实测值, en: Measured locally with the popover closed }
    - value: "5 类"
      label: { zh: 详情面板, en: Detail Views }
      note: { zh: CPU、GPU、内存、磁盘与网络, en: CPU, GPU, memory, disk and network }
    - value: "0"
      label: { zh: 外部运行依赖, en: External Runtime Dependencies }
      note: { zh: 使用 Swift 与 macOS 系统框架, en: Built with Swift and macOS frameworks }

faq:
  eyebrow: FAQ
  title: { zh: 常见问题, en: Questions }
  lead: { zh: 关于 AetherSwitch 的常见问题与设计细节。, en: Answers to common questions about AetherSwitch. }
  items:
    - q: { zh: AetherSwitch 与 Stats / One Switch 有什么不同？, en: How does AetherSwitch differ from Stats and One Switch? }
      a: { zh: AetherSwitch 将五类硬件指标、独立详情页和四个常用系统开关放在同一个原生菜单栏工具里。Stats 提供更多监控与配置能力，可按需求选择。, en: AetherSwitch combines five hardware metrics, their detail views and four common system toggles in one native menu bar app. Stats offers broader monitoring and configuration options. }
    - q: { zh: 保持常亮（Keep Awake）会导致系统意外不休眠吗？, en: Does Keep Awake cause unintended battery drain or sleep failure? }
      a: { zh: 不会。AetherSwitch 采用系统底层原生 IOKit 电源断言（IOPMAssertionCreateWithName），关闭开关或直接退出 App 时操作系统会立即自动释放断言，绝不会残留任何后台脚本或阻碍系统正常休眠。, en: No. AetherSwitch uses native IOKit power assertions. Toggling off or quitting the app immediately releases the assertion, preventing orphaned scripts or sleep blockage. }
    - q: { zh: 为什么 Apple Silicon 上的 GPU 监控不再频繁跳 0%？, en: Why does the GPU monitor no longer jump down to 0%? }
      a: { zh: AetherSwitch 展示系统 IOAccelerator 提供的瞬时读数，不人为抬高或延长峰值。轻量任务可能在采样间隔之间完成，此时读数为 0% 是正常现象。, en: AetherSwitch displays instantaneous readings from IOAccelerator without extending peaks. Short tasks may finish between samples, so an occasional 0% reading is expected. }
    - q: { zh: 会收集或上传我的任何隐私数据吗？, en: Does it collect or upload any personal data? }
      a: { zh: 系统指标只在本机采集和展示，不上传遥测。主动检查或下载更新时，应用会连接 GitHub Release 服务；指标数据不会随请求发送。, en: System metrics are collected and displayed locally without telemetry. Checking for or downloading updates connects to GitHub Releases; metrics are not sent with those requests. }

cta:
  title: { zh: 告别臃肿，体验极致纯粹的 Mac 状态控制。, en: Eliminate the bloat. Experience pure native Mac control. }
  note: { zh: 适用于 Apple 芯片 Mac · macOS 14.0+ · 纯原生 Swift 6 零依赖, en: For Apple silicon Mac · macOS 14.0+ · Native Swift 6 Zero Dependencies }
