      caption:
        zh: 搭载独创 Peak-Hold 衰减平滑滤波算法，告别瞬态 0% 跳变；实时呈现渲染器利用率与平铺器负载。
        en: Proprietary Peak-Hold decay smoothing eliminates discrete 0% dropouts on Apple Silicon unified architecture.
      image: ./media/gpu-zh.png
    - title: { zh: RAM 内存分段占用与压力, en: RAM Segmentation & Pressure Ring }
      caption:
        zh: Mach 内核内存压力指示、4 段内存彩色环（App / 联动 / 压缩 / 可用）及高占用进程排行榜。
