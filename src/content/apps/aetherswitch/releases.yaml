        items:
          - zh: 从全黑恢复时重连唯一匹配的 DDC 接口，并对临时通信失败有限重试。
            en: Reopens the uniquely matched DDC connection after blackout and retries transient communication failures a bounded number of times.
          - zh: 正常退出恢复每屏原色彩曲线，保留其他软件或系统的新曲线并防止晚到操作再次全黑。
            en: Restores original per-display color curves on normal exit and preserves newer system or application curves while preventing late operations from blacking out displays again.
