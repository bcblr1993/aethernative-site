      - title:
          zh: "消除透明代理与 TUN 模式切换死锁"
          en: "Eliminate engine switching deadlocks"
        items:
          - zh: "重构模式切换逻辑，停止在切换中改写对方配置的偏好设置，彻底消除系统 nehelper 进程锁死与僵死假死问题。"
            en: "Eliminate nehelper deadlocks during mode switching by avoiding destructive preference modifications on opposing managers."
          - zh: "修复 macOS NetworkExtension 强校验拒绝 IPv6 回环路由（::1/128）导致的隧道启动挂起。"
            en: "Fix macOS NetworkExtension rejecting IPv6 loopback route in excluded routes."
          - zh: "引入系统扩展会话级激活缓存与防重入看门狗，切换秒级平滑响应。"
            en: "Add system extension activation caching and non-reentrant state guards for instant mode toggles."
      - title:
          zh: "全量节点并发测速与主线程流式防抖"
          en: "High-concurrency latency sweep and UI debouncing"
        items:
          - zh: "并发探测池提升至 32，TCP 握手超时优化至 1500ms，任务调度至专属并发队列，彻底避免全局 GCD 线程争抢。"
            en: "Boost probe concurrency to 32, optimize timeout to 1500ms, and route tasks to dedicated concurrent dispatch queue."
          - zh: "新增 latencyFlushTask 批量防抖，保证数百上千节点高速测速下 UI 60fps 丝滑渲染，并锁定原始配置节点顺序防止跳动。"
            en: "Introduce latencyFlushTask debouncing for smooth 60fps rendering and lock fixed source node ordering."
          - zh: "分层测速语义：全量流式可达性探测结合当前节点真实协议栈校验，单节点测速自底向上即时联动父级策略组。"
            en: "Layered reachability probes and active protocol verification with bottom-up cascade aggregation."
      - title:
          zh: "菜单栏终端代理快捷命令联动"
          en: "Menu bar dynamic terminal proxy command"
        items:
          - zh: "废弃快捷复制中硬编码的 7890 端口，联动读取当前用户实际配置的本地代理端口，同时补充防 DNS 泄露的 socks5h:// 与 NO_PROXY 环境变量。"
            en: "Dynamically link menu-bar shell commands to configured local proxy ports instead of hardcoded 7890, adding socks5h:// and NO_PROXY."
          - zh: "清空命令统一采用标准清理指令，确保环境变量安全还原。"
            en: "Standardize clear commands to safely restore shell environment variables."
