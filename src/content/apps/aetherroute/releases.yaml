            en: "Authorized by the maintainer for stable release following 100% pass across all virtual machine test suites."
  - version: "1.0.8"
    build: "2026091602"
    date: 2026-09-16
    channel: stable
    download: "https://github.com/bcblr1993/AetherRoute/releases/download/v1.0.8/AetherRoute-1.0.8-build-2026091602-arm64.dmg"
    github: "https://github.com/bcblr1993/AetherRoute/releases/tag/v1.0.8"
    sha256: "a5a8fb9dbccf4375f350082917ec4ecffb0f265d87c4fa48e1fd8d6290da4f99"
    badge:
      zh: "正式版 · 已通过 Apple 公证"
      en: "Release · Apple notarized"
    summary:
      zh: "支持连接中编辑与删除非活跃配置，彻底修复代理测速闪退与高延迟问题，增加 16 并发度控制与单节点测速，重构 3 秒平滑网络波形，完成 VM 实机测试。"
      en: "Support editing/removing inactive profiles while connected, fix latency test crashes and high latency, add 16-worker concurrency pool and per-node testing, refactor smooth 3s traffic waveform."
    notes:
      - title:
          zh: "连接中配置管理放宽"
          en: "Unrestricted profile management while connected"
        items:
          - zh: "放宽连接状态下的配置操作限制：在 TUN/代理运行期间，保护当前正在运行的活跃配置（禁止移除与重命名），同时允许对所有非活跃配置进行重命名、编辑配置或直接移除，无需频繁断开重连。"
            en: "Relax profile restrictions during active connection: the currently active profile remains protected from removal/rename, while all inactive profiles can be renamed, modified, or deleted without disconnecting the tunnel."
      - title:
          zh: "代理测速稳定性与性能优化"
          en: "Proxy latency testing stability and performance optimization"
        items:
          - zh: "彻底修复 Swift 6 Actor 隔离冲突引起的代理测速闪退问题，在 Task 回调与状态分发中严格保证主线程 Actor 隔离安全。"
            en: "Completely eliminate proxy latency testing crashes caused by Swift 6 Actor isolation conflicts, ensuring thread-safe state dispatch."
          - zh: "引入最大 16 并发度的滑动窗口控制，防止批量测速瞬时发起海量并发连接导致文件描述符耗尽或网络扩展流过载。"
            en: "Introduce a 16-worker sliding window concurrency pool to prevent socket exhaustion and packet tunnel stream overload during bulk latency testing."
          - zh: "优化测速探测端点为轻量 HTTP 204 无内容探针，消除多余 TLS 握手耗时，延迟测量结果全面对齐主流代理工具（50ms 级别），并修复 DIRECT 直连节点测速超时（20ms 秒测）。"
            en: "Switch latency probe target to a lightweight HTTP 204 endpoint to eliminate TLS handshake overhead, aligning latency readings to 50ms, and fix DIRECT node timeout with 20ms instant response."
          - zh: "节点列表支持独立的单节点测速，明确区分测速中、已响应、已超时和未测速四种状态，测速过程不干扰其他节点显示。"
            en: "Support independent single-node latency testing with distinct Testing, Responded, TimedOut, and Untested states without UI flickers across peer nodes."
      - title:
          zh: "网络波形图平滑重构与 3 秒刷新"
          en: "Smooth traffic waveform and 3-second refresh"
        items:
          - zh: "主界面网络波形图由高频抖动刷新重构为 3 秒平滑采样与同频渲染，消除视觉顿挫感。"
            en: "Refactor the traffic overview waveform from rapid jittery polling to smooth 3-second sampling and synchronized TimelineView rendering."
          - zh: "引入单调三次 Hermite 样条插值算法，彻底杜绝折线打结与曲线极值过冲，并增加左侧平滑贴底延展。"
            en: "Implement monotone cubic Hermite spline interpolation to eliminate loop knotting and overshoot, with a flat baseline lead-in."
      - title:
          zh: "虚拟机实机验证"
          en: "Virtual machine verification"
        items:
          - zh: "在 Apple 芯片 macOS 虚拟机中完成 v1.0.8 正式包的安装、系统扩展激活、物理网络链路断开 8 秒自愈与网络适配器出口动态切换实测，进程零重启、通道零阻塞。"
            en: "Verify v1.0.8 installation, system extension activation, 8-second physical link severance self-healing, and dynamic network adapter handoff in an Apple silicon VM with zero process restarts and uninterrupted connectivity."
          - zh: "实测连接中非活跃配置重命名与移除、DIRECT 与代理节点单测/全测，所有功能 100% 正常。"
            en: "Verify inactive profile rename/delete while connected, as well as single-node and bulk latency testing in the live environment."
      - title:
          zh: "发布说明"
          en: "Release information"
        items:
          - zh: "此正式包使用正常生产核心，经过 Developer ID 签名及 Apple 公证，不包含 QA 自动连接。"
            en: "This stable package uses the normal production core, is Developer ID signed and Apple notarized, and contains no QA auto-connect."
          - zh: "经维护者授权，在虚拟机详细测试全部通过后发布 v1.0.8 正式版。"
            en: "Authorized by the maintainer for stable release following 100% pass across all virtual machine test suites."
