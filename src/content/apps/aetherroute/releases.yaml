      - title:
          zh: 证书兼容性
          en: Certificate Compatibility
        items:
          - zh: VMess、VLESS、Trojan、AnyTLS、HTTP(S)、SOCKS5、Hysteria2、TUIC 支持证书指纹固定，握手签名始终验证。
            en: VMess, VLESS, Trojan, AnyTLS, HTTP(S), SOCKS5, Hysteria2 and TUIC honour certificate pins; handshake signatures are always verified.
          - zh: Hysteria2、TUIC 支持 ca / ca-str；导入配置时自动内联可读取的 CA 文件。
