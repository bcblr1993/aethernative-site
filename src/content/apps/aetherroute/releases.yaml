    summary:
      zh: "节点测速重构为分层显式语义，修复单节点测速未级联更新父策略组缺陷，菜单栏快捷复制联动用户代理端口，完成 VM 全量模式矩阵及场景测试。"
      en: "Refactor latency measurement into explicit layers, cascade aggregation to parent strategy groups, dynamic menu-bar proxy shell commands, verified with full VM matrix."
