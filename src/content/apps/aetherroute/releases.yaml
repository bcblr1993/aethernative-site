          en: "Physical and VM full verification"
        items:
          - zh: "在物理机器（Apple M系列）与 Tart 虚拟机中完成 6 种运行模式矩阵（TUN / 透明代理 × 规则 / 全局 / 直连）全量回归，全部通过。"
