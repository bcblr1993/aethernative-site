          zh: "测速层级解耦与底库节点诊断专区"
          en: "Decoupled speedtest scopes and diagnostic registry"
        items:
          - zh: "彻底区分顶层“全部测速”与组内“测试延迟”，在顶层明确标注全局全组测速范围，在组内卡片提供单组专属测速动作，消除操作歧义。"
            en: "Clearly decouple top-level 'Test All Groups' from intra-group 'Test Group Latency', adding explicit scope explanations to remove user confusion."
          - zh: "将“底库节点清单与 Providers”明确更名为“节点解析与协议诊断（底库清单）”，并在展开区补充诊断说明，帮助排查底层节点解析状态与协议参数。"
            en: "Rebrand underlying providers into 'Node Resolution & Diagnostic Registry' with clear contextual guidance for inspecting parser results and protocol details."
          - zh: "完整补充代理页面新增元素的双语国际化词条（Localizable.xcstrings）。"
            en: "Complete bilingual localization for all new proxy view components."
      - title:
          zh: "Sparkle 软件更新弹窗重构"
          en: "Sparkle update dialog layout redesign"
        items:
          - zh: "重塑更新窗口为现代 Apple HIG 双层原生卡片视觉结构，完美自适应浅色与深色外观。"
            en: "Overhaul update alert dialog into a modern Apple HIG dual-layer card structure, adapting seamlessly between light and dark modes."
          - zh: "更新说明分类结构化呈现（新增特性、体验优化、问题修复），顶部直观展示版本号与构建编号药丸徽章。"
            en: "Structure changelog into clear categorized sections (New Features, Improvements, Bug Fixes) with prominent version badges."
          - zh: "构建工具自动化注入排版样式，根除更新弹窗无样式纯文本与排版跳动缺陷。"
            en: "Automate release notes styling pipeline to prevent unstyled text and layout shifts."
      - title:
          zh: "虚拟机实机全量场景与矩阵测试通过"
          en: "Virtual machine full regression verification"
        items:
          - zh: "在 Tart 虚拟机（macOS 15.0 / arm64）中完成 6 种运行模式矩阵（TUN / 透明代理 × 规则 / 全局 / 直连）全量回归，全部通过（0 failures）。"
            en: "Pass full acceptance matrix across all 6 engine and routing modes in Tart VM with 0 failures."
          - zh: "物理链路断开 8 秒自愈（test_vm_network_recovery.sh）实机测试通过，秒级完成 coreReset 并恢复 HTTP 204 通畅，双进程零重启。"
            en: "Verify 8-second physical link disconnection self-healing in guest with instant coreReset and zero process restarts."
          - zh: "锁屏与解锁长连接保持（test_vm_sleep_wake_recovery.sh）实机测试通过，双引擎长连接全程零重连（reconnects: 0）。"
            en: "Verify screen lock connection continuity with zero reconnects and seamless keep-alive across both engines."
          - zh: "OpenAI、ChatGPT、Codex、Anthropic Claude、Google AI 全部桌面应用与端点 100% 连通通过。"
            en: "Verify 100% pass across all AI desktop applications and API endpoints in both TUN and Transparent Proxy modes."
      - title:
          zh: "发布说明"
          en: "Release information"
        items:
          - zh: "此正式包使用正常生产核心，经过 Developer ID 签名及 Apple 官方公证，不包含 QA 自动连接。"
            en: "This stable package uses the normal production core, is Developer ID signed and Apple notarized, and contains no QA auto-connect."
          - zh: "经维护者授权，在虚拟机详细测试全部通过后发布 v1.0.14 正式版。"
            en: "Authorized by the maintainer for stable release following 100% pass across all virtual machine test suites."
