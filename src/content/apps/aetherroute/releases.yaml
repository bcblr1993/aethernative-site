    summary:
      zh: 自签证书节点无需跳过校验：全部 TLS 协议支持证书指纹固定，Hysteria2 / TUIC 支持自定义 CA，与 mihomo 一致；证书配置有误时只影响该节点。全量通过协议互通门禁与 Apple Silicon 真机六维矩阵。
      en: "Self-signed nodes no longer need skip-cert-verify: every TLS protocol honours a pinned certificate fingerprint and Hysteria2 / TUIC accept a custom CA, as in Mihomo; a bad certificate setting only affects its own node. Verified by the protocol interoperability gate and a six-way matrix on physical Apple Silicon."
