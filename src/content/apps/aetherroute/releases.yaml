    summary:
      zh: "修复网络热插拔恢复死锁与虚拟网卡误选，新增宿主级自愈看门狗；重构配置管理为原生分组列表；固化节点顺序；Hero卡片零高度抖动优化。"
      en: "Fix hotplug network recovery deadlock and virtual interface misidentification, add host-level recovery watchdog, overhaul profiles into native grouped list, stabilize node ordering."
    notes:
      - title:
          zh: "热插拔物理网卡检测与自愈恢复"
          en: "Hot-plugged physical uplink detection and self-healing"
        items:
          - zh: "彻底解决手机热点/Wi-Fi断开、休眠后再插网线导致隧道永久卡在“等待网络恢复”无法自愈的死锁缺陷。"
            en: "Resolve recovery deadlock where disconnecting hotspot/Wi-Fi and plugging in an Ethernet cable left the tunnel permanently stuck in waiting for recovery."
          - zh: "引入 Darwin 底层硬件枚举（if_nameindex()）与 macOS ServiceOrder 系统服务顺序，摆脱沙盒网络扩展处于 reasserting 时 NWPathMonitor 的静默盲区。"
            en: "Introduce Darwin hardware enumeration (if_nameindex()) and macOS ServiceOrder prioritization, bypassing the silent blindspot of sandboxed NWPathMonitor during reassertion."
          - zh: "严格过滤 feth/bridge/utun/vmenet/lo 等虚拟网卡前缀，杜绝 Docker/OrbStack 虚拟接口误选导致的底层内核重置失败。"
            en: "Strictly filter out virtual and container prefixes (feth, bridge, utun, vmenet, lo) to prevent misidentification of Docker/OrbStack interfaces from failing core reset."
      - title:
          zh: "宿主级网络恢复硬超时看门狗"
          en: "Host recovery watchdog and auto-healing"
        items:
          - zh: "为 .recovering 状态增加 45 秒宿主级看门狗（hostRecoveryWatchdogTimeout）。"
            en: "Arm a 45-second host-level recovery watchdog whenever the tunnel enters the recovering state."
          - zh: "若底层网络驱动或扩展发生死锁且超时未恢复，主应用自动无感重启自愈，杜绝人工反复手动断开重连。"
            en: "Automatically perform a graceful reconnect if the system extension remains wedged in recovery, eliminating the need for manual restarts."
      - title:
          zh: "配置管理页面原生分组列表重构"
          en: "Profiles page native grouped list redesign"
        items:
          - zh: "配置页面彻底升级为 Apple 原生分组卡片流，消除信息重复展示与视觉碎片化。"
            en: "Overhaul the configuration profiles view into an Apple-native grouped list, eliminating metadata duplication and visual clutter."
          - zh: "优化活跃与非活跃配置的切换与管理交互，视觉体系更加纯粹现代。"
            en: "Streamline active and inactive profile management with clean, elegant visual hierarchy."
      - title:
          zh: "概览连接卡片绝对零高度跳变"
          en: "Zero-layout-shift Hero card and fluid luminous bar"
        items:
          - zh: "彻底移除连接中的三阶段进度步骤条（“系统授权 -> 扩展启动 -> 协议握手”），锁定 Hero 卡片绝对高度，实现物理级零高度抖动。"
            en: "Completely remove the 3-stage progress step bar to permanently lock Hero card height with absolute zero layout shift regardless of connection duration."
          - zh: "保留流光能量条（ConnectionLuminousBar）与呼吸脉冲光圈（AetherRouteStatusLens），交互沉浸连贯。"
            en: "Preserve the fluid luminous energy sweep bar and ambient breathing status lens for seamless visual feedback."
      - title:
          zh: "代理节点原始顺序固化与测速防抖"
          en: "Proxy node order stabilization and speedtest fixes"
        items:
          - zh: "固化主应用代理节点呈现顺序，严格按照配置文件原始声明排列，彻底消除测速刷新时卡片位置跳动乱序。"
            en: "Anchor proxy node card ordering to follow original configuration declarations, preventing card jumping during latency sweeps."
          - zh: "修复单节点与级联策略组测速刷新超时问题，提升并发测速稳定性。"
            en: "Fix node latency test timeouts and cascade latency updates properly to parent strategy groups."
      - title:
          zh: "虚拟机实机全量场景与矩阵测试通过"
          en: "Virtual machine full regression verification"
        items:
          - zh: "在 Tart 虚拟机（macOS 15.0 / arm64）中完成 6 种运行模式矩阵（TUN / 透明代理 × 规则 / 全局 / 直连）全量回归，全部通过（0 failures）。"
            en: "Pass full acceptance matrix across all 6 engine and routing modes in Tart VM with 0 failures."
          - zh: "物理链路断开 8 秒自愈（test_vm_network_recovery.sh）实机测试通过，秒级完成 coreReset 并恢复 HTTP 204 通畅，双进程零重启。"
            en: "Verify 8-second physical link disconnection self-healing in guest with instant coreReset and zero process restarts."
          - zh: "锁屏与解锁长连接保持（test_vm_sleep_wake_recovery.sh）实机测试通过，双引擎长连接全程零重连（reconnects: 0）。"
            en: "Verify screen lock connection continuity with zero reconnects and seamless keep-alive across both engines."
          - zh: "OpenAI、ChatGPT、Codex、Anthropic Claude、Google AI 全部桌面应用与端点 100% 连通通过。"
            en: "Verify 100% pass across all AI desktop applications and API endpoints in both TUN and Transparent Proxy modes."
      - title:
          zh: "发布说明"
          en: "Release information"
        items:
          - zh: "此正式包使用正常生产核心，经过 Developer ID 签名及 Apple 官方公证，不包含 QA 自动连接。"
            en: "This stable package uses the normal production core, is Developer ID signed and Apple notarized, and contains no QA auto-connect."
