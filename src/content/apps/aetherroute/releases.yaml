    notes:
      - title:
          zh: "核心修复：Tailscale 虚拟覆盖网络与内核路由冲突彻底根治"
          en: "Permanent Fix for Tailscale Overlay Network & Kernel Route Conflict"
        items:
          - zh: "移除内核排除路由冲突：深度定位发现用户配置 100.64.0.0/10 自定义分流规则或绕过规则时，macOS Darwin NetworkExtension 的 excludedRoutes 会强制向物理出口网卡（en0）下发静态网关路由，导致内核克隆主机路由劫持 Tailscale utun 流量并中断 SSH 会话。在 PacketTunnelNetworkSettingsPlan 与 PacketTunnelProvider 中增加虚拟覆盖网络识别拦截，杜绝 100.64.0.0/10 及 IPv6 虚拟网段进入内核 excludedRoutes。"
            en: "Prevented 100.64.0.0/10 and IPv6 overlay subnets from entering Darwin NetworkExtension excludedRoutes, preventing the kernel from cloning static host routes to physical interfaces that hijack Tailscale utun traffic."
          - zh: "引擎底层覆盖网络穿透直连：虚拟覆盖网络流量完全交由分流引擎内核规则与无物理网卡强绑定的 Socket 原生出站，确保与 Tailscale 并行时零干扰、毫秒级低延迟通信。"
            en: "Handed overlay traffic entirely to rule-based engine routing and unbounded sockets, ensuring zero-interference, sub-millisecond coexistence with Tailscale."
          - zh: "配置策略安全净化：TunnelManager 启动与运行时自动净化历史遗留覆盖网段配置，保障全生命周期环境一致性。"
            en: "Added automated profile sanitization in TunnelManager to prune legacy overlay subnet entries from bypass policies."
      - title:
          zh: "系统扩展在轨平滑升级优化"
          en: "Seamless System Extension In-Place Upgrade"
        items:
          - zh: "构建版本严格递增：递增构建版本号至 2026092402，确保 Darwin sysextd 在实机环境下精准触发网络扩展热替换，杜绝二进制 hash 校验异常。"
            en: "Bumped build number to 2026092402 to guarantee sysextd cleanly recognizes and upgrades existing system extensions."
      - title:
          zh: "虚拟机与物理真机全矩阵验证通过"
          en: "Hardware & VM Matrix Verification"
        items:
          - zh: "Tart 虚拟机 6 维网络矩阵实测：TUN/透明代理 x 规则/全局/直连全部 6 项模式矩阵 100% 通过（aether-diag-1434），测试完成后虚拟机测试文件和记录完成全量自动清理并关机。"
            en: "Verified across all 6 engine and routing matrix permutations in Tart VM (aether-diag-1434) with 100% pass rate and clean post-run teardown."
          - zh: "真实 Apple Silicon Mac mini 硬件实机验证：通过 SSH 远程测试门禁，全量 50+ 项协议与网络性能测试 100% 通过（TCP 吞吐达 7500+ Mbps，UDP 10,000 数据包 0 丢包）；实机部署公证版后，双向 Ping 稳定 0.0% 丢包（22~29ms），Tailscale 与 SSH 连接无缝稳定。"
            en: "Verified on physical Apple Silicon Mac mini via remote automated test gate with 100% pass rate (TCP 7500+ Mbps, UDP 0 drops); live notarized deployment ping test achieved 0.0% packet loss with completely stable Tailscale and SSH sessions."
      - title:
          zh: "发布说明"
          en: "Release Information"
        items:
          - zh: "此正式包使用正常生产核心，经过 Developer ID 签名及 Apple 官方双重公证装订（App + DMG Stapled），不包含 QA 自动化标记。"
            en: "This stable package uses the normal production core, is Developer ID signed and Apple double-notarized (app + dmg stapled), and contains no QA automation flags."
          - zh: "经维护者要求，在真实物理机与虚拟机矩阵实测闭环通过后发布 v1.0.27 正式版。"
