    summary:
      zh: "优化网络恢复与探针回退机制，保护透明代理与长连接，细分恢复中与首次连接状态，长连接锁屏连续性验证与 VM 全量测试通过。"
      en: "Enhance network recovery and probe fallback, protect transparent proxy and long connections, refine recovery state UX, verified with full VM test matrix."
    notes:
      - title:
          zh: "网络自愈与健康探测增强"
          en: "Network self-healing and health probe enhancements"
        items:
          - zh: "优化网络恢复机制：当主探测端点不可达时，自动回退到备用探测端点并结合实时接收流量作为恢复依据，杜绝误判。"
            en: "Enhance recovery mechanism with fallback probe endpoints and received traffic evidence when primary probe is unreachable."
          - zh: "保护透明代理与长连接：在同一次网络恢复轮次中避免重复重置透明代理流，保障长连接与高并发流的持续稳定。"
            en: "Avoid repetitive transparent proxy flow resets within the same recovery run to ensure steady long-lived connections."
          - zh: "状态细分与交互优化：在 UI 和菜单栏中将“网络恢复中”与“首次连接”明确区分，网络恢复过程中完整保留连接时长，且断开连接操作随时可用。"
            en: "Distinguish network recovery from initial connection in UI and menu bar, preserving session duration and keeping Disconnect available."
      - title:
          zh: "长连接锁屏连续性实机验证"
          en: "Persistent connection screen lock continuity verification"
        items:
          - zh: "使用单条持久 TCP keep-alive 连接严格验证锁屏与解锁期间连接零中断、零重连与零丢包。"
            en: "Verify zero interruption and zero reconnection during screen lock/unlock using persistent TCP keep-alive connections."
          - zh: "彻底剥离模拟 QA 电源事件与真实锁屏事件的耦合，确保生产环境下锁屏与解锁期间进程零重启、网络零抖动。"
            en: "Decouple simulated QA power events from screen lock to guarantee zero process restarts and zero network jitter in production."
