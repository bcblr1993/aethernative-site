      en: Resolved Darwin TUN kernel packet buffer overflow (ENOSPC / ENOBUFS) with 32-packet batching and 2ms async lossless backoff; dynamic self-healing probe session prevents false rollbacks; verified 10.4 Gbps wire speed on physical Apple silicon.
    notes:
      - title:
          zh: 核心修复：Darwin TUN 内核队列溢出无损回退与异步重试
          en: Darwin TUN Kernel Queue Overflow Backoff & Lossless Retry
        items:
          - zh: 解决缓冲满断流：在高并发与大流量猝发时捕获系统 writePackets 返回值，遇到 ENOSPC / ENOBUFS 内核缓冲区满时，将未发数据包插回待发送队列头部，杜绝静默丢包与假死断流。
            en: Handled ENOSPC / ENOBUFS when writePackets overflows, prepending unwritten packets back to the head of the transmit queue to prevent silent packet drops and stall.
          - zh: 批次入核限流与退避调度：将单次入核批次限制为 32 包，并调度 2ms 异步退避延时，给 Darwin 内核驱动充足时间排空硬件网卡缓冲区。
            en: Capped kernel packet batch size to 32 and scheduled a 2ms async backoff delay to allow the Darwin driver to drain hardware buffers.
          - zh: 数据面探测会话动态自愈：网络拓扑或路由状态变动时主动重建纯净 URLSession 探测会话，杜绝复用失效连接池引发的误报与意外回滚。
            en: Automatically recreates clean URLSession instances on network topology changes, preventing false-positive proxy fallback caused by stale connection pools.
