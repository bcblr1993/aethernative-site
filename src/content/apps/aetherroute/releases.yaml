    notes:
      - title:
          zh: "核心引擎虚拟覆盖网络路由绑定穿透修复"
          en: "Core Engine Physical Interface Binding Bypass for Overlay Networks"
        items:
          - zh: "深度排查并定位 Tailscale 节点在开启代理后不可达的底层根本原因：当分流引擎发起 DIRECT 出站连接时，底层 socket 默认被绑定（IP_BOUND_IF）至主物理出口网卡（如 en0），导致发往 Tailscale utun 虚拟网卡的数据包被内核阻断。"
            en: "Resolved root-cause issue where DIRECT sockets bound to physical network interface (en0) blocked Darwin kernel from routing traffic to Tailscale utun virtual interfaces."
          - zh: "在底层核心引擎中实现覆盖网络地址判定：针对发往 100.64.0.0/10 及 fd7a:115c:a1e0::/48 的连接跳过物理网卡强绑定，使内核正常路由至 Tailscale 虚拟接口，P2P 直连与 SSH 访问完全恢复秒级通畅。"
            en: "Implemented overlay network detection in Core Engine to bypass physical interface binding for Tailscale CGNAT subnet (100.64.0.0/10) and IPv6 overlay (fd7a:115c:a1e0::/48), restoring seamless peer-to-peer and SSH traffic."
          - zh: "内置 Tailscale 协调服务器与 DERP 中继放行规则与 Fake-IP 避让，保障 NAT 打洞与 DERP 回退毫秒级就绪。"
            en: "Injected automated bypass and Fake-IP avoidance for Tailscale and DERP relay infrastructure."
      - title:
          zh: "自定义规则安全防护与核心证据链锁定"
          en: "Custom Rule Safety & Core Evidence Synchronization"
        items:
          - zh: "自定义规则前缀校验防护：阻断 /0 无效掩码输入，杜绝意外生成 0.0.0.0/0 全局捕获规则造成正常网络误拦截。"
            en: "Prevented /0 mask input in custom CIDR rules to avoid accidental 0.0.0.0/0 catch-all rule creation."
          - zh: "核心引擎提交与哈希对齐：锁定核心引擎提交 c23370da96b70e6282f04254b4a93761e2a54fee，同步更新 ProtocolCoreEvidence.json 与 ThirdPartyLicenses.json。"
