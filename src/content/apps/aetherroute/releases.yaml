            en: "Independent VM protocol tests, controlled IPv6 DNS/HTTPS, and stable traffic windows following a 210-second outage and rapid link changes passed. 38 UI functional tests passed. The stable package is Developer ID signed and Apple notarized, with the normal core and no QA auto-connect."
          - zh: "本次由维护者明确授权发布，剩余性能、独立真机、24 小时稳定性和完整安装后验收予以豁免，未记为通过。VM UI 响应性 p95 为 581.574 ms（门槛 120 ms），宿主机窗口打开 RSS 最高约 174 MiB（门槛 128 MiB）。维护者将自行进行本机实际测试。"
            en: "The maintainer explicitly authorized this release with the remaining performance, independent physical-Mac, 24-hour stability and full post-install gates waived, not passed. VM UI p95 was 581.574 ms against 120 ms; peak window-open RSS on the host was about 174 MiB against 128 MiB. The maintainer will perform local testing."
