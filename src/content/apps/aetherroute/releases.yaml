      en: "Fix TUN mode lifecycle deadlock on network recovery exhaustion, add automatic zombie engine eviction and self-healing, verified with VM network recovery and adapter switch."
    notes:
      - title:
          zh: "断网恢复与生命周期死锁修复"
          en: "Network recovery and lifecycle deadlock fix"
        items:
          - zh: "修复物理网卡瞬断及恢复耗尽时，Network Extension 进程未能关停核心导致 EngineLifecycleGate 永久死锁的缺陷。"
            en: "Fix a deadlock where PacketTunnelProvider failed to stop the core engine after recovery exhaustion, leaving the lifecycle gate permanently stuck."
          - zh: "启动新会话时主动探测并驱逐残留的僵死引擎实例，自动向底层发送 shutdown 信号并等待优雅降级，防止扩展永久报忙。"
            en: "Actively detect and evict residual running engine instances on new start requests, sending a shutdown signal to prevent permanent lifecycle busy rejections."
          - zh: "增加异常退出自愈与进程重启调度，当扩展进程处于异常状态时自动拉起新进程自愈，无需重启 Mac 机器。"
            en: "Add self-healing process relaunch fallback and crash retirement to restore idle state automatically without requiring a Mac reboot."
      - title:
          zh: "虚拟机实机验证"
          en: "Virtual machine verification"
        items:
          - zh: "在 Apple 芯片 macOS 虚拟机中完成物理链路中断 8 秒自愈恢复测试，进程与数据通道无缝自愈，无重启或崩溃。"
            en: "Verify physical uplink disconnection recovery (8s down) in an Apple silicon VM with zero process restarts and immediate probe recovery."
          - zh: "完成多网卡/IP 别名动态切换与出口地址变更测试，链路保持健康且数据通信无中断。"
            en: "Verify dynamic network adapter handoff with secondary IP alias addition/removal with uninterrupted data path connectivity."
      - title:
          zh: "发布说明"
          en: "Release information"
        items:
