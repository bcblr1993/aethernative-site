            en: "Avoid repetitive transparent proxy flow resets within the same recovery run to ensure steady long-lived connections."
          - zh: "状态细分与交互优化：在 UI 和菜单栏中将“网络恢复中”与“首次连接”明确区分，网络恢复过程中完整保留连接时长，且断开连接操作随时可用。"
