          - zh: "解耦虚拟覆盖网络与内核物理排除网段：正式从 excludedRoutes 移除 100.64.0.0/10 及自定义 CIDR，仅保留 RFC 1918 物理内网网段。"
            en: "Decoupled overlay networks from kernel excludedRoutes, retaining only true physical RFC 1918 LAN routes."
