      en: "Glass menu panel, latency-sorted nodes, timestamped traffic history, and improvements to network stability and shutdown."
    notes:
      - title:
          zh: "菜单栏与实时流量"
          en: "Menu panel and live traffic"
        items:
          - zh: "全新稍透明的原生玻璃面板与小飞机菜单栏图标，移除重复电源按钮，保留常用功能。"
            en: "A wider native glass panel and paper-plane menu bar icon, with one main connection control."
          - zh: "修复节点名称显示；无搜索的二级节点面板按实测延迟排序，显示完整节点列表。"
            en: "Fix node labels and offer a search-free secondary node panel sorted by measured latency."
          - zh: "前台概览约每秒刷新；无其他实时面板需求时，后台降为每 10 秒刷新。波形按真实时间展示最近 30 秒，并单独显示刷新间隔。"
            en: "Refresh the foreground overview about every second and use 10-second background polling when no live panel needs it. Plot the actual last 30 seconds and label the refresh interval separately."
      - title:
          zh: "网络稳定性与退出"
          en: "Network stability and shutdown"
        items:
          - zh: "网卡未变化时保留健康传输连接，避免 Hysteria2、TUIC、ShadowQUIC、WireGuard 无谓重连和额外握手等待。"
            en: "Preserve healthy pooled transports when the uplink is unchanged, avoiding unnecessary protocol reconnections and handshake delays."
          - zh: "直连 UDP 会话异步解析一次出口网卡，供两个套接字复用，减少重复枚举及探测带来的线程阻塞。"
            en: "Resolve the direct UDP uplink once asynchronously and reuse it across both sockets, reducing repeated scans and worker blocking."
          - zh: "直连模式跳过远程代理健康探测；退出时及时取消轮询、就绪验证和通信等待，并完善 AppKit 退出处理。"
            en: "Skip remote proxy health checks in direct mode, cancel background work and provider-message waits on shutdown, and improve AppKit termination handling."
      - title:
          zh: "发布说明"
          en: "Release information"
