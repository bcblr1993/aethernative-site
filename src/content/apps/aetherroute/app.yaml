    - { value: 0.0% ~ 0.1%, label: { zh: 后台静默 CPU, en: Background idle CPU }, note: { zh: 100% 线程进入内核深度休眠，折叠面板零后台绘制与无用唤醒, en: 100% thread sleep via mach_msg2_trap; zero background redraws when collapsed } }
