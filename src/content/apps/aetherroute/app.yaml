# AetherRoute 软件介绍（内容迁移自 aetherroute.pages.dev）
# 双语字段写成 { zh, en }；文本里的 \n 会显示为换行。
name: AetherRoute
order: 1
featured: true
icon: ./media/mark-1024.png
repo: https://github.com/bcblr1993/AetherRoute
tech: [SwiftUI + Rust, iCloud Sync]

tagline:
  zh: 为 Mac 与 iPhone 精心设计的私密路由
  en: Private routing, thoughtfully designed for Mac and iPhone
summary:
  zh: 原生、轻快的网络连接工具。12 类协议、透明代理与 TUN 双引擎，iCloud 加密同步配置。
  en: A native, lightweight connection tool. 12 protocols, Transparent Proxy and TUN engines, and encrypted iCloud profile sync.

