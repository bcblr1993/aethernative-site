    - { title: { zh: 带上订阅，就能开始, en: Bring your connections. }, body: { zh: "导入订阅、配置或单个节点。\n已有的连接习惯，在这里继续。", en: "Import subscriptions, profiles, or individual nodes.\nKeep the setup that works for you." } }
