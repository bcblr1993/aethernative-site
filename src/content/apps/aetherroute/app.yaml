protocols:
  eyebrow: { zh: 现代协议与广泛兼容, en: Modern protocols & broad compatibility }
  title: { zh: 熟悉的协议，都能用。, en: Your protocols. Right at home. }
  lead: { zh: 支持 12 类代理协议，无需安装额外依赖。选择一种协议，展开查看兼容能力。, en: 12 proxy protocols, with no extra runtimes. Choose a protocol to explore its capabilities. }
  items:
    - name: VLESS
      tag: VISION & REALITY
      body: { zh: 支持 XTLS-Vision 流控与 REALITY 深度伪装，配合 uTLS 客户端指纹模拟，具备极致抗封锁能力。, en: Supports XTLS-Vision flow and REALITY masquerading with uTLS browser fingerprinting for resilient connectivity. }
      chips: [XTLS-Vision, REALITY, uTLS, gRPC, WebSocket, H2]
    - name: VMess
      tag: CLASSIC & SECURE
      body: { zh: 完整支持标准 VMess 协议与多种底层传输通道，提供完整的 TLS 加密支持与动态用户验证。, en: Standard VMess protocol over diverse transport layers with full TLS encryption and dynamic user authentication. }
      chips: [TCP, WebSocket, gRPC, HTTP/2, TLS]
    - name: Trojan
      tag: STEALTH TLS
      body: { zh: 模仿标准 HTTPS 流量特征，支持通过 WebSocket 与 gRPC 复用传输，高隐蔽性与极低握手延迟。, en: Masquerades as standard HTTPS traffic with optional WebSocket and gRPC multiplexing for high stealth. }
      chips: [TLS 1.3, WebSocket, gRPC, Multiplex]
    - name: Hysteria 2
      tag: UDP & BBR
      body: { zh: 基于定制 QUIC/UDP 协议与 BBR 拥塞控制算法，支持 Salamander 混淆与端口跳跃，在恶劣网络下大幅提速。, en: Customized QUIC/UDP architecture with BBR congestion control, Salamander obfuscation, and port hopping. }
      chips: [QUIC, BBR, Salamander, Port Hopping]
    - name: TUIC v5
      tag: NATIVE QUIC
      body: { zh: 基于标准 IETF QUIC 协议构建，具备极速 0-RTT 连接建立与原生多路复用能力，弱网环境抗丢包优异。, en: Built directly on IETF QUIC with 0-RTT handshakes and native multiplexing, offering superior packet-loss resistance. }
      chips: [IETF QUIC, 0-RTT, Congestion Control]
    - name: Shadowsocks
      tag: SS2022 & AEAD
      body: { zh: 全面兼容传统 AEAD 加密套件、Shadowsocks 2022 规范及 ShadowTLS v3 混淆，支持原生全双工 UDP 转发。, en: Covers classic AEAD ciphers, Shadowsocks 2022 standards, and ShadowTLS v3 with native full-duplex UDP relay. }
      chips: [AEAD, SS 2022, ShadowTLS v3, UDP Relay]
    - name: ShadowQUIC
      tag: ANTI-CENSORSHIP
      body: { zh: 深度结合 QUIC 传输特性与对称混淆加密，规避深度包检测 (DPI) 嗅探与阻断。, en: Combines QUIC transport with symmetric obfuscation to bypass deep packet inspection (DPI) and interference. }
      chips: [QUIC Transport, Obfuscation, Anti-DPI]
    - name: WireGuard
      tag: FULL-MESH VPN
      body: { zh: 高效现代加密 VPN 隧道，支持完整 IPv4 与 IPv6 双栈路由、自定义 MTU 以及 Pre-Shared Key (PSK) 增强安全。, en: Modern VPN tunnel supporting full IPv4/IPv6 dual-stack routing, custom MTU, and Pre-Shared Key (PSK) hardening. }
      chips: [IPv4 / IPv6, Noise Protocol, PSK, Custom MTU]
    - name: AnyTLS
      tag: TLS RESILIENCE
      body: { zh: 消除 TLS 握手特征与统计指纹，在受限网络环境下提供稳定的端到端加密代理通道。, en: Strips distinctive TLS handshake patterns and statistical fingerprints for stable end-to-end encrypted proxying. }
      chips: [TLS Camouflage, Fingerprint Stripping]
    - name: SSH Tunnel
      tag: NATIVE CIPHER
      body: { zh: 原生 SSH 动态安全转发隧道，支持内嵌 Ed25519 密钥认证、私钥密码短语与严格主机公钥指纹校验。, en: Native SSH proxy tunneling with embedded Ed25519 keys, passphrase support, and strict host key verification. }
      chips: [Ed25519, Passphrase, Host Key Check]
    - name: HTTP / HTTPS
      tag: STANDARD CONNECT
      body: { zh: 通用标准 HTTP CONNECT 与安全 HTTPS 代理支持，兼容企业内网网关、正向代理与自建基础设施。, en: Universal HTTP CONNECT and HTTPS forward proxy support, compatible with enterprise gateways and custom relays. }
      chips: [HTTP CONNECT, HTTPS, Basic Auth]
    - name: SOCKS5
      tag: TCP & UDP ASSOCIATE
      body: { zh: 标准通用 SOCKS5 代理实现，支持安全用户名密码凭据认证及全功能 UDP Associate 流量代理转发。, en: Standard SOCKS5 implementation with username/password authentication and full UDP Associate relay capabilities. }
      chips: [RFC 1928, User / Pass, UDP Associate]
  tools:
    - { title: { zh: 原生可视化节点编辑器, en: Native visual node editor }, body: { zh: 无需手写易出错的 YAML 配置，12 类协议均配备原生 macOS 表单界面，参数即填即验。, en: Forget editing raw YAML. All 12 protocols feature native macOS forms with real-time validation. } }
    - { title: { zh: 多格式订阅与链接兼容, en: Universal subscription import }, body: { zh: 兼容 Clash 规范 YAML 订阅、Base64 分享链接，并支持 aetherroute:// 网页安全一键导入。, en: "Compatible with Clash YAML profiles, Base64 share links, and safe aetherroute:// one-click imports." } }
    - { title: { zh: 高强度加密配置归档, en: Encrypted backup archives }, body: { zh: 支持跨机器一键导出与导入 .aetherroute 归档，采用 PBKDF2 与 AES-256-GCM 密码安全保护。, en: Export and import .aetherroute archives across Macs, secured by PBKDF2 and AES-256-GCM encryption. } }

features:
  eyebrow: { zh: Mac 版 · 专为 Apple M 系列芯片, en: For Mac · Built for Apple M-series }
  title: { zh: 用起来简单，细节不简单。, en: Simple to use. Thoughtful underneath. }
  lead: { zh: 从连接方式到隐私保护，让每一个细节，更贴合你的 Mac。, en: "From the way you connect to the way you stay private, every detail belongs on your Mac." }
  items:
    - kicker: { zh: M 系列芯片 · 深度定制, en: Purpose-built for Apple M-series }
      title: { zh: 原生到底，优化到细节。, en: Native at heart. Tuned in every detail. }
      body:
        zh: 专为 Apple M 系列芯片深度定制，以极致优化为目标。arm64 原生架构、SwiftUI 界面与 Rust 网络核心协同工作，从按需刷新到批量数据包处理，持续打磨响应速度、资源占用与能效表现。
        en: Purpose-built for Apple M-series chips, with optimization at every layer. Native arm64, SwiftUI and a Rust networking core work together, with on-demand updates and batched packet processing to refine responsiveness, resource use and efficiency.
      details:
        - { zh: ARMv8 硬件加解密指令加速：原生调用 M 芯片内置 Cryptography Extensions（硬件 AES/SHA/NEON），线速数据包加解密在硬件流水线瞬间完成，不占 CPU 核心。, en: "ARMv8 hardware cryptography: directly invokes Apple silicon's on-chip Cryptography Extensions (hardware AES/SHA/NEON), offloading crypto to dedicated silicon without CPU penalty." }
        - { zh: 统一内存（Unified Memory）零冗余架构：Swift 6 宿主与网络内核通过静态链接高效整合，消除跨进程 IPC 套接字/管道序列化与内存多重拷贝，总物理内存仅约 210MB（较传统减少 60%+）。, en: "Unified Memory zero-redundancy: Swift 6 host and Rust protocol engines are statically linked, eliminating IPC socket serialization and redundant buffer copying to maintain a lean ~210MB footprint." }
        - { zh: E-Core 能效核与内核深度休眠：菜单栏面板收起时，100% 线程立即切入 mach_msg2_trap 内核深度休眠，定时器与多余唤醒归零，后台静默 CPU 仅 0.0% ~ 0.1%，冷感长续航。, en: "E-core & kernel sleep scheduling: 100% of threads enter mach_msg2_trap deep kernel sleep when collapsed, eliminating background timers for 0.0% ~ 0.1% idle CPU and all-day endurance." }
        - { zh: NEPacketTunnelFlow 批量刷包优化：结合单例报文头与批量数据包写入（Coalesced Flush），减少 95% 以上系统内核上下文切换，大吞吐依然平稳丝滑。, en: "Batched packet flushing: coalesces tunnel packet writes with shared protocol headers via NEPacketTunnelFlow, slashing kernel context switches by over 95%." }
    - kicker: { zh: 国内与 Apple 服务, en: Domestic & Apple services }
      title: { zh: 熟悉的服务，顺畅直连, en: A direct route to familiar services }
      body: { zh: 首创内存级无损优化引擎，不修改磁盘订阅文件，运行时自动注入国内高优先级直连规则与分流策略。, en: Lossless in-memory optimization engine injects domestic direct rules without mutating on-disk profiles. }
      details:
        - { zh: Apple CDN 线速直连：系统更新域名（swcdn.apple.com 等）智能避让 Fake-IP，解析国内 Anycast 真实 IP，实测 34.9 MB/s 满带宽下载。, en: "Apple CDN line-rate bypass: system updates resolve to authentic domestic Anycast IPs, verified at 34.9 MB/s line-rate." }
        - { zh: 国内高速安全 DNS：国内主流域名全自动映射至低延迟阿里云公共 DNS（223.5.5.5），彻底杜绝海外解析污染与额外延迟。, en: "Fast domestic DNS: domestic domains resolve via Alibaba low-latency DNS (223.5.5.5), eliminating poison and lookup lag." }
        - { zh: 零配置自适应：导入任何通用订阅，无需手动编写复杂的 Apple 规则或直连分流即可全自动生效。, en: "Zero configuration: works out of the box with any standard subscription without editing custom rules." }
    - kicker: { zh: 双引擎原生架构, en: Dual-engine architecture }
      title: { zh: 透明代理与 TUN 自由切换, en: Transparent Proxy & Direct TUN engines }
      body: { zh: 同时内嵌两种截然不同的 macOS 原生网络扩展，适应从日常浏览到极客终端的全场景需求。, en: Embeds two distinct native macOS Network Extensions for seamless everyday browsing and deep terminal routing. }
      details:
        - { zh: 透明代理 (Transparent Proxy)：基于 App Proxy 纯用户空间运行，低开销高效流式分流，DNS 由本机托管，免改系统网络配置。, en: "Transparent Proxy: runs in user space via App Proxy for lightweight streaming without altering system DNS settings." }
        - { zh: 数据包隧道 (Direct TUN)：虚拟网卡捕获系统全局所有 TCP/UDP 流量，内置 PacketFlow 协议栈与 Fake-IP，接管所有命令行工具。, en: "Direct TUN: virtual TUN interface captures all TCP/UDP traffic and command-line tools with built-in PacketFlow stack." }
        - { zh: 平滑切换与网络自愈：支持两套引擎与规则/全局/直连模式之间无感平滑热切，宿主看门狗全程守护连接状态。, en: "Seamless handover: switch between engines and Rule/Global/Direct modes smoothly with background self-healing watchdogs." }
    - kicker: { zh: 系统级深度融合, en: System integration }
      title: { zh: 开机自启、低功耗与无感自愈, en: Launch at login, low power & auto-recovery }
      body: { zh: 深入适配 macOS 现代后台服务规范与睡眠唤醒机制，让代理服务如同系统原生功能般自然存在。, en: Engineered around modern macOS background service standards and sleep-wake lifecycle events. }
      details:
        - { zh: 开机自启动管理：基于原生 ServiceManagement API，沙盒安全合规，系统开机后智能恢复用户前次连接意图。, en: "Launch at login: native ServiceManagement sandboxed service automatically restores previous connection intent on boot." }
        - { zh: 低功耗按需刷新：菜单栏实时网速与波形仅在面板展开时高频绘制，折叠时零额外 CPU 与能耗消耗，全天候省电。, en: "On-demand telemetry: menu bar speeds and graphs pause when hidden, eliminating background CPU overhead." }
        - { zh: 休眠防振荡与安全退出：锁屏与休眠平稳自愈，应用退出时安全切断保护，彻底防止网络残留阻断外网。, en: "Anti-oscillation & safe exit: smooth sleep-wake recovery, with clean fail-safe teardown on termination to prevent stalls." }
    - kicker: { zh: 隐私与专业控制, en: Privacy & diagnostics }
      title: { zh: 隐私安心，掌控随心, en: Your privacy. Your control. }
      body: { zh: 坚守极高标准的隐私边界与安全底线，同时为开发者与网络工程师提供全方位诊断工具。, en: Strict privacy boundaries paired with deep observability tools for developers and network engineers. }
      details:
        - { zh: 硬件级 Keychain 保护：订阅地址与节点凭证全部经过 AES-GCM 高强度加密入库，磁盘永不存明文。, en: "Hardware-backed Keychain: credentials and subscription URLs encrypted with AES-GCM; zero plaintext on disk." }
        - { zh: 零追踪零遥测：无任何外部打点、商业统计或第三方分析 SDK，免关 SIP，通过 Apple 官方双重公证。, en: "Zero telemetry: no tracking scripts, no SIP disabling required, officially notarized by Apple." }
        - { zh: 规则模拟与分层测速：内置规则匹配模拟器，提供 TCP 连通探测与真实协议层握手的双重真实测速。, en: "Route simulator & real latency: inspect rule matching instantly with genuine protocol latency proofs." }

benchmarks:
