faq:
  eyebrow: { zh: 简单之外，也有深度, en: Simple on the surface. Capable within. }
  title: { zh: "你需要的掌控，\n都在里面。", en: "All the control.\nRight where you need it." }
  lead: { zh: "日常使用保持轻松。\n想多调一点，也有顺手的工具。", en: "Keep everyday connections effortless.\nFine-tune things when you want to." }
  items:
    - q: { zh: iOS 版什么时候可以下载？, en: When can I download the iOS app? }
      a: { zh: iPhone 版即将上架，部分功能仍在测试与优化中，目前暂未开放公开下载。具体上架时间与下载方式将在官网公布，页面中的界面与功能为开发预览，以正式发布版本为准。, en: The iPhone app is coming soon. Some features are still being tested and refined, and public downloads are not yet available. Timing and download details will be announced here. Screenshots and features are development previews and may change before release. }
    - q: { zh: Mac 与多台 iPhone 如何同步配置？, en: How do profiles sync across Mac and multiple iPhones? }
      a: { zh: 在 Mac 和每台 iPhone 上登录同一 Apple 账户，开启「iCloud 密码与钥匙串」，并分别启用 App 内的 iCloud 同步。先从已有配置的设备上传，再在其他设备拉取并合并配置；各设备独立控制连接和活动配置。iPhone 端仍在测试，具体开放时间随正式版本公布。, en: "Sign in to the same Apple Account on your Mac and each iPhone, enable iCloud Passwords & Keychain, and turn on sync in each app. Upload existing profiles, then pull and merge them on other devices. Connections and active profiles remain independent. iPhone sync is still in testing; availability will be announced with the release." }
    - q: { zh: 对比 Clash Verge、Surge 等主流客户端，AetherRoute 性能表现如何？, en: How does AetherRoute compare with Clash Verge and Surge in performance? }
      a: { zh: 得益于纯血 Swift 6 + SwiftUI 原生架构与静态链接的 Rust 高性能协议引擎，AetherRoute 相比 Electron 类客户端（如 Clash Verge、Nyanpasu）减少了超过 60% 的内存消耗（总物理 Footprint 仅约 210MB 对比 500MB~800MB+），并彻底消除了 Chromium 后台定时器唤醒，后台静默 CPU 低至 0.0% ~ 0.1%（100% 线程进入 mach_msg2_trap 内核深睡）。在持续吞吐能效与系统扩展沙盒安全性上，完全比肩业内标杆 Surge Mac，且无需安装任何带有 Root 权限的第三方 Helper 守护进程。, en: "Thanks to pure Swift 6 and statically linked Rust protocol engines, AetherRoute consumes over 60% less memory than Electron apps like Clash Verge (around 210MB vs 500MB~800MB+) and eliminates Chromium background wakeups, achieving 0.0% ~ 0.1% background idle CPU via mach_msg2_trap. Its throughput efficiency and sandbox safety rival Surge Mac, without requiring privileged root helpers." }
    - q: { zh: AetherRoute 专为 Apple 芯片（M 系列）做了哪些底层深度优化？, en: What low-level optimizations are tailored for Apple silicon? }
      a: { zh: AetherRoute 采用纯 arm64 架构从源码编译，完全剥离任何 x86 兼容层，零 Rosetta 2 性能损耗与内存惩罚。底层深度利用 Apple Silicon 硬件特性：① 直接调用 ARMv8 Cryptography Extensions（硬件 AES 与 SHA 指令），在芯片硬件流水线中瞬间完成复杂节点加解密，释放 CPU 计算核心；② 依托 Apple 统一内存架构（Unified Memory），网络核心静态链接至扩展，根除跨进程 IPC 套接字/管道序列化与内存多重拷贝；③ 深度适配 macOS 异构能效核调度，折叠菜单栏时 100% 线程切入 mach_msg2_trap 内核级深睡，零无用定时器唤醒，实现全天候 0.0% ~ 0.1% 静默 CPU 与冷感超长电池续航；④ NEPacketTunnelFlow 批量单例刷包机制，大幅聚合虚拟网卡数据包下发，降低 95% 以上内核上下文切换。, en: "AetherRoute is built 100% natively as pure arm64 with zero Rosetta 2 translation overhead or memory penalty. It takes deep advantage of Apple silicon hardware: (1) harnesses ARMv8 Cryptography Extensions (hardware AES/SHA instructions) directly in silicon for line-rate encryption without CPU bottlenecks; (2) leverages Apple Unified Memory with static core linkage to eliminate IPC serialization and duplicate memory copying; (3) integrates with efficiency-core scheduling, placing 100% of threads into mach_msg2_trap deep kernel sleep when collapsed for 0.0% ~ 0.1% idle CPU and all-day battery life; (4) uses NEPacketTunnelFlow batched packet coalescing to cut kernel context switches by over 95%." }
    - q: { zh: 灵活选择连接方式：透明代理与 TUN 有何区别？, en: "Connect your way: Transparent Proxy vs Direct TUN" }
      a: { zh: 提供透明代理（App Proxy）与 Direct TUN 两种网络引擎，均支持规则、全局和直连模式。透明代理运行在用户态，开销更低，DNS 由系统直接托管；Direct TUN 创建虚拟网卡捕获整机全部 TCP/UDP 流量并配备 Fake-IP，适合需要全面接管终端命令行及各类后台服务的进阶场景。, en: "AetherRoute embeds Transparent Proxy (App Proxy) and Direct TUN engines, both supporting Rule, Global, and Direct modes. Transparent Proxy is lightweight and keeps macOS DNS authoritative; Direct TUN captures all TCP/UDP traffic and command-line tools with built-in Fake-IP." }
    - q: { zh: 支持哪些代理协议与导入格式？, en: Supported protocols and import formats }
      a: { zh: 客户端原生完整支持 12 类现代代理协议：VLESS（支持 XTLS-Vision、REALITY、uTLS）、VMess、Trojan、Hysteria 2、TUIC v5、Shadowsocks（含 SS2022 与 ShadowTLS v3）、ShadowQUIC、WireGuard、AnyTLS、SSH Tunnel、HTTP/HTTPS 与 SOCKS5。导入方面全面兼容 Clash 规范 YAML 订阅、Base64 节点分享链接、aetherroute:// 网页安全一键导入，并配备 12 协议原生可视化表单编辑器与 .aetherroute 加密备份归档。, en: "AetherRoute natively supports 12 modern protocols: VLESS (XTLS-Vision, REALITY, uTLS), VMess, Trojan, Hysteria 2, TUIC v5, Shadowsocks (SS2022, ShadowTLS v3), ShadowQUIC, WireGuard, AnyTLS, SSH Tunnel, HTTP/HTTPS, and SOCKS5. It supports Clash YAML subscriptions, Base64 share links, safe aetherroute:// URL imports, native visual editing, and encrypted .aetherroute backups." }
    - q: { zh: 1.0.18 国内与 Apple 服务零配置加速是如何工作的？, en: How 1.0.18 zero-config domestic and Apple acceleration works }
      a: { zh: 在 1.0.18 中引入了无损内存级优化引擎。它完全不修改或污染你磁盘上的原始订阅文件，而是在运行时自动注入国内高优先级直连规则与低延迟 DNS（223.5.5.5）。针对 swcdn.apple.com、updates.cdn-apple.com 等 Apple 关键系统更新域名，智能避让 Fake-IP 映射，直接解析至国内真实 Anycast IP，实测达到 34.9 MB/s 满物理带宽极速下载。, en: "1.0.18 introduces a lossless in-memory optimization engine. Without mutating on-disk profiles, it injects domestic direct rules and fast domestic DNS (223.5.5.5) at runtime. Critical Apple domains (swcdn.apple.com, etc.) bypass Fake-IP and resolve directly to authentic domestic Anycast IPs, verified at 34.9 MB/s line-rate throughput." }
    - q: { zh: 开机自启、休眠唤醒与网络切换是否稳定？, en: "Launch at login, sleep-wake, and network switching stability" }
      a: { zh: AetherRoute 采用原生 macOS ServiceManagement API 管理开机自启动，沙盒合规安全。系统具备智能连接状态记忆：系统开机或从休眠唤醒后，自动恢复之前的连接状态；遇到 Wi-Fi/网线切换时由底层网络监视器平稳重连并具备防振荡看门狗；在完全退出应用时提供安全切断保护，杜绝残留断网。, en: "AetherRoute uses native ServiceManagement APIs for sandboxed launch at login. It remembers user connection intent across reboot and sleep-wake, features anti-oscillation recovery during Wi-Fi/Ethernet handovers, and performs clean fail-safe teardown upon termination." }
    - q: { zh: 看得清每一条连接与真实分层测速, en: See connections clearly with layered latency testing }
      a: { zh: 提供隐私安全的实时连接看板，清晰展示当前活跃连接、上下行速率、累计传输字节与命中规则链路。节点测速采用显式双层语义：TCP 连通性快速并发扫描 + 真实协议层握手测速，真实反映节点可用性与延迟，绝不制造虚假数字。同时提供规则模拟测试器与终端代理环境命令快速复制。, en: "Inspect live connections, rates, transferred bytes, and matched rule chains. Latency testing uses explicit layered semantics: fast concurrent TCP reachability sweeps plus genuine protocol-level handshakes. Includes an interactive route simulator and terminal proxy export shortcuts." }
    - q: { zh: 为什么不需要降低系统安全性或关闭 SIP？, en: Why Reduced Security and disabling SIP are not required }
      a: { zh: AetherRoute 100% 构建于 Apple 官方公开的用户空间 Network Extension 架构之上，完全不需要内核扩展（kext），因此绝对不需要关闭系统完整性保护（SIP），也不需要在恢复模式降低系统安全性。软件已获得 Apple Developer ID 签名并由 Apple 官方双重公证（Notarized），安全合规。, en: "AetherRoute is built 100% on Apple's modern user-space Network Extension APIs. It requires no kernel extensions (kexts), no disabling of SIP, and no Reduced Security mode. It is Developer ID signed and Apple double-notarized for security compliance." }
    - q: { zh: 第一次使用，需要准备什么？, en: What do I need to get started? }
      a: { zh: 准备一台运行 macOS 15 或更高版本的 Apple 芯片 Mac，以及你自己的订阅或节点。安装后导入配置，按系统提示批准网络扩展，再连接。, en: "You need an Apple silicon Mac running macOS 15 or later and your own subscription or nodes. Install the app, import your profile, approve the Network Extension when prompted, and connect." }
    - q: { zh: 软件免费吗？包含节点吗？, en: Is it free? Are servers included? }
      a: { zh: 客户端免费使用，无需付费激活。软件不提供节点或订阅服务，需要自行准备。, en: The client is free to use without paid activation. Servers and subscription services are not included; bring your own. }

