ios:
  badge: { zh: 即将上架, en: Coming soon }
  title: { zh: "熟悉的连接，\n即将随身。", en: "Familiar connections.\nComing to iPhone." }
  lead:
    zh: AetherRoute iPhone 版即将上架。仅支持 iOS 26 及以上版本，带来原生界面、轻快的连接体验与 Mac / iPhone 双端配置同步。部分功能仍在测试与优化中，准备好后，再与你见面。
    en: AetherRoute for iPhone is coming soon. Requires iOS 26 or later, with a native interface, responsive connections and profile sync with Mac. Some features are still being tested and refined before release.
  chips: [iOS 26+, SwiftUI + Rust, iCloud Sync]
  image: ./media/ios-home-zh.png
  status: { zh: 即将上架 · 敬请期待, en: Coming soon · Stay tuned }
  requirements:
    zh: "系统要求：仅支持 iOS 26 及以上版本，不支持更早版本。\n适用机型：iPhone 12 系列及后续机型，需升级至受支持的系统版本。"
    en: "Requires iOS 26 or later. Earlier iOS versions are not supported.\niPhone 12 family and later, running a supported iOS version."
  notice:
    zh: 功能抢先看 · 以下为开发预览，部分功能仍在测试，最终以正式发布版本为准。
    en: A first look · Features are in development and testing. Final availability will be confirmed at release.
  features:
    - kicker: 01 / NATIVE
      title: { zh: 为新一代 iOS，原生而生。, en: Native to a new generation of iOS. }
      body:
        zh: 从 iOS 26 起步，采用 Swift 6 与 SwiftUI。连接状态、模式切换和节点选择，一眼清楚；支持系统深浅色与动态字体。
        en: Built for iOS 26 with Swift 6 and SwiftUI. Clear connection status, routing modes and node selection, with system light and dark appearances and Dynamic Type.
    - kicker: 02 / PERFORMANCE
      title: { zh: 追求极致性能，也在意电量。, en: Performance in mind. Battery, too. }
      body:
        zh: 原生界面搭配 Rust 网络核心，批量处理隧道数据包。App 进入后台时暂停界面遥测轮询，减少不必要的刷新，把资源留给连接本身。
        en: A native interface meets a Rust networking core with batched tunnel packet processing. UI telemetry polling pauses in the background to reduce unnecessary work.
    - kicker: 03 / CONTROL
      title: { zh: 专业能力，也能随手掌控。, en: Room for more control. }
      body:
        zh: 支持 12 类代理协议，提供规则、全局与直连模式。管理订阅、选择节点、查看实时流量，在手机上也能清晰完成。
        en: 12 proxy protocols, with Rule, Global and Direct routing. Manage subscriptions, select nodes and inspect live traffic, all from your iPhone.
  shotsTitle: { zh: 每一面，都很 iPhone。, en: Feels like iPhone. In every view. }
  shotsNote: { zh: 开发中界面 · 演示数据, en: Development screenshots · Demo data · Chinese UI }
  shots:
    - { title: { zh: 节点管理, en: Your connections }, caption: { zh: 搜索、选择与排序，一目了然。, en: Search, select and sort at a glance. }, image: ./media/ios-nodes-zh.png }
    - { title: { zh: 深色外观, en: After dark }, caption: { zh: 跟随系统外观，夜间也清晰。, en: A clear view that follows your system appearance. }, image: ./media/ios-dark-zh.png }
    - { title: { zh: 随心设置, en: Make it yours }, caption: { zh: 分流与 DNS 选项，集中掌控。, en: Routing and DNS options, all in one place. }, image: ./media/ios-settings-zh.png }

sync:
  eyebrow: { zh: 同一 Apple 账户 · 配置加密同步 · 各设备独立连接, en: One Apple Account · Encrypted profile sync · Independent connections }
  title: { zh: "一套配置，\n多台设备接着用。", en: "One setup.\nAcross your devices." }
  lead:
    zh: 从桌上的 Mac，到随身的 iPhone，再到另一台备用 iPhone：通过同一 Apple 账户的 iCloud，让订阅与节点随配置在多台设备间接续，不必逐台重复整理。iPhone 端同步仍在测试与完善，正式能力以上架版本为准。
    en: From your Mac to your everyday iPhone and a spare iPhone, iCloud profile sync is designed to share subscriptions and nodes across devices using the same Apple Account. iPhone sync is still being tested and refined; final availability will be confirmed at release.
  image: ./media/device-sync.svg
  imageAlt: { zh: Mac 通过 iCloud 与多台 iPhone 同步加密配置, en: A Mac and multiple iPhones share encrypted profiles through iCloud }
  points:
    - { title: { zh: 配置随行，连接独立。, en: Shared profiles. Independent connections. }, body: { zh: 同步订阅与节点配置，每台设备独立控制连接，并保留自己的活动配置。, en: Sync subscription and node profiles while each device controls its own connection and keeps its active profile. } }
    - { title: { zh: 加密后，再同步。, en: Encrypted before syncing. }, body: { zh: 配置使用 AES-256-GCM 加密，密钥通过 iCloud 钥匙串同步。, en: Profiles use AES-256-GCM encryption, with keys synchronized through iCloud Keychain. } }
    - { title: { zh: 合并配置，保留本地选择。, en: Merge profiles. Keep your choice. }, body: { zh: 同步时合并已有配置；每台设备仍可保持自己的活动配置。, en: Existing profiles are merged, while each device can retain its own active profile. } }
  note:
    zh: 使用条件：每台设备安装支持同步的版本，登录同一 Apple 账户，开启「iCloud 密码与钥匙串」，并分别在 App 中启用 iCloud 同步。同步完成时间受 iCloud 与网络状态影响。
    en: Requires compatible versions on every device, the same Apple Account, iCloud Passwords & Keychain, and sync enabled in each app. Sync timing depends on iCloud and network availability.

