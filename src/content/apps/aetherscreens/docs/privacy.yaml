title: { zh: 隐私政策, en: Privacy Policy }
heading: { zh: "你的屏幕，\n只在你的设备间传输。", en: "Your screen travels\nonly between your devices." }
meta: { zh: 适用于 AetherScreens 客户端, en: Applies to AetherScreens }
lead:
  zh: AetherScreens 不包含数据埋点、统计分析或遥测。画面与键鼠输入只在你的设备和被控 Mac 之间直接传输。
  en: AetherScreens contains no analytics, tracking or telemetry. Screen and input data travel directly between your device and the remote Mac.
sections:
  - heading: { zh: 本机保存的数据, en: Data Stored on Your Device }
    list:
      - { zh: 设备列表（名称、地址、端口、上次连接时间）保存在应用偏好设置中。, en: "The device list (name, address, port, last connection) is kept in the app’s preferences." }
      - { zh: 设备密码保存在系统钥匙串中。, en: Device passwords are stored in the system Keychain. }
      - { zh: 远端桌面缩略图保存在本机缓存目录，可随时由系统清理。, en: Remote desktop thumbnails are kept in the local cache folder and may be cleared by the system at any time. }
  - heading: { zh: 可选的 iCloud 同步, en: Optional iCloud Sync }
    body:
      - zh: 只有在你主动开启 iCloud 同步后，电脑列表及连接配置才会存入你自己的 iCloud 私有数据库，用于在登录同一 Apple 账户的受支持设备间同步。配置可能包含电脑名称、地址、端口、用户名和连接偏好。
        en: Only after you enable iCloud Sync are your computer library and connection settings stored in your private iCloud database, for synchronization between supported devices signed into the same Apple Account. Settings may include computer names, addresses, ports, usernames, and connection preferences.
      - zh: 连接密码、SSH 私钥和 Tailscale API Token 不会写入此同步数据库。关闭同步会停止后续同步；删除电脑时，删除记录会在同步开启时传递到其他设备。
        en: Connection passwords, SSH private keys, and Tailscale API tokens are not stored in this sync database. Turning sync off stops further synchronization. Deleting a computer propagates its deletion to other devices while sync is enabled.
  - heading: { zh: 网络连接, en: Network Connections }
    body:
      - zh: 普通 VNC 连接可能不加密画面与输入流量。请使用可信局域网，或通过已配置的 SSH 或 Tailscale 加密隧道连接。连接的安全机制取决于协议、配置和服务端支持。
        en: VNC screen and input traffic may be unencrypted. Use a trusted local network or a configured SSH or Tailscale tunnel. Connection security depends on the protocol, settings, and server capabilities.
      - zh: 远程桌面连接只会连接你添加或在局域网中发现的 Mac；局域网发现使用 Bonjour，仅在本地网络内进行。
        en: Remote desktop connections reach only Macs you add or discover on your local network; discovery uses Bonjour and stays on your local network.
      - zh: 只有在你填写 Tailscale API Token 并同步设备时，应用才会访问 api.tailscale.com 读取 Tailnet 设备列表。Token 只在本次运行期间保存在内存中，不会写入磁盘。
        en: Only when you enter a Tailscale API token and sync devices does the app contact api.tailscale.com to read your Tailnet device list. The token stays in memory for that session and is not written to disk.
      - zh: macOS 1.1.0 起，手动检查更新会访问官网更新清单，并从 GitHub 下载签名安装包。更新请求包含应用与 macOS 版本等兼容信息，不会发送远程画面、键鼠输入或设备密码。
        en: From macOS version 1.1.0, manual update checks contact the website feed and download signed packages from GitHub. Requests include compatibility information such as app and macOS versions, not remote screen data, input or device passwords.
  - heading: { zh: 问题与建议, en: Contact }
    links:
      - { label: GitHub Issues ↗, href: "https://github.com/bcblr1993/AetherScreens/issues" }
