zation for macOS Screen Sharing and Windows RDP sessions with loopback suppression. }, { zh: 针对 Windows RDP 深度优化 CRLF 换行符与 Ctrl+C/V 硬件扫描码，保证剪贴板与快捷键准确生效。, en: Deep CRLF newline normalization and hardware scancodes for Ctrl+C/V in Windows RDP sessions. }, { zh: 会话菜单提供剪贴板同步开关、手动推送到远端以及将剪贴板作为字符模拟键入。, en: "Dedicated session menu with sync toggle, manual send, and type clipboard as keystrokes." } ] }, { title: { zh: 快捷操作与触角动作, en: Quick Actions & Hot Corners }, items: [ { zh: 会话工具栏新增四个屏幕触发角（调度中心、通知中心、启动台、显示桌面）与常用系统快捷键。, en: "Added four screen hot corner triggers (Mission Control, Notification Center, Launchpad, Desktop) and system shortcuts." } ] }, { title: { zh: 设备组织与 iCloud 同步, en: Organization & iCloud Sync }, items: [ { zh: 支持收藏星标设备与标签分类管理；支持通过 iCloud 私有数据库在 Mac、iPhone 与 iPad 间无缝同步设备列表（凭证保留在本地钥匙串）。, en: "Starred favorites and tag categories; iCloud private database sync across Mac, iPhone, and iPad with keychain credentials isolated." } ] }, { title: { zh: 生物识别应用锁与安全防护, en: Biometric App Lock & Privacy }, items: [ { zh: 支持 Touch ID、Face ID 及密码锁保护，并提供应用切换器毛玻璃隐私遮罩。, en: "Touch ID, Face ID, and passcode lock with privacy frosted-glass overlay in the App Switcher." } ] }, { title: { zh: 平台与验证, en: Platform & Verification }, items: [ { zh: Apple 芯片 Mac、macOS 14+；应用和 DMG 通过 Apple 官方公证，Sparkle 更新包经独立签名校验。, en: "Apple silicon Mac, macOS 14+. App and DMG are Apple notarized, and update packages are signature-verified." }, { zh: 814 项核心测试全部通过，0 失败。, en: 814 core unit and integration tests passed with 0 failures. } ] } ] }, { version: "1.1.0", build: "2026101001", date: 2026-10-10, channel: stable, download: https://github.com/bcblr1993/AetherScreens/releases/download/v1.1.0/AetherScreens-macOS-AppleSilicon-v1.1.0.dmg, github: https://github.com/bcblr1993/AetherScreens/releases/tag/v1.1.0, sha256: 85df54b81ca6f0c699c02cc1963fbd1d2e9d2c3c192384f4d9e1121ff26fb56c, sparkle: { edSignature: evZezDf57+fCMG2lFwS8aCAUzkZ0zatzOaHhoX5nNPXxFCP1/DK0L8gtdD2b/h5zhPoz5AoOXUnjJ/jfMZorAA==, len