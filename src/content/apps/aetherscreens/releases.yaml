o Playback" }, items: [ { zh: "基于 rdpsnd 与 AUDIO_PLAYBACK_DVC 通道，实时流式播放 Windows 远端系统的声音至 Mac 扬声器或耳机。", en: "Stream remote Windows audio in real time to Mac speakers or headphones via rdpsnd and AUDIO_PLAYBACK_DVC." }, { zh: "顶部悬浮控制栏支持一键实时静音/取消静音，静音时自动休眠音频缓冲调度，极致节省性能与电量。", en: "Quick mute/unmute control in the floating bar with idle buffer suspension for power efficiency." } ] }, { title: { zh: "自适应窗口动态分辨率", en: "Dynamic Window Resolution Auto-Fit" }, items: [ { zh: "基于 MS-RDPEDISP 协议，在 Mac 窗口大小调整或全屏切换时毫秒级自动调整 Windows 桌面分辨率，消除黑边与变形拉伸。", en: "Dynamically resizes Windows desktop resolution to match Mac window geometry without letterboxing or black bars." }, { zh: "采用 350ms 平滑防抖机制，拖动窗口调整大小丝滑流畅。", en: "350ms smooth debouncing for buttery-smooth window resizing." } ] }, { title: { zh: "平台与验证", en: "Platform & Verification" }, items: [ { zh: "Apple 芯片 Mac、macOS 14+；应用与 DMG 均已通过 Apple 官方公证，Sparkle 更新包通过独立签名。", en: "Apple Silicon Mac, macOS 14+; App and DMG Apple notarized, Sparkle update signed." }, { zh: "823 项核心测试全部通过，0 失败。", en: "823 automated tests passed with 0 failures." } ] } ] }, { version: "1.2.1", build: "2026101602", date: 2026-10-21, channel: stable, download: https://github.com/bcblr1993/AetherScreens/releases/download/v1.2.1/AetherScreens-macOS-AppleSilicon-v1.2.1.dmg, github: https://github.com/bcblr1993/AetherScreens/releases/tag/v1.2.1, sha256: ece2086ace62128db48876f32a145e49c24dd64815b8c66c5e5509a6a37a9d3d, sparkle: { edSignature: YfhjCHaIaWxqvg8HI/E/LSpb0eCJf7oKDZe5ycjOv3m1jEVlgDA8nZNymbwAaa7oBU3qlj1xT+UFYz6FdKekAA==, length: 10891408, minimumSystemVersion: "14.0" }, summary: { zh: "解决 Windows RDP 鼠标点击坐标偏差、默认高清 1080p 分辨率及 Finder 直接拖拽文件传输。", en: "Fixes Windows RDP mouse coordinate target offset, defaults to 1080p Full HD resolution, and adds Finder direct drag-and-drop file transfer." }, notes: [ { title: { zh: "Windows RDP 文件直接拖拽传输", en: "Direct Drag-and-Drop File Transfer" }, items: [ { zh: "支持从 Mac Finder 直接将文件或文件夹拖拽至远程桌面，自动经由 RDP 剪贴板通道（MS-RDPECLIP）传输并