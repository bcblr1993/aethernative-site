/AetherScreens/releases/tag/v1.5.0, sha256: d86794c4c411dc24f2b86efd5ef4cf4e54dda27157d42587f4137b366e905728, summary: { zh: AetherScreens v1.5.0, en: AetherScreens v1.5.0 } }, { version: "1.4.1", build: "2026110701", date: 2026-11-07, channel: stable, download: https://github.com/bcblr1993/AetherScreens/releases/download/v1.4.1/AetherScreens-macOS-AppleSilicon-v1.4.1.dmg, github: https://github.com/bcblr1993/AetherScreens/releases/tag/v1.4.1, sha256: a086ee6a147e1a5fdb0fe55296e4e57d2d935dc662d097c288371605938f1710, sparkle: { edSignature: yLCNeDpk1sFtXW/XkfHh3JwpszgOuCV4SeJP3SZiUBWE296n2Ia0GtWBCoSvqE/aS8EgwnWRl0cIs6MQeoH6Dw==, length: 11147073, minimumSystemVersion: "14.0" }, summary: { zh: 零拷贝脏区域帧缓冲渲染优化、Windows RDP 原生光标图像支持、音频低延迟防溢出与 TCP_NODELAY 网络加速。, en: "Zero-copy dirty-region framebuffer rendering, native Windows RDP cursor shapes, low-latency audio queue recovery, and TCP_NODELAY socket acceleration." }, notes: [ { title: { zh: 帧缓冲与 Metal 渲染管线性能飞跃, en: Framebuffer & Metal Rendering Pipeline Optimizations }, items: [ { zh: 移除 RDP 每帧全屏 CIContext 渲染与 8–33 MB 临时内存分配，改为直接锁定 CVPixelBuffer 按脏矩形（regionRects）增量写入。, en: Eliminated per-frame full-screen CIContext rendering and 8-33 MB intermediate Data allocations in favor of direct CVPixelBuffer dirty-region updates. }, { zh: 开启 MTKView.framebufferOnly 硬件无损帧缓冲压缩，并为全宽脏区域上传与 32 位像素填充/缩放提供连续内存块与 UInt32 指针快径。, en: Enabled MTKView.framebufferOnly GPU lossless framebuffer compression and added contiguous memcpy and UInt32 pointer fast paths across pixel compositors. } ] }, { title: { zh: Windows RDP 原生光标、音频低延迟与网络加速, en: "Native Windows RDP Cursors, Low-Latency Audio & Network Acceleration" }, items: [ { zh: 完整解析 Windows 远端 32 位透明与 24 位反色光标位图（箭头、文本 I-Beam、缩放手柄、手型及隐藏光标），映射为本地硬件光标。, en: "Decoded 32-bit alpha and 24-bit XOR Windows remote pointer bitmaps (arrow, I-beam, resize handles, hand, hidden cursor) into native hardware cursors." }, { zh: 修复音频重置/切换设备后旧缓冲区回调冲抵队列计数导致的延迟累积，将音频缓冲上限收紧至 350ms 并支持蓝牙/耳机路由热切换恢复。, en: "Fixed stale audio buffer completion callbacks after reset/reconfigure, tightened the latency cap to 350ms, and added AVAudioEngine route-change recovery." }, { zh: 为 RDP 套接字开启 TCP_NODELAY 与 TCP Keepalive，降低键鼠输入延迟并支持在 DisplayControl 通道就绪前预缓存自适应分辨率请求。, en: Enabled TCP_NODELAY and TCP keepalive on RDP sockets and preserved early DisplayControl resize requests with maximumMonitorArea proportional clamping. } ] }, { title: { zh: 输入处理与多语言细节打磨, en: Input Handling & Localization Polish }, items: [ { zh: macOS 会话窗口失焦或应用切后台时自动释放粘滞修饰键与工具栏长按键；补全 Home、End、PageUp、PageDown 与小键盘 Enter 映射。, en: "Automatically released sticky modifiers and held toolbar keys on window resignKey/app deactivation, and added Home, End, PageUp, PageDown, and numpad Enter mappings." }, { zh: 適用於 Apple 芯片 Mac（macOS 14+），App 与 DMG 均通过 Apple 公证，Sparkle 升级包使用 Ed25519 签名；876 项自动化测试全部通过。, en: "For Apple Silicon Macs (macOS 14+), Apple notarized App & DMG with Sparkle Ed25519 signature; all 876 automated tests passed." } ] } ] }, { version: "1.4.0", build: "2026110401", date: 2026-11-04, channel: stable, download: https://github.com/bcblr1993/AetherScreens/releases/download/v1.4.0/AetherScreens-macOS-AppleSilicon-v1.4.0.dmg, github: https://github.com/bcblr1993/AetherScreens/releases/tag/v1.4.0, sha256: 217014d56532b9a42ccc74ce18439f915d647b482aba86d8e920c3cd8717f0a5, sparkle: { edSignature: u27CH7r8ju4BHN0xAyYkh+OTVB41JXz2EXcIokSi05/gjEMLgoCc7QwiBQu9QiC7VrzPAX3JhEiXMAI83areCw==, length: 11122098, minimumSystemVersion: "14.0" }, summary: { zh: Windows RDP 双向文件拖拽与进度 HUD、虚拟通道分片重组、快捷键与多协议安全稳定性升级。, en: "Windows RDP bidirectional file drag-and-drop & progress HUD, virtual channel chunking, shortcut mapping, and security hardening." }, notes: [ { title: { zh: Windows RDP 双向文件传输与剪贴板增强, en: Windows RDP File Transfer & Clipboard Enhancements }, items: [ { zh: 支持直接拖拽文件或文件夹至 Windows 远程桌面目标窗口，等待远端 FormatListResponse 确认后自动触发粘贴并实时展示分块传输进度 HUD。, en: Drag files or folders onto a Windows RDP target window with automatic FormatListResponse synchronization and live chunk-by-chunk transfer progress HUD. }, { zh: 顶部新增已接收文件悬浮提示与工具栏面板，支持从 Windows 复制文件后直接拖出到 Mac 访达或一键在访达中显示。, en: Added a top received-files floating badge and toolbar panel supporting direct drag-to-Finder and one-click Show in Finder. }, { zh: 修复传输文件后复制纯文本无法自动同步到远端剪贴板的问题，以及取消 RDP 文件下载会断开整个远程会话的问题。, en: Fixed plain-text clipboard sync after file transfers and ensured cancelling an RDP file download no longer disconnects the remote session. } ] }, { title: { zh: 快捷键映射、显示设置与安全加固, en: "Shortcut Mapping, Display Settings & Security Hardening" }, items: [ { zh: 修复 Mac ⌘C/⌘V/⌘X/⌘A/⌘Z/⌘S/⌘F 映射至 Windows 时残留 Win 修饰键的问题，确保精准发送 Ctrl 组合键。, en: Released held Super/Win modifiers before synthesizing Ctrl shortcuts on Windows RDP sessions. }, { zh: 重设计多协议显示质量与分辨率面板；完善 iCloud 同步对 RDP 协议、自定义分辨率、远程音频、收藏及标签字段的完整保留。, en: "Redesigned the protocol-aware Display Quality & Resolution sheet and preserved RDP metadata, resolution, audio, favorites, and tags across iCloud Sync." }, { zh: 新增虚拟通道 64 MB 重组上限、文件下载 1 GB/1024 文件上限、长会话诊断包队列上限及 RFB 同步读取深度保护。, en: "Added 64 MB virtual channel reassembly limits, 1 GB / 1,024-file download guards, bounded diagnostic buffers, and RFB recursion depth protection." } ] }, { title: { zh: 平台与验证, en: Platform & Verification }, items: [ { zh: 适用于 Apple 芯片 Mac（macOS 14+），App 与 DMG 均通过 Apple 公证，Sparkle 升级包使用 Ed25519 签名；873 项自动化测试全部通过。, en: "For Apple Silicon Macs (macOS 14+), Apple notarized App & DMG with Sparkle Ed25519 signature; all 873 automated tests passed." } ] } ] }, { version: "1.3.5", build: "2026102202", date: 2026-10-22, channel: stable, download: https://github.com/bcblr1993/AetherScreens/releases/download/v1.3.5/AetherScreens-macOS-AppleSilicon-v1.3.5.dmg, github: https://github.com/bcblr1993/AetherScreens/releases/tag/v1.3.5, sha256: ccf44fd3b0f81aa7c1446e8979c969fbeb88ff5ac0dcb9191dc7121f05dd518d, sparkle: { edSignature: 0j5RqtJui7wyReY8Oe78r3cNL5T9qqpGi4Fqnc2SmfUfMXwZ9hpN8oPccZRbESNXpDZz9DI7FvSzv2EyWsWDDQ==, length: 10993553, minimumSystemVersion: "14.0" }, summary: { zh: "macOS 会话顶部栏自动隐藏，不再遮挡远程画面；鼠标停在窗口顶边即可唤出。", en: "The macOS session top bar now hides itself so it no longer covers the remote screen; rest the pointer at the top edge to bring it back." }, notes: [ { title: { zh: "体验改进：顶部栏不再遮挡画面", en: "Improved: top bar no longer covers the screen" }, items: [ { zh: "连接并显示第一帧后，顶部浮动栏约 1.5 秒自动收起，远端浏览器标签栏、地址栏和菜单栏可以正常点击。", en: "About 1.5 seconds after the first remote frame, the floating top bar hides so remote browser tabs, address bars and menu bars can be clicked." }, { zh: "鼠标停在会话顶边（或推入标题栏）约 0.3 秒后顶部栏滑出；只是经过不会弹出，离开栏区域 1.5 秒后收起。", en: "Rest the pointer at the top edge (or push it into the title bar) for about 0.3 seconds to reveal the bar; passing by does not, and it hides 1.5 seconds after you leave it." }, { zh: "连接中、断线重连、仅观察模式、打开会话面板或密码提示以及开启 VoiceOver 时，顶部栏始终显示。iPhone / iPad 行为不变。", en: "The bar stays visible while connecting or reconnecting, in Observe mode, while a session sheet or password prompt is open, and with VoiceOver on. iPhone and iPad are unchanged." } ] }, { title: { zh: "平台与验证", en: "Platform & Verification" }, items: [ { zh: "Apple 芯片 Mac、macOS 14+；应用与 DMG 均已通过 Apple 官方公证，Sparkle 更新包通过独立签名校验。", en: "Apple Silicon Mac, macOS 14+; App and DMG Apple notarized, Sparkle update signed." }, { zh: "862 项全量测试全部通过，0 失败。", en: "862 automated tests passed with 0 failures." } ] } ] }, { version: "1.3.1", build: "2026102102", date: 2026-10-21, channel: stable, download: https://github.com/bcblr1993/AetherScreens/releases/download/v1.3.1/AetherScreens-macOS-AppleSilicon-v1.3.1.dmg, github: https://github.com/bcblr1993/AetherScreens/releases/tag/v1.3.1, sha256: a3d382f95864e40d0f63d8c97c64f3961f70cc5ead53ed4e0015571f2769aa0e, sparkle: { edSignature: qJRPh/xbnXWzeZAsQBGyOO0QuQdevAh/HZ8Nij/8yqb72UbsEgXL5cexRoj997fSRIpCzpvhm16ZlXvg/M0uAw==, length: 10944720, minimumSystemVersion: "14.0" }, summary: { zh: "支持 Windows 与 Mac 双向文件剪贴板复制粘贴（⌘C/Ctrl+V 及 Ctrl+C/⌘V）与高精度视口投掷拖拽互传。", en: "Supports bi