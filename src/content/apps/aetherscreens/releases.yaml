" }, notes: [ { title: { zh: 首版功能, en: First release }, items: [ { zh: 支持 Mac 账号与 VNC 密码认证、Bonjour 发现、Tailscale 设备导入及钥匙串保存。, en: "Mac account and VNC authentication, Bonjour discovery, Tailscale device import, and Keychain storage." }, { zh: 提供原生键鼠、快捷键工具栏、缩放平移、观察模式和会话恢复，沿用 C 图标。, en: "Native keyboard and mouse, shortcut toolbar, zoom and pan, Observe mode, session recovery, and the approved C icon." } ] }, { title: { zh: 平台与功能范围, en: Platform and feature scope }, items: [ { zh: 公开下载仅支持 Apple 芯片 Mac 与 macOS 14+；iPhone / iPad 目前通过 Xcode 源码安装。, en: Public downloads support Apple silicon Macs on macOS 14+; iPhone and iPad currently require an Xcode source installation. }, { zh: 文字插入不等于双向剪贴板同步，锁屏不等于隐私幕帘；文件传输和自适应画质尚未提供。, en: Text insertion is not bidirectional clipboard sync and locking is not curtain privacy; file transfer and adaptive quality are not included. } ] } ] } ]
