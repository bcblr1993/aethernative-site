name: AetherNote
order: 4.5
icon: ./media/icon.png
repo: https://github.com/bcblr1993/AetherNote
minimumSystemVersion: "14.0"
tech: [SwiftUI, AppKit, MIT]
tagline: { zh: 把做过的小事，挂在这一周。, en: "Hang the little things you did on your week."  }
summary:
  zh: 一天一张便签，随手记一行。拖动晾衣绳上的小纸片，回看这一周；历史记录随时可编辑，每小时轻提醒只留在菜单栏。
  en: One note a day, one line at a time. Move notes along a playful clothesline and look back on your week. Edit past days anytime, with quiet hourly reminders in the menu bar.
platforms:
  - id: mac
    status: available
    requirement: { zh: Apple 芯片 · macOS 14+, en: "Apple silicon · macOS 14+"  }
cardStats:
  - value: "7"
    label: { zh: 一周最多七张, en: "Notes per week"  }
  - value: "3"
    label: { zh: 语言与材质, en: "Languages and materials"  }
  - value: "0"
    label: { zh: 账号与云端上传, en: "Accounts or cloud uploads"  }
hero:
  eyebrow: { zh: 原生 Mac 便签 · 免费开源, en: "Native Mac journal · Free and open source"  }
  title: { zh: "做过的小事，\n也值得记住。", en: "Little things done.\nWorth remembering." }
  lead:
    zh: "完成一个功能、读了几页书，或只是出去走走。\n随手写一行，挂在今天的便签上；想补充时，随时回到那一天。"
    en: "A feature finished, a few pages read, or a walk outside.\nWrite a line on today's note. Come back to any day whenever you have more to add."
  requirements:
    zh: Apple 芯片 · macOS 14+ · macOS 27 交互玻璃效果
    en: Apple silicon · macOS 14+ · Interactive glass on macOS 27
gallery:
  - label: { zh: 一周的晾衣绳, en: "Your weekly clothesline"  }
    zh: ./media/clothesline.png
showcase:
  eyebrow: { zh: 原生界面, en: "Native interface"  }
  title: { zh: 写下一行，再回看一周。, en: "Write a line. Look back on a week."  }
  lead:
    zh: 今天和过去的记录都可以继续编辑。周回顾按日期展开，方便阅读、复制与导出。
    en: Today's notes and past entries remain editable. The weekly review follows calendar order, ready to read, copy or export.
  note:
    zh: 截图来自 macOS 27 上的 AetherNote 0.1.1，展示 Liquid Glass 与暖色纸张，内容为演示数据。
    en: Actual AetherNote 0.1.1 captures on macOS 27, showing Liquid Glass and warm paper with demo entries. Screenshots show the Chinese interface.
  items:
    - title: { zh: 随时补记与修改, en: "Add and edit anytime"  }
      caption: { zh: 回车记一条，历史日期也能补充、修改和删除。, en: "Press Return to add an entry. Past days support additions, edits and deletion too."  }
      image: ./media/editor.png
    - title: { zh: 安静地读完这一周, en: "Read your week at your own pace"  }
      caption: { zh: 日期与正文分栏，按真实日期排列，可复制整周或导出 Markdown。, en: "Dates and entries sit side by side in calendar order. Copy the week or export Markdown."  }
      image: ./media/review.png
features:
  eyebrow: { zh: 每天一点点, en: "A little each day"  }
  title: { zh: 记录很轻，翻看有趣。, en: "Easy to write. A pleasure to revisit."  }
  lead: { zh: 不用建立任务清单，也不必写成长篇日记。把今天做过的事情留下来就好。, en: "No task list to maintain and no long diary to write. Just keep a few things you did today."  }
  items:
    - kicker: { zh: 随手记录, en: "Write"  }
      title: { zh: 一行一件事，哪天都能改, en: "One line per moment. Any past day is editable."  }
      body: { zh: 回车追加，粘贴多行自动分条；未提交的草稿自动保存。昨天漏写的事情可以补上，原有记录可以修订，所属日期保持不变。, en: "Return adds an entry and pasted lines become separate entries. Unsubmitted drafts save automatically. Add something you missed yesterday or correct an entry while keeping its original date."  }
    - kicker: { zh: 拖动与回弹, en: "Play"  }
      title: { zh: 拉一拉，再一键整理, en: "Give it a tug. Tidy with a click."  }
      body: { zh: 左右拖动纸片换位，上下拉动轻轻回弹；绳子也可以拉。点击整理按钮或双击绳子，便签回到日期顺序。默认五天，需要时展开到七天。, en: "Drag notes sideways to reorder, pull them down to spring back, or tug the rope itself. Click Tidy or double-click the rope to restore calendar order. Start with five weekdays and show up to seven days."  }
    - kicker: { zh: 语言与材质, en: "Appearance"  }
      title: { zh: 玻璃、暖纸，或一张白纸, en: "Glass, warm paper, or a clean sheet"  }
      body: { zh: 简体中文、English、日本語随时切换。macOS 27 支持交互玻璃，macOS 26 使用原生玻璃，较早系统使用磨砂材质；尊重减少动态效果与降低透明度设置。, en: "Switch between Chinese, English and Japanese. macOS 27 offers interactive glass, macOS 26 uses native glass, and earlier systems use translucent material. Reduced motion and transparency settings are respected."  }
    - kicker: { zh: 轻提醒, en: "A quiet reminder"  }
      title: { zh: 一小时，一个小标记, en: "An hour later, just a small mark"  }
      body: { zh: 一小时没有记录后，只在菜单栏留一个小标记。没有声音，不抢焦点，不自动弹窗。输入时延后，休眠后重新计时，也可以完全关闭。, en: "After an hour without recording, a small mark appears in the menu bar. No sound, focus changes or automatic windows. Reminders wait while you type, reset after sleep and can be turned off."  }
faq:
  eyebrow: FAQ
  title: { zh: 开始之前, en: "Before you start"  }
  lead: { zh: 关于记录、数据和安装。, en: "Notes, data and installation."  }
  items:
    - q: { zh: 过了当天，还能修改吗？, en: "Can I edit a day after it ends?"  }
      a: { zh: 可以。0.1.1 起，今天与历史日期都可以追加、修改和删除；旧版数据直接读取，无需转换。未来日期到当天再开始记录。, en: "Yes. From 0.1.1, today and all past days support adding, editing and deleting entries. Existing journals load without conversion. Future dates become available when that day arrives."  }
    - q: { zh: 记录会上传吗？, en: "Are my notes uploaded?"  }
      a: { zh: 不会。应用运行时不联网，无账号、云同步和使用统计。记录保存在这台 Mac，可以导出 Markdown 或 JSON 备份；应用本身不加密本地文件。, en: "No. The app makes no network connections and has no account, cloud sync or analytics. Entries stay on your Mac and can be exported as Markdown or JSON backups. The app does not encrypt local files."  }
    - q: { zh: 支持哪些 Mac？如何更新？, en: "Which Macs are supported, and how do I update?"  }
      a: { zh: 公开安装包支持 Apple 芯片 Mac 与 macOS 14+，经过 Developer ID 签名和 Apple 公证。下载 DMG 后拖入 Applications；后续版本需手动下载并替换应用，数据会保留。, en: "Public packages support Apple silicon Macs running macOS 14 or later and are Developer ID signed and Apple notarized. Drag the app from the DMG into Applications. Updates are manual downloads that replace the app while preserving your data."  }
cta:
  title: { zh: 今天做过什么？先记一行。, en: "What did you do today? Start with a line."  }
  note: { zh: 免费开源 · 本地保存 · 无需账号, en: "Free and open source · Stored locally · No account"  }
