name: AetherNote
order: 4.5
icon: ./media/icon.png
iconScale: 0.91
repo: https://github.com/bcblr1993/AetherNote
minimumSystemVersion: "14.0"
tech:
  - SwiftUI
  - AppKit
  - MIT
tagline:
  zh: 把做过的小事，挂在这一周。
  en: Hang the little things you did on your week.
summary:
  zh: "一天一张便签，记录和回看这一周。支持历史编辑、草稿保存与中英日界面；打开编辑、回顾或设置时，晾衣绳自动让位，菜单栏提供安静的每小时提醒。"
  en: "One note a day to record and review your week, with historical editing, saved drafts and Chinese, English and Japanese interfaces. The clothesline steps aside while writing, reviewing or using Settings, with quiet hourly menu bar reminders."
platforms:
  - id: mac
    status: available
    requirement:
      zh: Apple 芯片 · macOS 14+
      en: Apple silicon · macOS 14+
cardStats:
  - value: "7"
    label:
      zh: 一周最多七张
      en: Notes per week
  - value: "3"
    label:
      zh: 语言与材质
      en: Languages and materials
  - value: "0"
    label:
      zh: 账号与云端上传
      en: Accounts or cloud uploads
hero:
  eyebrow:
    zh: 原生 Mac 便签 · 免费开源
    en: Native Mac journal · Free and open source
  title:
    zh: |-
      做过的小事，
      也值得记住。
    en: |-
      Little things done.
      Worth remembering.
  lead:
    zh: |-
      完成一个功能、读了几页书，或只是出去走走。
      随手写一行，挂在今天的便签上；想补充时，随时回到那一天。
    en: |-
      A feature finished, a few pages read, or a walk outside.
      Write a line on today's note. Come back to any day whenever you have more to add.
  requirements:
    zh: Apple 芯片 · macOS 14+ · macOS 27 原生玻璃与弹性动画
    en: Apple silicon · macOS 14+ · Native glass and spring motion on macOS 27
gallery:
  - label:
      zh: 一周的晾衣绳
      en: Your weekly clothesline
    zh: ./media/clothesline.png
showcase:
  eyebrow:
    zh: 原生界面
    en: Native interface
  title:
    zh: 写下一行，再回看一周。
    en: Write a line. Look back on a week.
  lead:
    zh: 今天和过去的记录都可以继续编辑。周回顾按日期展开，方便阅读、复制与导出。
    en: Today's notes and past entries remain editable. The weekly review follows calendar order, ready to read, copy or export.
  note:
    zh: 截图来自 macOS 27 上的 AetherNote；日期编辑器为 0.1.5，晾衣绳与设置为 0.1.4，其余为 0.1.3，内容均为演示数据。
    en: Actual captures on macOS 27. The editor shows 0.1.5, the clothesline and Settings show 0.1.4, and other views show 0.1.3. All entries are demos in the Chinese interface.
  items:
    - title:
        zh: 给每一天，一点自己的颜色
        en: A little color for every day
      caption:
        zh: 八款柔和预设与自定义颜色，先预览再应用；默认随机配色，重新打开也保留。
        en: Eight soft presets and custom colors with a preview before applying. Automatic colors stay with each date across restarts.
      image: ./media/daily-colors.png
    - title:
        zh: 随时补记与修改
        en: Add and edit anytime
      caption:
        zh: 打开日期时晾衣绳暂时收起，紧凑的玻璃标题与清晰的正文区域让记录更专注；历史日期仍可补充、修改和删除。
        en: The clothesline steps aside when a day opens. A compact glass header and clear writing area keep the focus on your notes. Past days remain editable.
      image: ./media/editor.png
    - title:
        zh: 安静地读完这一周
        en: Read your week at your own pace
      caption:
        zh: 七天导航、记录概览与按日分组，点一下即可回到当天继续编辑。
        en: Navigate seven days, see entry counts and read daily groups. Jump straight back into any past day to keep writing.
      image: ./media/review.png
    - title:
        zh: 让记录更贴合你的习惯
        en: Make this space yours
      caption:
        zh: 自主启用或停用晾衣绳，单独控制顶部展开；一键整理、语言和材质设置清晰可见。
        en: Enable or disable the clothesline and choose whether hovering reveals it. Tidy, language and material controls are easy to find.
      image: ./media/settings.png
features:
  eyebrow:
    zh: 每天一点点
    en: A little each day
  title:
    zh: 记录很轻，翻看有趣。
    en: Easy to write. A pleasure to revisit.
  lead:
    zh: 不用建立任务清单，也不必写成长篇日记。把今天做过的事情留下来就好。
    en: No task list to maintain and no long diary to write. Just keep a few things you did today.
  items:
    - kicker:
        zh: 随手记录
        en: Write
      title:
        zh: 一行一件事，哪天都能改
        en: One line per moment. Any past day is editable.
      body:
        zh: 回车追加，粘贴多行自动分条；未提交的草稿自动保存。昨天漏写的事情可以补上，原有记录可以修订，所属日期保持不变。
        en: Return adds an entry and pasted lines become separate entries. Unsubmitted drafts save automatically. Add something you missed yesterday or correct an entry while keeping its original date.
    - kicker:
        zh: 拖动与回弹
        en: Play
      title:
        zh: 拉一拉，再一键整理
        en: Give it a tug. Tidy with a click.
      body:
        zh: 左右拖动纸片换位，上下拉动轻轻回弹；绳子也可以拉。点击带文字的“一键整理”或双击绳子，便签回到日期顺序。默认五天，需要时展开到七天；翻到很远的日期，也能一键回到本周。
        en: Drag notes sideways to reorder, pull them down to spring back, or tug the rope itself. Click the labeled Tidy the line button or double-click the rope to restore calendar order. Start with five weekdays and show up to seven days. Return from any distant date with the This week button.
    - kicker:
        zh: 语言与材质
        en: Appearance
      title:
        zh: 玻璃、暖纸，或一张白纸
        en: Glass, warm paper, or a clean sheet
      body:
        zh: 每天自动配一款柔和颜色，也能选择预设或自定义，颜色跟随日期保存。简体中文、English、日本語随时切换。macOS 26 与 27 使用原生玻璃，配合拖动回弹动画，较早系统使用磨砂材质；尊重减少动态效果与降低透明度设置。
        en: Each day gets a soft automatic color, with presets and custom colors saved by date. Switch between Chinese, English and Japanese. macOS 26 and 27 use native glass with spring-driven drag interactions, and earlier systems use translucent material. Reduced motion and transparency settings are respected.
    - kicker:
        zh: 显示由你控制
        en: Your line, your choice
      title:
        zh: 需要时展开，安静时收起
        en: Show it when you want it
      body:
        zh: 设置中可停用整个晾衣绳，关闭后重启也保持隐藏，记一行和周回顾仍可使用。顶部自动展开单独控制，新安装默认关闭；开启后需停留约 0.6 秒，减少快速经过时的误触。
        en: Disable the clothesline in Settings to keep it hidden, including after relaunch, while continuing to write and review. Top-edge reveal is optional and off for new installs; when enabled, it needs a 0.6-second pause to avoid accidental reveals.
    - kicker:
        zh: 轻提醒
        en: A quiet reminder
      title:
        zh: 一小时，一个小标记
        en: An hour later, just a small mark
      body:
        zh: 一小时没有记录后，只在菜单栏留一个小标记。没有声音，不抢焦点，不自动弹窗。输入时延后，休眠后重新计时，也可以完全关闭。
        en: After an hour without recording, a small mark appears in the menu bar. No sound, focus changes or automatic windows. Reminders wait while you type, reset after sleep and can be turned off.
    - kicker:
        zh: 应用内更新
        en: In-app updates
      title:
        zh: 检查、下载，再重新启动
        en: Check, download, then relaunch
      body:
        zh: 在设置或菜单选择“检查更新”，查看新版后下载，完成签名验证再安装并重新启动。默认手动检查，不自动下载，不强制重启。
        en: Choose Check for Updates in Settings or the menu, review the new version, download it, then install and relaunch after signature verification. Checks are manual, with no automatic downloads or forced restarts.
    - kicker:
        zh: 专注编辑
        en: Focused writing
      title:
        zh: 打开记录，让文字在前面
        en: Give your writing room
      body:
        zh: 打开记录、回顾或设置时暂时收起晾衣绳并暂停顶部触发；所有窗口关闭后按原先状态恢复。500pt 日期窗口保持输入时稳定，修改记录时留出更多正文空间。
        en: Opening a day, review or Settings hides the clothesline and pauses top-edge reveal. It returns to its previous state after the windows close. The 500pt day editor stays steady while typing and gives entries more room during edits.
faq:
  eyebrow: FAQ
  title:
    zh: 开始之前
    en: Before you start
  lead:
    zh: 关于记录、数据和安装。
    en: Notes, data and installation.
  items:
    - q:
        zh: 过了当天，还能修改吗？
        en: Can I edit a day after it ends?
      a:
        zh: 可以。0.1.1 起，今天与历史日期都可以追加、修改和删除；旧版数据直接读取，无需转换。未来日期到当天再开始记录。
        en: Yes. From 0.1.1, today and all past days support adding, editing and deleting entries. Existing journals load without conversion. Future dates become available when that day arrives.
    - q:
        zh: 记录会上传吗？
        en: Are my notes uploaded?
      a:
        zh: 日记、草稿和备份不会上传，内容保存在这台 Mac，无账号、云同步和使用统计。手动检查更新会连接官网，下载更新连接 GitHub；应用本身不加密本地文件。
        en: Notes, drafts and backups are never uploaded. They stay on your Mac with no account, cloud sync or analytics. Manual update checks connect to the website and downloads use GitHub. The app does not encrypt local files.
    - q:
        zh: 支持哪些 Mac？如何更新？
        en: Which Macs are supported, and how do I update?
      a:
        zh: 支持 Apple 芯片 Mac 与 macOS 14+，安装包经过签名和 Apple 公证。0.1.0 / 0.1.1 需要手动安装一次 0.1.5 或更新版本；之后可以在应用内检查、下载并重新启动完成更新，本地记录保留。
        en: Supports Apple silicon Macs on macOS 14 or later, with signed and Apple-notarized packages. Install 0.1.5 or later manually once from 0.1.0 or 0.1.1; later updates can be checked, downloaded and installed with a relaunch inside the app. Local notes are preserved.
