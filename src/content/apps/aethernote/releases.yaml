    build: "2026101302"
    date: 2026-10-13
    channel: stable
    platform: mac
    download: https://github.com/bcblr1993/AetherNote/releases/download/v0.1.2/AetherNote-0.1.2-macos-arm64.dmg
    github: https://github.com/bcblr1993/AetherNote/releases/tag/v0.1.2
    sha256: c6e34cf30f1c2e6cf85c1bccf1cdff25131bbdab204e2c26cf6476f2178af81a
    sparkle:
      edSignature: 846Rg5syWVvP3ScpLv3QXauPuCLIjZURKbO0TEQjtglNbkJBrrvO7Uerh7vNhb6PHpyzvZ6KzQNN3WkxS846CA==
      length: 3003940
    badge:
      zh: 已签名 · Apple 公证
      en: Signed · Apple notarized
    summary:
      zh: 全新 Liquid Glass 界面，重做编辑器、周回顾和设置；支持应用内检查、下载、安装并重启更新。
      en: A redesigned Liquid Glass interface for writing, weekly review and settings, with signed in-app download, installation and relaunch.
    notes:
      - title:
          zh: 统一的玻璃界面
          en: A clearer glass interface
        items:
          - zh: 统一工具栏、按钮与输入区，增加记录卡片、七天回顾导航和分组设置；完整支持中英日三语。
            en: Unified toolbars, buttons and input areas, entry cards, seven-day review navigation and grouped settings in Chinese, English and Japanese.
          - zh: 保留拖动换位、回弹与一键整理；关闭窗口或切换日期前保护未保存的修改。
            en: Preserves drag-to-reorder, spring motion and one-click tidying. Unsaved edits are protected before closing a window or switching days.
      - title:
          zh: 应用内更新
          en: In-app updates
        items:
          - zh: 在设置或菜单手动检查，下载签名更新包，安装后自动重新启动。不会自动下载或强制重启。
            en: Check manually from Settings or the menu, download a signed update, then install and relaunch. No automatic downloads or forced restarts.
          - zh: 0.1.0 / 0.1.1 没有内置更新器，需要手动安装一次 0.1.2；后续版本可以在应用内更新，本地记录保留。
            en: Versions 0.1.0 and 0.1.1 need one manual installation of 0.1.2. Later versions can update in the app, preserving the local journal.
  - version: 0.1.1
    build: "2026101301"
    date: 2026-10-13
    channel: stable
    platform: mac
    download: https://github.com/bcblr1993/AetherNote/releases/download/v0.1.1/AetherNote-0.1.1-macos-arm64.dmg
    github: https://github.com/bcblr1993/AetherNote/releases/tag/v0.1.1
    sha256: 2de446c4162476e9ba0c6397d467be87e5ee19bcee124440cb4d48c954a49d04
    badge:
      zh: 已签名 · Apple 公证
      en: Signed · Apple notarized
    summary:
      zh: 每一天都可以继续编辑：支持补记、修改和删除历史内容，兼容首版数据。
      en: Every past day stays editable. Add, edit and delete historical entries while keeping existing journals compatible.
    notes:
      - title:
          zh: 每天都可编辑
          en: Editable daily notes
        items:
          - zh: 今天和历史日期均支持追加、修改与删除；跨过午夜仍可继续编辑原来的日期。
            en: Today and past dates support additions, edits and deletion. Continue editing the same day across midnight.
          - zh: 旧版日记无需转换，修改保留原始创建时间和所属日期；未来日期到当天再开放。
            en: Existing journals need no conversion. Edits preserve the original creation time and date; future dates open when they arrive.
          - zh: 更新中英日三语提示、历史便签标记与周回顾说明。
            en: Updates Chinese, English and Japanese hints, historical note labels and weekly review copy.
      - title:
          zh: 安装与验证
          en: Installation and validation
        items:
          - zh: Apple 芯片 Mac · macOS 14+；应用与 DMG 均通过 Apple 公证。
            en: Apple silicon Mac on macOS 14 or later. Both app and DMG are Apple notarized.
          - zh: 更新时退出旧版，将新版拖入 Applications 替换，保留本地记录。
            en: Quit the old version and replace it in Applications. Your local journal is preserved.
