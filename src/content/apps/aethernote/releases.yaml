    sparkle:
      edSignature: 846Rg5syWVvP3ScpLv3QXauPuCLIjZURKbO0TEQjtglNbkJBrrvO7Uerh7vNhb6PHpyzvZ6KzQNN3WkxS846CA==
      length: 3003940
    badge:
      zh: 已签名 · Apple 公证
      en: Signed · Apple notarized
    summary:
      zh: 全新 Liquid Glass 界面，重做编辑器、周回顾和设置；支持应用内检查、下载、安装并重启更新。
      en: A redesigned Liquid Glass interface for writing, weekly review and settings, with signed in-app download, installation and relaunch.
    notes:
      - title:
          zh: 统一的玻璃界面
          en: A clearer glass interface
        items:
          - zh: 统一工具栏、按钮与输入区，增加记录卡片、七天回顾导航和分组设置；完整支持中英日三语。
            en: Unified toolbars, buttons and input areas, entry cards, seven-day review navigation and grouped settings in Chinese, English and Japanese.
          - zh: 保留拖动换位、回弹与一键整理；关闭窗口或切换日期前保护未保存的修改。
            en: Preserves drag-to-reorder, spring motion and one-click tidying. Unsaved edits are protected before closing a window or switching days.
      - title:
          zh: 应用内更新
          en: In-app updates
        items:
          - zh: 在设置或菜单手动检查，下载签名更新包，安装后自动重新启动。不会自动下载或强制重启。
            en: Check manually from Settings or the menu, download a signed update, then install and relaunch. No automatic downloads or forced restarts.
          - zh: 0.1.0 / 0.1.1 没有内置更新器，需要手动安装一次 0.1.2；后续版本可以在应用内更新，本地记录保留。
            en: Versions 0.1.0 and 0.1.1 need one manual installation of 0.1.2. Later versions can update in the app, preserving the local journal.
  - version: 0.1.1
    build: "2026101301"
    date: 2026-10-13
    channel: stable
