title: { zh: 使用帮助, en: Help }
heading: { zh: "安装与连接，\n从这里开始。", en: "Install and connect.\nStart here." }
sections:
  - heading: { zh: 安装, en: Install }
    steps:
      - { zh: 下载 DMG，打开后将 ApexTerm 拖入“应用程序”。, en: "Download the DMG, open it and drag ApexTerm into Applications." }
      - { zh: 从“应用程序”启动 ApexTerm，在侧边栏添加服务器会话。, en: "Launch ApexTerm from Applications and add a server session in the sidebar." }
      - { zh: 连接后，上方为终端，下方为 SFTP 文件视图；在终端中 cd，文件视图会自动跟随。, en: "Once connected, the terminal is on top and SFTP files below; cd in the terminal and the file view follows." }
    note: { zh: 需要 Apple 芯片（M1 及更新）和 macOS 14 或更新版本。, en: Requires Apple silicon (M1 or later) and macOS 14 or later. }
  - heading: { zh: 服务器监控不显示数据, en: Server metrics aren't showing }
    body:
      - zh: 监控通过 SSH 读取 Linux 的 /proc 信息，适用于常见 Linux 服务器；其他系统可能无法显示全部指标。
        en: "Metrics are read from Linux /proc over SSH and work on common Linux servers; other systems may not show every metric."
  - heading: { zh: 反馈问题, en: Report an issue }
    body:
      - zh: 反馈时请附上 macOS 版本、ApexTerm 版本和复现步骤，不要附带密码或私钥。
        en: "Please include your macOS version, ApexTerm version and steps to reproduce — never passwords or private keys."
    links:
      - { label: { zh: 在 GitHub 反馈 ↗, en: Report on GitHub ↗ }, href: "https://github.com/bcblr1993/ApexTerm/issues" }
