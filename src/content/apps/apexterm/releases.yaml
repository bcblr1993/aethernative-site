          - zh: 备用屏幕模式下锁定垂直视口原点为零位，并将触控板/鼠标滚轮映射为上下方向键平滑翻页，对齐原生 macOS 终端体验。
            en: Locked alternate-screen viewport origin to zero and mapped trackpad/wheel scrolls to arrow keys for native macOS terminal scrolling.
