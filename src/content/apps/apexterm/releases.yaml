# ApexTerm 版本记录
releases:
  - version: "1.5.2"
    build: "2026093002"
    date: 2026-09-30
    channel: stable
    download: https://github.com/bcblr1993/ApexTerm/releases/download/v1.5.2/ApexTerm-v1.5.2-macos-arm64.dmg
    github: https://github.com/bcblr1993/ApexTerm/releases/tag/v1.5.2
    sha256: b36285d29708dc3a5afb3c9bb07f648c36b92db72a55c3f5ef616d4fb55e01dd
    summary:
      zh: ApexTerm v1.5.2 — 主流运维工具全场景测试矩阵深度补齐、SFTP 0 字节传输修复与终端视口边距舒适优化。
      en: ApexTerm v1.5.2 — Comprehensive testing matrix parity, SFTP zero-byte transfer fix and terminal viewport comfort.
    badge:
      zh: 正式版 · 已通过 Apple 公证
      en: Release · Apple notarized
    notes:
      - title:
          zh: 新增特性 (Features)
          en: Features
        items:
          - zh: 对标 Electerm、FinalShell、SecureCRT、Termius、iTerm2，全面构建并落地 6 大核心自动化测试套件（终端控制信号矩阵、多会话并发广播容错、SFTP 深度极端异常、触发器正则与复合变量插值、异构 Linux 与容器监控、Keychain 凭据安全生命周期），新增 34 个严苛边界测试用例。
            en: Comprehensive test suite matrix matching Electerm, FinalShell, SecureCRT, Termius and iTerm2 across 6 core domains with 34 rigorous edge case tests.
      - title:
          zh: 体验优化 (Improvements)
          en: Improvements
        items:
          - zh: 为 NativeTerminalView 注入 10px 舒适内边距与动态行列尺寸补偿，彻底消除终端最后一行文字/光标与底栏贴紧的视觉压迫感。
            en: Added 10px comfortable content inset with dynamic row/column compensation, eliminating terminal cursor crowding near the bottom status bar.
          - zh: 底部状态栏高度调优至 32px 舒适高度，内边距重新平衡并在连接状态与文件联动控件间引入清晰分隔线。
            en: Bottom status bar refined to 32px height with rebalanced padding and visual divider between connection status and directory linkage.
          - zh: 自动化门禁流水线固定直连专用测试网络环境（macos27 目标虚拟机），保障全链路真实真机验收常态化运行。
            en: Automated CI/CD test gate permanently bound to macos27 dedicated target VM for verified live integration testing.
      - title:
          zh: 问题修复 (Bug Fixes)
          en: Bug Fixes
        items:
          - zh: 优化 TransferTask.progress 计算模型，在传输任务完成时统一明确返回 100%（1.0），解决 0 字节空文件传输成功后进度条仍滞留 0% 的产品显示缺陷。
            en: Refined TransferTask.progress calculation to return 100% on completed status, fixing 0-byte file transfers showing 0% progress.
          - zh: 增强 SFTP 操作后的事件通知与状态回流机制，确保删除文件后关联目录框即时响应更新。
            en: Enhanced SFTP event propagation and directory synchronization to immediately reflect remote file deletion.
      - title:
          zh: 质量门禁与性能对比 (Verification & Benchmarks)
          en: Verification & Benchmarks
        items:
          - zh: 经由真实 macos27 虚拟机全量验证通过，34 个测试套件（220+ 用例）100% 绿灯（0 failures, 0 warnings）。
            en: 100% pass rate across 34 test suites (220+ cases) verified against live macos27 VM.
          - zh: "8 项 Release 生产级性能基准全部大幅超越工程规范要求：RingBuffer 写入吞吐达 1,820,000+ 行/秒 (184 MB/秒)，ANSI TrueColor 解析达 384,000+ spans/秒，键入延迟 ≤ 5.55 μs。"
            en: "All 8 production benchmarks exceeded targets: RingBuffer throughput 1.82M+ lines/s (184 MB/s), ANSI TrueColor parsing 384K+ spans/s, key latency ≤ 5.55 μs."
          - zh: 经过 Apple Developer ID 官方签名、Hardened Runtime 运行时加固及静态安全扫描，官方公证票据已装订 (Stapled)。
            en: Officially signed with Apple Developer ID, hardened runtime enabled, and successfully notarized and stapled by Apple.
