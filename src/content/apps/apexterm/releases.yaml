    summary:
      zh: ApexTerm v1.5.5 — 彻底修复全屏状态下终端与 Vim 尺寸不同步、sshpass 子进程 SIGWINCH 阻断与 Vim 光标脱节至窗口底部严重缺陷。
      en: ApexTerm v1.5.5 — Resolved fullscreen PTY dimension desync, sshpass SIGWINCH propagation blockage and Vim cursor displacement bugs.
    badge:
      zh: 正式版 · 已通过 Apple 公证
      en: Release · Apple notarized
    notes:
      - title:
          zh: 问题修复 (Bug Fixes)
