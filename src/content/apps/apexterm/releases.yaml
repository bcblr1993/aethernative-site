        items:
          - zh: 彻底解决全屏幕状态下终端/Vim 仅能显示一部分及尺寸不同步缺陷。修复 sshpass 密码中继时未向子进程 /usr/bin/ssh 传递 SIGWINCH 导致的 30 行锁死问题，主动向后代进程群广播窗口信号。
            en: Fixed fullscreen terminal desync by actively broadcasting SIGWINCH signals to child /usr/bin/ssh processes across sshpass helper boundaries.
          - zh: 重构终端尺寸防抖与窗口全屏生命周期监听。监听 NSWindow 全屏切换通知，结合 tile() 与 viewDidEndLiveResize() 实现全屏即时广播校准，杜绝防抖任务竞态丢弃。
            en: Overhauled debounce lifecycle with immediate fullscreen window notification listeners, tile() layout overrides and viewDidEndLiveResize() hooks.
          - zh: 彻底修复 Vim 模式下光标不可见与脱节至窗口底部黑屏盲区的缺陷。通过 VT 引擎 2D 坐标映射精准定位当前行与列，完整支持 DECTCEM (\e[?25h/l) 光标显隐控制。
            en: Fixed invisible and displaced cursor in Vim by implementing 2D grid coordinate tracking and DECTCEM (\e[?25h/l) cursor visibility modes.
          - zh: 优化块状光标（Block Cursor）半透明渲染，确保光标覆盖下的代码字符清晰可见。
            en: Enhanced block cursor rendering with adaptive translucency to preserve character readability underneath.
