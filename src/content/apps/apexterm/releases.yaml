          en: Verification & Benchmarks
        items:
          - zh: 测试套件扩充至 12 项 Vim 与全屏专项测试 (VimAndScreenModeTests)，全量覆盖 2D 光标跟踪、DECTCEM 显隐、全屏广播及滚动区域隔离。
