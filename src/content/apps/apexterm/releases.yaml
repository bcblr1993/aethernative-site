          - zh: 全面实现 DECSTBM 顶底滚动区域保护与 S/T 滚屏、P/@/X 字符增删指令，确保 Vim 等文本编辑器滚动时光标与行内容限制在可视编辑区内，杜绝冲毁底部状态栏。
