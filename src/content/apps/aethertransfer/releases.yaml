releases: [ { version: "0.1.1", build: "2026102201", date: 2026-10-22, channel: stable, download: https://github.com/bcblr1993/AetherTransfer/releases/download/v0.1.1/AetherTransfer-0.1.1-arm64.dmg, github: https://github.com/bcblr1993/AetherTransfer/releases/tag/v0.1.1, sha256: e019fd31db58251a98c84b18beac2ffb31d12eb97327a7ddc4c90d5f0355197d, badge: { zh: 正式版 · 已通过 Apple 公证, en: Release · Apple notarized }, summary: { zh: AetherTransfer 0.1.1：修复书签密码未保存到钥匙串的问题；支持拖到任意文件夹上传下载，远程文件可直接拖到访达。, en: "AetherTransfer 0.1.1 fixes bookmark passwords not being saved to Keychain and lets you drag onto any folder to transfer, or drag remote files straight into Finder." }, notes: [ { title: { zh: 修复, en: Fixes }, items: [ { zh: 新建书签默认保存密码到钥匙串；关闭保存会删除已存凭据；钥匙串没有密码时连接前会询问。, en: "Passwords are saved to Keychain by default, turning saving off removes stored secrets, and a missing password is requested before connecting." } ] }, { title: { zh: 拖放, en: Drag and drop }, items: [ { zh: 拖到列表或图标视图中的文件夹即传到该文件夹；列表视图支持多选拖动。, en: Drop onto a folder in list or icon view to transfer into it; drag multiple rows in list view. }, { zh: 远程文件和文件夹可拖到访达或其他应用，经传输队列下载并校验后交付。, en: Drag remote files and folders into Finder or other apps; they download through the queue and are delivered only after verification. } ] } ] }, { version: "0.1.0", build: "2026102101", date: 2026-10-21, channel: stable, download: https://github.com/bcblr1993/AetherTransfer/releases/download/v0.1.0/AetherTransfer-0.1.0-arm64.dmg, github: https://github.com/bcblr1993/AetherTransfer/releases/tag/v0.1.0, sha256: 2ae24ee1da4d48a416c9f91fee4e71dce4ef3675dd1d934d8f6b84f3f8cfdb8e, badge: { zh: 正式版 · 已通过 Apple 公证, en: Release · Apple notarized }, summary: { zh: AetherTransfer 0.1.0 首个正式版：原生双栏 SFTP / FTPS / FTP 传输工作台，支持断点续传、目录同步预览、内置编辑、批量重命名与应用内安全更新。, en: "AetherTransfer 0.1.0, the first release: a native dual-pane SFTP / FTPS / FTP workspace with resumable transfers, previewed folder sync, built-in editing, batch rename and verified in-app updates." }, notes: [ { title: { zh: 浏览与传输, en: Browsing and transfers }, items: [ { zh: 本地与远程双栏、多标签工作区、列表与图标视图、路径栏、排序搜索、快速查看与 Finder 拖放。, en: "Local and remote panes, tabs, list and icon views, a path bar, sorting and search, Quick Look and Finder drag-and-drop." }, { zh: 有界并发传输队列，支持暂停、取消、重试、限速与断点续传；文件校验后才提交为目标文件。, en: "A bounded concurrent queue with pause, cancel, retry, bandwidth limits and resume; files are committed only after verification." } ] }, { title: { zh: 同步与编辑, en: Sync and editing }, items: [ { zh: 单向与双向目录同步先生成预览计划，逐项确认，默认不删除远程多余文件；支持同步浏览。, en: One-way and two-way folder sync builds a preview plan for item-by-item approval and never deletes remote extras by default; synchronized browsing included. }, { zh: 内置文本编辑器 ⌘S 回传、批量重命名预览、POSIX 权限编辑、压缩后上传与在终端中打开。, en: "Built-in editor with ⌘S save-back, previewed batch rename, POSIX permission editing, compress-and-upload and Open in Terminal." } ] }, { title: { zh: 安全与更新, en: Security and updates }, items: [ { zh: SFTP 首次连接核对主机指纹、密钥变化即拒绝；FTPS 验证证书；密码与口令存入 Keychain。, en: SFTP asks you to confirm the host fingerprint and refuses changed keys; FTPS validates certificates; passwords and passphrases live in Keychain. }, { zh: 应用内更新核对 SHA-256 与 Apple 代码签名后原子替换并重启。, en: In-app updates verify SHA-256 and the Apple code signature before atomically replacing the app and relaunching. } ] } ] } ]
