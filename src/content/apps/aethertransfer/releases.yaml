releases: [ { version: "0.3.0", build: "2026112502", date: 2026-11-25, channel: stable, download: https://github.com/bcblr1993/AetherTransfer/releases/download/v0.3.0/AetherTransfer-0.3.0-arm64.dmg, github: https://github.com/bcblr1993/AetherTransfer/releases/tag/v0.3.0, sha256: 9bfa493819779f2c3cb43c088cb97232693cbfaa391bbe6a3b157a4e3bbb501b, badge: { zh: 正式版 · 已通过 Apple 公证, en: Release · Apple notarized }, summary: { zh: AetherTransfer 0.3.0：Transmit 5 深度对齐，新增 FTP Active/ASCII 与原始命令控制台、S3 服务商预设 / ListBuckets / AWS STS AssumeRole + MFA、FileZilla/Cyberduck/Transmit/SSH/AWS 书签导入、防 Zip-Slip 解压、编辑器查找替换与多编码、高级同步干跑与 CSV 导出、Files 偏好设置及 View Options。, en: "AetherTransfer 0.3.0: deep Transmit 5 parity with FTP Active/ASCII modes and Raw Command Console, S3 presets / ListBuckets / AWS STS AssumeRole + MFA, bookmark importers (FileZilla/Cyberduck/Transmit/SSH/AWS), safe Zip extraction, editor Find & Replace + multi-encoding, Sync dry-run & CSV export, Files preferences, and View Options." }, notes: [ { title: { zh: FTP、原始命令与 S3 / STS, en: "FTP, raw console and S3 / STS" }, items: [ { zh: 新增 FTP Active/Passive 模式与 Automatic/ASCII/Binary 传输模式（断点续传自动保持二进制偏移），新增 Raw FTP/SFTP 命令控制台并严格拦截控制字符注入与脱敏输出。, en: "Adds FTP Active/Passive mode and Automatic/ASCII/Binary transfer modes (resumed transfers remain binary for byte-offset safety), plus a Raw FTP/SFTP Command Console with control-character guard and redacted output." }, { zh: 新增 S3 服务商预设（AWS S3、IAM Role/STS、Cloudflare R2、MinIO、DreamObjects、Wasabi、DigitalOcean Spaces）、S3 ListBuckets 桶发现，以及 AWS STS AssumeRole + MFA 临时会话令牌认证。, en: "Adds S3 provider presets (AWS S3, IAM Role/STS, Cloudflare R2, MinIO, DreamObjects, Wasabi, DigitalOcean Spaces), S3 ListBuckets discovery, and AWS STS AssumeRole + MFA ephemeral session credentials." } ] }, { title: { zh: 书签导入、安全解压与编辑器, en: "Bookmark importers, safe extract and editor" }, items: [ { zh: "支持导入 FileZilla XML、Cyberduck .duck、Transmit Favorites/.inetloc、~/.ssh/config 与 ~/.aws/{config,credentials}；本地 Zip 解压支持预扫描拒绝 Zip-Slip 与符号链接逃逸。", en: "Imports bookmarks from FileZilla XML, Cyberduck .duck, Transmit Favorites/.inetloc, ~/.ssh/config, and ~/.aws/{config,credentials}; local Zip extraction pre-scans archives to block Zip-Slip and symlink escapes." }, { zh: 内置编辑器新增查找与替换（⌘F）及 UTF-8、UTF-16、ISO-8859-1、GB18030 多编码读写。, en: "Built-in editor adds Find & Replace (⌘F) and UTF-8, UTF-16, ISO-8859-1, and GB18030 encoding support." } ] }, { title: { zh: 同步、偏好、视图选项与守护, en: "Sync, preferences, View Options and guard" }, items: [ { zh: 同步支持时间偏移补偿与自动估算、最近修改时间筛选、跟随符号链接、Simulate 干跑预览与 RFC-4180 CSV 导出；新增 Files & Editors 偏好（按扩展名自定义编辑器）、View Options（⌘J）、活跃传输关闭/断连守护与完整 macOS 菜单快捷键。, en: "Sync adds time-offset compensation and auto-detection, modified-within filtering, follow-symlinks, Simulate dry-run, and RFC-4180 CSV export; adds Files & Editors preferences (per-extension custom editors), View Options (⌘J), active-transfer close/disconnect guard, and complete macOS menu shortcuts." } ] } ] }, { version: "0.2.0", build: "2026112501", date: 2026-11-25, channel: stable, download: https://github.com/bcblr1993/AetherTransfer/releases/download/v0.2.0/AetherTransfer-0.2.0-arm64.dmg, github: https://github.com/bcblr1993/AetherTransfer/releases/tag/v0.2.0, sha256: 12640d536109ca9372969a2115558d3a9f0485efff32c45e3c48fe5cdcfdfbb1, badge: { zh: 正式版 · 已通过 Apple 公证, en: Release · Apple notarized }, summary: { zh: AetherTransfer 0.2.0：支持 FTP/FTPS/SFTP、WebDAV、S3/R2/MinIO、Backblaze B2、Azure Blob 与 OpenStack Swift；新增 Miller 分栏、画廊视图、Servers Launchpad、三标签检查器、规则引擎、脱敏日志、Finder Droplets 与 .aethersync 加密同步。, en: "AetherTransfer 0.2.0: expands to Explicit FTPS, WebDAV/HTTPS, S3/R2/MinIO, Backblaze B2, Azure Blob, and OpenStack Swift; adds Miller columns, Gallery split, Servers Launchpad, 3-tab Inspector, skip rules, redacted Transcripts, Finder Droplets, and .aethersync vault sync." }, notes: [ { title: { zh: 协议与云存储, en: Protocols and cloud storage }, items: [ { zh: 新增显式 FTPS (AUTH TLS)、WebDAV / WebDAV HTTPS、Amazon S3 / Cloudflare R2 / MinIO（AWS SigV4、分段上传、元数据与 Presigned URL）、Backblaze B2、Microsoft Azure Blob 与 OpenStack Swift。, en: "Adds Explicit FTPS (AUTH TLS), WebDAV / WebDAV HTTPS, Amazon S3 / Cloudflare R2 / MinIO (AWS SigV4, multipart upload, metadata, presigned URLs), Backblaze B2, Microsoft Azure Blob, and OpenStack Swift." } ] }, { title: { zh: 浏览、启动台与检查器, en: "Browser, Launchpad and Inspector" }, items: [ { zh: 新增级联 Miller 分栏、画廊预览视图与可调缩略图网格；支持聚焦模式与本地⇄本地、服务器⇄服务器双栏切换。, en: "Adds cascading Miller Columns, Gallery Split view, and resizable thumbnail Grid, plus Focus Mode and Local⇄Local / Server⇄Server pane switching." }, { zh: 新增 Servers Launchpad（颜色标签筛选、文件夹关联）与自定义常用位置钉选；三标签检查器支持文件夹大小、SHA-256 / MD5 校验、递归 chmod 与云端元数据/临时链接。, en: "Adds Servers Launchpad (color tag filters, Folder Linking) and Custom Places pinning; 3-tab File Inspector adds Folder Size, SHA-256 / MD5 checksums, recursive chmod, and cloud metadata/presigned URLs." } ] }, { title: { zh: 规则、日志与自动化, en: "Rules, Transcript and automation" }, items: [ { zh: 新增 Skip Rules 谓词过滤规则与 ASCII 扩展名编辑器；队列新增置顶、一键重试与严格脱敏的协议日志抽屉。, en: "Adds Skip Rules predicate builder and ASCII extension editor, queue Move to Top and Retry All Failed, and a strictly redacted protocol Transcript drawer." }, { zh: 支持导出 Finder 上传微应用 Droplets 与 URL Scheme、菜单栏微件、SSH 密钥管理器与 Known Hosts、外部编辑器实时回传，以及 .aethersync（HKDF-SHA256 + AES-GCM-256）加密书签同步。, en: "Adds Finder Droplet export and URL schemes, Menu Bar Droplet, SSH Key Manager and Known Hosts, External Editor auto-upload on save, and .aethersync (HKDF-SHA256 + AES-GCM-256) encrypted bookmark sync." } ] } ] }, { version: "0.1.2", build: "2026110401", date: 2026-11-04, channel: stable, download: https://github.com/bcblr1993/AetherTransfer/releases/download/v0.1.2/AetherTransfer-0.1.2-arm64.dmg, github: https://github.com/bcblr1993/AetherTransfer/releases/tag/v0.1.2, sha256: 6146970b87cc1405af81a1226cea60beb39650d45e66c6c5dd75fd6d0c44bd3a, badge: { zh: 正式版 · 已通过 Apple 公证, en: Release · Apple notarized }, summary: { zh: AetherTransfer 0.1.2：全新深色连接桥图标，应用与官网统一；独立安装包附带 TLS 证书根与依赖许可证。, en: "AetherTransfer 0.1.2: a new dark connection-bridge icon shared by the app and website, with bundled TLS certificate roots and dependency licenses." }, notes: [ { title: { zh: 更新, en: Updates }, items: [ { zh: 全新深色连接桥图标，覆盖应用、Retina 和官网。, en: "New dark connection-bridge icon for the app, Retina displays and website." }, { zh: 合并重复的“显示”菜单。, en: Merge duplicate View menus into the native menu. }, { zh: FTPS 使用随应用附带的证书根，保持证书验证开启。, en: FTPS uses bundled certificate roots while keeping certificate verification enabled. }, { zh: 补齐依赖许可证与源码构建配方，打包不覆盖运行中的输出应用。, en: Includes dependency licenses and source formulas; packaging protects a running output app. } ] } ] }, { version: "0.1.1", build: "2026102201", date: 2026-10-22, channel: stable, download: https://github.com/bcblr1993/AetherTransfer/releases/download/v0.1.1/AetherTransfer-0.1.1-arm64.dmg, github: https://github.com/bcblr1993/AetherTransfer/releases/tag/v0.1.1, sha256: e019fd31db58251a98c84b18beac2ffb31d12eb97327a7ddc4c90d5f0355197d, badge: { zh: 正式版 · 已通过 Apple 公证, en: Release · Apple notarized }, summary: { zh: AetherTransfer 0.1.1：修复书签密码未保存到钥匙串的问题；支持拖到任意文件夹上传下载，远程文件可直接拖到访达。, en: "AetherTransfer 0.1.1 fixes bookmark passwords not being saved to Keychain and lets you drag onto any folder to transfer, or drag remote files straight into Finder." }, notes: [ { title: { zh: 修复, en: Fixes }, items: [ { zh: 新建书签默认保存密码到钥匙串；关闭保存会删除已存凭据；钥匙串没有密码时连接前会询问。, en: "Passwords are saved to Keychain by default, turning saving off removes stored secrets, and a missing password is requested before connecting." } ] }, { title: { zh: 拖放, en: Drag and drop }, items: [ { zh: 拖到列表或图标视图中的文件夹即传到该文件夹；列表视图支持多选拖动。, en: Drop onto a folder in list or icon view to transfer into it; drag multiple rows in list view. }, { zh: 远程文件和文件夹可拖到访达或其他应用，经传输队列下载并校验后交付。, en: Drag remote files and folders into Finder or other apps; they download through the queue and are delivered only after verification. } ] } ] }, { version: "0.1.0", build: "2026102101", date: 2026-10-21, channel: stable, download: https://github.com/bcblr1993/AetherTransfer/releases/download/v0.1.0/AetherTransfer-0.1.0-arm64.dmg, github: https://github.com/bcblr1993/AetherTransfer/releases/tag/v0.1.0, sha256: 2ae24ee1da4d48a416c9f91fee4e71dce4ef3675dd1d934d8f6b84f3f8cfdb8e, badge: { zh: 正式版 · 已通过 Apple 公证, en: Release · Apple notarized }, summary: { zh: AetherTransfer 0.1.0 首个正式版：原生双栏 SFTP / FTPS / FTP 传输工作台，支持断点续传、目录同步预览、内置编辑、批量重命名与应用内安全更新。, en: "AetherTransfer 0.1.0, the first release: a native dual-pane SFTP / FTPS / FTP workspace with resumable transfers, previewed folder sync, built-in editing, batch rename and verified in-app updates." }, notes: [ { title: { zh: 浏览与传输, en: Browsing and transfers }, items: [ { zh: 本地与远程双栏、多标签工作区、列表与图标视图、路径栏、排序搜索、快速查看与 Finder 拖放。, en: "Local and remote panes, tabs, list and icon views, a path bar, sorting and search, Quick Look and Finder drag-and-drop." }, { zh: 有界并发传输队列，支持暂停、取消、重试、限速与断点续传；文件校验后才提交为目标文件。, en: "A bounded concurrent queue with pause, cancel, retry, bandwidth limits and resume; files are committed only after verification." } ] }, { title: { zh: 同步与编辑, en: Sync and editing }, items: [ { zh: 单向与双向目录同步先生成预览计划，逐项确认，默认不删除远程多余文件；支持同步浏览。, en: One-way and two-way folder sync builds a preview plan for item-by-item approval and never deletes remote extras by default; synchronized browsing included. }, { zh: 内置文本编辑器 ⌘S 回传、批量重命名预览、POSIX 权限编辑、压缩后上传与在终端中打开。, en: "Built-in editor with ⌘S save-back, previewed batch rename, POSIX permission editing, compress-and-upload and Open in Terminal." } ] }, { title: { zh: 安全与更新, en: Security and updates }, items: [ { zh: SFTP 首次连接核对主机指纹、密钥变化即拒绝；FTPS 验证证书；密码与口令存入 Keychain。, en: SFTP asks you to confirm the host fingerprint and refuses changed keys; FTPS validates certificates; passwords and passphrases live in Keychain. }, { zh: 应用内更新核对 SHA-256 与 Apple 代码签名后原子替换并重启。, en: In-app updates verify SHA-256 and the Apple code signature before atomically replacing the app and relaunching. } ] } ] } ]
