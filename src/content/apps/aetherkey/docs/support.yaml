    {
      "heading": {
        "zh": "首版实测数据与方法",
        "en": "Release measurements and method"
      },
      "body": [
        {
          "zh": "2026-10-24，在 Apple M1 Max、macOS 27.0.1 上，以 Release 优化方式编译引擎，用 20 组拼音执行 10 轮共 200 次热态查询。中位数 0.150 ms，P95 0.554 ms，最大 0.598 ms；首次加载并查询约 880 ms。查询时间只包含引擎调用，不包含按键传递、候选布局或屏幕刷新，不代表端到端打字延迟，也不是与搜狗的对照数据。",
          "en": "On 2026-10-24, a Release-optimized engine build on Apple M1 Max with macOS 27.0.1 ran 10 rounds of 20 pinyin strings (200 warm queries). Median: 0.150 ms; P95: 0.554 ms; maximum: 0.598 ms. Initial load and first query: about 880 ms. These are engine-call times, excluding keystroke delivery, layout and display. They are not end-to-end typing latency or Sogou comparison results."
        },
        {
          "zh": "32 项自动化回归测试通过，另有隔离 macOS 虚拟机的 DMG 安装、启用、候选与中文提交记录。首版候选排序仍受本地词库与学习记录影响，不据此承诺长句准确率。",
          "en": "32 automated regression tests passed, alongside isolated macOS VM records for DMG installation, activation, candidates and Chinese text commits. Candidate ordering depends on bundled dictionaries and local learning; no long-sentence accuracy guarantee is inferred."
        },
        {
          "zh": "资源短样本：隔离虚拟机 macOS 27.0、4 核、4 GB，安装签名构建后采样。空闲 15 次、每秒一次：RSS 约 138 MiB，ps CPU 均为 0.0%；连续输入 20 组 nihao/shijie 的 20 次采样：RSS 137.6–139.9 MiB，ps CPU 峰值 68.8%（单核口径）。RSS 不是活动监视器的内存占用值，短时采样不是长时间负载测试，不用于宣称比搜狗省资源。",
          "en": "Short resource sample in an isolated macOS 27.0 VM with 4 cores and 4 GB after installing a signed build: 15 idle samples at one-second intervals showed about 138 MiB RSS and 0.0% ps CPU. During 20 nihao/shijie entries, 20 samples showed 137.6–139.9 MiB RSS and a 68.8% peak ps CPU (single-core basis). RSS differs from Activity Monitor memory. This is not a sustained-load test or a resource-efficiency comparison with Sogou."
        }
      ]
    },
    {
      "heading": {
        "zh": "卸载与问题反馈",
        "en": "Uninstall and report issues"
      },
      "steps": [
        {
          "zh": "先从菜单栏切换到其他输入法，再在系统设置中移除 AetherKey。",
          "en": "Switch to another input source, then remove AetherKey in System Settings."
        },
        {
          "zh": "退出 AetherKey 后，将 ~/Library/Input Methods/AetherKey.app 移到废纸篓；必要时注销重新登录。词库默认保留，可自行决定是否删除。",
          "en": "Quit AetherKey and move ~/Library/Input Methods/AetherKey.app to Trash. Log out and back in if needed. The local dictionary is retained unless you remove it yourself."
        }
      ],
