    {
      "heading": {
        "zh": "实测数据与验证范围",
        "en": "Measurements and verification scope"
      },
      "body": [
        {
          "zh": "1.0.2 引擎查询实测：2026-10-24，Apple M1 Max、macOS 27.0.1，Release 优化编译，20 组拼音 × 10 轮共 200 次热态查询。中位数 0.457 ms，P95 2.042 ms，最大 2.197 ms。仅包含引擎调用，不包含按键传递、布局或屏幕刷新，不代表端到端延迟，也不是与搜狗的对照数据。",
          "en": "Engine measurements for 1.0.2 on 2026-10-24: Apple M1 Max, macOS 27.0.1, Release-optimized compilation, 10 rounds of 20 pinyin inputs (200 warm queries). Median 0.457 ms, P95 2.042 ms, maximum 2.197 ms. Engine calls only, excluding key delivery, layout and display; not end-to-end latency or a Sogou comparison."
        },
        {
          "zh": "1.0.2 的 40 项自动化回归测试通过，并在本机与隔离 macOS 虚拟机使用系统级真实逐键输入验证中间编辑、整句提交、候选管理、翻页和展开。候选排序仍受词库与本机学习影响，功能回归不等于广泛语料准确率测试。",
          "en": "All 40 regression tests passed for 1.0.2. Real system-level keystrokes on the host and an isolated macOS VM verified editing, sentence commits, candidate management, paging and expansion. Rankings depend on dictionaries and local learning; functional regression checks are not a broad corpus accuracy study."
        },
        {
          "zh": "以下为 1.0.0 的历史资源短样本，不代表当前 1.0.4：资源短样本：隔离虚拟机 macOS 27.0、4 核、4 GB，安装签名构建后采样。空闲 15 次、每秒一次：RSS 约 138 MiB，ps CPU 均为 0.0%；连续输入 20 组 nihao/shijie 的 20 次采样：RSS 137.6–139.9 MiB，ps CPU 峰值 68.8%（单核口径）。RSS 不是活动监视器的内存占用值，短时采样不是长时间负载测试，不用于宣称比搜狗省资源。",
          "en": "The following historical resource sample is from 1.0.0, not the current 1.0.4: Short resource sample in an isolated macOS 27.0 VM with 4 cores and 4 GB after installing a signed build: 15 idle samples at one-second intervals showed about 138 MiB RSS and 0.0% ps CPU. During 20 nihao/shijie entries, 20 samples showed 137.6–139.9 MiB RSS and a 68.8% peak ps CPU (single-core basis). RSS differs from Activity Monitor memory. This is not a sustained-load test or a resource-efficiency comparison with Sogou."
        }
      ]
    },
