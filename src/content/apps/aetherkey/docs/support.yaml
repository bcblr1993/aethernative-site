{
  "title": {
    "zh": "使用帮助与对比说明",
    "en": "Help and comparison notes"
  },
  "heading": {
    "zh": "从第一句你好，\n开始使用。",
    "en": "Start with\nyour first nihao."
  },
  "sections": [
    {
      "heading": {
        "zh": "安装、切换与更新",
        "en": "Install, switch and update"
      },
      "steps": [
        {
          "zh": "下载官方 DMG，打开「安装 AetherKey.app」，按向导完成安装。仅支持 Apple 芯片与 macOS 14+。",
          "en": "Download the official DMG and run its setup app. Apple silicon and macOS 14+ are required."
        },
        {
          "zh": "在系统设置的键盘 → 文本输入 → 编辑中添加 AetherKey 拼音；从菜单栏选择，或按 Control + 空格切换。",
          "en": "Add AetherKey Pinyin in System Settings → Keyboard → Text Input → Edit. Select it in the menu bar or press Control + Space."
        },
        {
          "zh": "输入 nihao，空格选择首项，数字键选择候选。使用减号/等号翻页，或点击面板箭头。Option + Tab 切换候选布局。",
          "en": "Type nihao; Space selects the first candidate and number keys select a candidate. Use minus/equals or the panel arrows to change pages. Option + Tab switches candidate layout."
        },
        {
          "zh": "从输入法菜单或设置 → 更新与启动点击「检查更新」，按提示下载、确认安装并重启。1.0.1 至 1.0.5 可直接升级到 1.0.6；1.0.0 用户需手动安装一次当前版本。更新保留本地词库、置顶、忘记记录和偏好。",
          "en": "Choose Check for Updates from the menu or Preferences → Updates & Startup, then download, confirm and relaunch. Versions 1.0.1 through 1.0.5 can update directly to 1.0.6; users of 1.0.0 need a one-time manual installation of the current version. Dictionaries, pins, forgotten words and settings are retained."
        },
        {
          "zh": "在设置 → 更新与启动中，可管理每 6 小时检查、查看检查时间与登录后自动启动。如果 macOS 显示等待允许，请点击入口在系统登录项中确认；休眠与退出期间不会按时检查。",
          "en": "In Preferences → Updates & Startup, manage six-hour checks, view check times and enable login startup. If macOS requires approval, follow the link to Login Items. Checks are deferred while the Mac sleeps or the app is not running."
        }
      ]
    },
    {
      "heading": {
        "zh": "1.0.6：全新设置与 A 字牌图标",
        "en": "1.0.6: redesigned settings and A badge"
      },
      "body": [
        {
          "zh": "设置使用左侧导航与分组卡片，四页均跟随系统明暗外观。通用页可切换全拼与双拼、候选布局和输入习惯；词库页管理自定义短语；更新页查看检查时间与登录启动；快捷键页按用途分组说明。",
          "en": "Settings use sidebar navigation and grouped cards with system light/dark appearance on all four pages. Manage input layouts and habits, custom phrases, update checks and login startup, and grouped shortcut help."
        },
        {
          "zh": "菜单栏图标更换为圆角实心 A 字牌，名称仍为 AetherKey 拼音。更新后若系统仍暂显旧图标，可先切到 ABC 再切回；若仍无变化，注销并重新登录可刷新系统输入源缓存。词库和偏好不会因图标更新被清空。",
          "en": "The menu-bar icon is now a solid rounded A badge; the name remains AetherKey 拼音. If macOS temporarily shows an old cached icon, switch to ABC and back, or log out and back in to refresh input-source caches. Dictionaries and preferences are retained."
        }
      ]
    },
    {
      "heading": {
        "zh": "1.0.5：四方向键选择候选",
        "en": "1.0.5: four-arrow candidate selection"
      },
      "body": [
        {
          "zh": "在设置 → 通用设置中开启“四方向键选择候选”。默认关闭，保留原来的左右键拼音编辑习惯；开启后 ← / ↑ 选择上一个候选，→ / ↓ 选择下一个候选，空格确认。可连续移动到下一页，再用左键返回。",
          "en": "Enable Four-arrow candidate selection in Settings → General. It is off by default to preserve existing Left/Right editing. When enabled, Left/Up choose the previous candidate and Right/Down choose the next; Space confirms. Continue moving across page boundaries and use Left to return."
        },
        {
          "zh": "开启后仍可用 Option + ← / → 按音节移动拼音光标，在中间插入、退格修正；Home / End 到开头或末尾。快捷键帮助会随开关状态同步变化，候选面板样式和光标跟随保持原样。",
          "en": "Option + Left/Right still moves the pinyin caret by syllable for inline insertion and correction; Home/End jump to either end. Shortcut help follows the setting, and candidate appearance and caret following remain unchanged."
        }
      ]
    },
    {
      "heading": {
        "zh": "1.0.4：上下文候选与中英文标点",
        "en": "1.0.4: contextual candidates and punctuation"
      },
      "body": [
        {
          "zh": "按当前光标前文查本地词库，例如“快捷”后输入 jian 推荐“键”，“文”后推荐“件”，“时”后推荐“间”。全拼、小鹤、微软双拼共用这套排序，置顶与自定义优先，忘记规则仍有效。前文无法读取时，仅在光标位置未变化的条件下使用本输入框近期已提交的文字；否则回退普通排序。",
          "en": "Preceding text guides local dictionary continuations across all layouts: 快捷 + jian → 键, 文 + jian → 件, 时 + jian → 间. Pins and custom phrases take priority; forgotten words stay excluded. If the host cannot expose surrounding text, recent commits are used only while the caret anchor still matches; otherwise normal ordering applies."
        },
        {
          "zh": "设置 → 通用设置可开启“中文使用英文标点”，默认关闭。Ctrl + . 在两种标点样式间切换，不会提交当前拼音或移动候选。若搜狗等其他软件全局占用此快捷键，需要先解除同名快捷键冲突；也可直接勾选设置或输入法菜单项。",
          "en": "Enable English punctuation in Chinese mode in Settings → General; it is off by default. Ctrl + . toggles styles without committing pinyin or moving candidates. If another app such as Sogou globally captures this shortcut, resolve that conflict or use the setting/menu item."
        },
        {
          "zh": "52 项自动化回归通过，Mac mini（macOS 27.0.1）完成 12 组常用词和 5 组编辑/双拼场景的真实逐键验证，并核对候选翻页及光标跟随。此验证不是与其他输入法的准确率或性能对照测试。",
          "en": "All 52 regression tests passed. A Mac mini running macOS 27.0.1 verified 12 word sequences and five editing/shuangpin scenarios using real system keystrokes, plus paging and caret following. This is not an accuracy or performance comparison against other input methods."
        }
      ]
    },
    {
      "heading": {
        "zh": "小鹤与微软双拼",
        "en": "Flypy and Microsoft shuangpin"
      },
      "steps": [
        {
          "zh": "1.0.3 起，在设置 → 通用设置 → 拼音方案选择全拼、小鹤双拼或微软双拼，也可从输入法菜单切换。默认全拼；正在编辑的拼音保持原方案直到结束。",
          "en": "From 1.0.3, choose full pinyin, Flypy or Microsoft shuangpin in Settings → General → Pinyin Layout, or use the input-method menu. Full pinyin is the default. An active composition keeps its original layout until finished."
        },
        {
          "zh": "小鹤输入 nihc → 你好、vsgo → 中国、jbtmtmqi → 今天天气；微软输入 nihk → 你好、vsgo → 中国、p; → ping（平等候选）。微软零声母可用 o，例如 or → er。",
          "en": "Flypy examples: nihc → 你好, vsgo → 中国, jbtmtmqi → 今天天气. Microsoft: nihk → 你好, vsgo → 中国, p; → ping candidates such as 平. Microsoft zero-initial syllables use o, for example or → er."
        },
        {
          "zh": "支持整句、中间插入删除、Option + 方向键按音节移动、分段选词和翻页。学习、短语、置顶和忘记按标准拼音保存，换方案继续使用。自定义短语的拼音仍填写全拼。",
          "en": "Sentence input, inline editing, Option + arrow syllable movement, partial selection and paging are supported. Learning, phrases, pins and forgotten words use standard pinyin and work across layouts. Enter full pinyin when adding custom phrases."
        },
        {
          "zh": "双拼 v 表示 zh；计算器可继续使用 v 加数字。空格选词，回车提交原始按键。",
          "en": "In shuangpin v represents zh; v followed by digits still starts the calculator. Space selects a candidate; Return commits the raw keys."
        }
      ]
    },
    {
      "heading": {
        "zh": "拼音编辑与候选管理",
        "en": "Pinyin editing and candidate preferences"
      },
      "steps": [
        {
          "zh": "← / → 在拼音串内移动，Option + ← / → 按音节移动，Home / End 到开头或末尾。退格删除前一个字母，Option + 退格删除前一个音节，向前删除键删除光标后的字母。",
          "en": "Left/Right move within pinyin; Option + arrows move by syllable; Home/End move to either end. Backspace deletes the previous letter, Option + Backspace the previous syllable, and Forward Delete the next letter."
        },
        {
          "zh": "↑ / ↓ / Tab / Shift + Tab 选择候选，空格或数字键上屏，减号/等号翻页。",
          "en": "Use Up/Down/Tab/Shift + Tab to select candidates, Space or number keys to commit, and minus/equals to page."
        },
        {
          "zh": "右键候选词可置顶、取消置顶或忘记。Control + Option + P / U / 退格分别对当前高亮词执行这三项操作，不会把拼音误上屏。",
          "en": "Right-click to pin, unpin or forget a candidate. Control + Option + P/U/Backspace perform these actions on the highlighted candidate without committing the composition."
        },
        {
          "zh": "忘记按拼音生效，会移除对应的学习、自定义和置顶记录，并隐藏该候选；其他拼音和词语不受影响。需要恢复时，在词库中心重新添加拼音与短语。",
          "en": "Forgetting applies to one reading: it removes that word’s learned, custom and pinned entries and hides the candidate. Other readings and words remain. Add the reading and phrase in dictionary settings to restore it."
        }
      ]
    },
    {
      "heading": {
        "zh": "姓名、生僻字与个人短语",
        "en": "Names, uncommon characters and phrases"
      },
      "body": [
        {
          "zh": "可分开输入 chen、jing、yi，在候选页中选择陈、璟、逸。可在词库中心添加 chenjingyi → 陈璟逸；个人短语保存在本机，不会作为公共词库随安装包分发。",
          "en": "Type chen, jing and yi separately and page to 陈, 璟 and 逸. Add chenjingyi → 陈璟逸 in the dictionary settings for direct entry. Personal phrases stay local and are not distributed with the app."
        }
      ]
    },
    {
      "heading": {
        "zh": "输入法对比的依据",
        "en": "Sources for input-method comparisons"
      },
      "body": [
        {
          "zh": "核对日期为 2026-10-24。搜狗的官方资料列有云输入、词库同步、语音和皮肤；Apple 提供内置中文输入方式、候选设置与词频调整；Rime 提供配置文件定制、词典与同步目录机制。AetherKey 的优势侧重默认无需账号的本机全拼与双拼、紧凑原生面板与图形化日常词语管理，不意味着其他输入法不能本地输入或管理候选。官网没有以本次功能回归宣称高于其他产品的准确率、速度或资源效率。",
          "en": "Checked on 2026-10-24. Official Sogou materials document cloud input, dictionary sync, voice and skins. Apple documents built-in Chinese input, candidate settings and frequency adjustment. Rime documents customization, dictionaries and sync folders. AetherKey emphasizes account-free local full-pinyin and shuangpin input, compact native candidates and visual everyday word management; these are not claims that others lack local input or candidate controls. Functional checks do not establish superior accuracy, speed or resource efficiency."
        }
      ],
