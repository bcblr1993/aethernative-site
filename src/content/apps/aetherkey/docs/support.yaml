          "en": "Switch to another input source, then remove AetherKey in System Settings."
        },
        {
          "zh": "退出 AetherKey 后，将 ~/Library/Input Methods/AetherKey.app 移到废纸篓；必要时注销重新登录。词库默认保留，可自行决定是否删除。",
          "en": "Quit AetherKey and move ~/Library/Input Methods/AetherKey.app to Trash. Log out and back in if needed. The local dictionary is retained unless you remove it yourself."
        }
      ],
