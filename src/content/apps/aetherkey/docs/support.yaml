        "en": "1.0.3 shuangpin verification"
      },
      "body": [
        {
          "zh": "44 项自动化回归通过，涵盖双拼键位、音节重码保留、原始按键偏移、分段选词、中间编辑和跨方案候选偏好。已在隔离 macOS 的 TextEdit 中使用系统级逐键事件验证小鹤、微软、分号、零声母、翻页及光标跟随。",
          "en": "44 regression tests cover layouts, ambiguous syllables, raw-key offsets, partial selection, inline editing and shared preferences. System-level keystrokes in TextEdit on isolated macOS verified Flypy, Microsoft, semicolon, zero-initial syllables, paging and caret following."
