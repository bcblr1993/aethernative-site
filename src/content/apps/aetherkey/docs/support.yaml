  "heading": {
    "zh": "从第一句你好，\n开始使用。",
    "en": "Start with\nyour first nihao."
  },
  "sections": [
    {
      "heading": {
        "zh": "安装、切换与更新",
        "en": "Install, switch and update"
      },
      "steps": [
        {
          "zh": "下载官方 DMG，打开「安装 AetherKey.app」，按向导完成安装。仅支持 Apple 芯片与 macOS 14+。",
          "en": "Download the official DMG and run its setup app. Apple silicon and macOS 14+ are required."
        },
        {
          "zh": "在系统设置的键盘 → 文本输入 → 编辑中添加 AetherKey 拼音；从菜单栏选择，或按 Control + 空格切换。",
          "en": "Add AetherKey Pinyin in System Settings → Keyboard → Text Input → Edit. Select it in the menu bar or press Control + Space."
        },
        {
          "zh": "输入 nihao，空格选择首项，数字键选择候选。使用减号/等号翻页，或点击面板箭头。Tab 切换候选布局。",
          "en": "Type nihao; Space selects the first candidate and number keys select a candidate. Use minus/equals or the panel arrows to change pages. Tab switches candidate layout."
        },
        {
          "zh": "更新时下载新 DMG 并重新运行安装向导，会保留本机词库与偏好。1.0.0 暂无自动更新。",
          "en": "To update, download the new DMG and rerun setup. Your local dictionary and settings are retained. Version 1.0.0 has no automatic updater."
        }
      ]
    },
    {
      "heading": {
        "zh": "姓名、生僻字与个人短语",
        "en": "Names, uncommon characters and phrases"
      },
      "body": [
        {
          "zh": "可分开输入 chen、jing、yi，在候选页中选择陈、璟、逸。可在词库中心添加 chenjingyi → 陈璟逸；个人短语保存在本机，不会作为公共词库随安装包分发。",
          "en": "Type chen, jing and yi separately and page to 陈, 璟 and 逸. Add chenjingyi → 陈璟逸 in the dictionary settings for direct entry. Personal phrases stay local and are not distributed with the app."
        }
      ]
    },
    {
      "heading": {
        "zh": "搜狗对比的依据",
        "en": "Basis for the Sogou comparison"
      },
      "body": [
        {
          "zh": "对比核对于 2026-10-24。搜狗 Mac 官方日志列有云输入、账号词库同步、语音、皮肤及跨设备剪贴板。它也支持基础离线输入，不能把“能离线”说成 AetherKey 独有优势。AetherKey 的取舍是仅在本机处理、无需账号、公开源码与紧凑原生界面。未进行同版本同条件的性能或准确率对照测试。",
          "en": "Checked on 2026-10-24. Sogou’s official Mac changelog documents cloud input, account-based dictionary sync, voice, skins and cross-device clipboard. Basic offline typing is not unique to AetherKey. AetherKey focuses on local processing, no accounts, public source and a compact native interface. No controlled version-matched performance or accuracy comparison was performed."
        }
      ],
