  "features": {
    "eyebrow": {
      "zh": "为什么选择 AetherKey",
      "en": "Why AetherKey"
    },
    "title": {
      "zh": "少一些配置，让常用的操作更直接。",
      "en": "Fewer settings to manage. Everyday actions within reach."
    },
    "lead": {
      "zh": "如果你只想在一台 Mac 上安静地打字，这些是 AetherKey 为你做好的取舍。",
      "en": "If you want focused typing on one Mac, these are the choices AetherKey makes for you."
    },
    "items": [
      {
        "kicker": {
          "zh": "离线",
          "en": "Offline"
        },
        "title": {
          "zh": "输入和学习，留在你的 Mac",
          "en": "Typing and learning stay on your Mac"
        },
        "body": {
          "zh": "拼音转换使用随包提供的词库，用户学习和自定义短语保存在本机。无需登录；客户端没有云输入、广告或数据统计模块。",
          "en": "Pinyin conversion uses bundled dictionaries. Learned words and custom phrases are stored locally. No login, cloud conversion, advertising or analytics module."
        }
      },
      {
        "kicker": {
          "zh": "候选",
          "en": "Candidates"
        },
        "title": {
          "zh": "贴近光标，也留出空间",
          "en": "Close to your caret, with room to write"
        },
        "body": {
          "zh": "候选面板宽度随内容适配，支持翻页与展开，浅色和深色随系统变化。出现和收起采用轻量渐变，连续输入保持位置跟随。",
          "en": "Content-adaptive width, paging and expanded candidates, with system light and dark appearance. Gentle fades and continuous caret following keep the panel near your text."
        }
      },
      {
        "kicker": {
          "zh": "编辑",
          "en": "Editing"
        },
        "title": {
          "zh": "拼音打错，不用从头再来",
          "en": "Fix pinyin without starting over"
        },
        "body": {
          "zh": "左右键移动到拼音中间，直接插入、退格或向前删除。Option 配合方向键按音节移动，分步选词后也能继续修改剩余拼音。上下键和 Tab 仍用于选择候选。",
          "en": "Move within pinyin with Left and Right, then insert, backspace or forward-delete. Option + arrows move by syllable, including after partial selection. Up, Down and Tab still navigate candidates."
        }
      },
      {
        "kicker": {
          "zh": "组词",
          "en": "Sentences"
        },
        "title": {
          "zh": "整句组词，参考你的选词习惯",
          "en": "Sentence candidates informed by your choices"
        },
        "body": {
          "zh": "保留多条词组组合，结合词组完整度、词典顺序和本机选词记录排序，并过滤低质量拼接。转换全程在本机完成，不依赖联网语言模型。",
          "en": "Keep alternative phrase combinations and rank them using phrase cohesion, dictionary order and local selections, filtering weak combinations. Conversion runs locally without an online language model."
        }
      },
      {
        "kicker": {
          "zh": "管理",
          "en": "Preferences"
        },
        "title": {
          "zh": "常用词置顶，不想要的词忘记",
          "en": "Pin useful words and forget unwanted ones"
        },
        "body": {
          "zh": "右键候选词即可置顶、取消置顶或忘记，也支持键盘快捷键。记录按拼音保存在本机，重启与更新后保留；忘记只影响对应拼音，需要时可重新添加自定义短语恢复。",
          "en": "Right-click a candidate to pin, unpin or forget it, or use keyboard shortcuts. Preferences are stored per reading and survive restarts and updates. Forgotten words can be restored by adding a custom phrase."
        }
      },
      {
        "kicker": {
          "zh": "字库",
          "en": "Characters"
        },
        "title": {
          "zh": "名字里的字，也值得打出来",
          "en": "Uncommon names deserve to be typed"
        },
        "body": {
          "zh": "基于 Unicode Unihan 17.0.0 整理 44,359 个有普通话读音的汉字、52,987 条读音映射，覆盖全部 8,105 个通用规范汉字。生僻字可通过翻页逐字选择，自定义短语可直接保存姓名。",
          "en": "Unicode Unihan 17.0.0 supplies 44,359 characters with Mandarin readings and 52,987 reading pairs, covering all 8,105 standard Chinese characters. Page through uncommon characters or save a name as a custom phrase."
        }
      },
      {
        "kicker": {
          "zh": "顺手",
          "en": "Convenience"
        },
        "title": {
          "zh": "Emoji、标点和数字，一起照顾",
          "en": "Emoji, punctuation and numbers"
        },
        "body": {
          "zh": "输入 meigui 查找玫瑰 Emoji；智能中文标点、可关闭的中英自动空格、V 模式计算与人民币大写，让常用操作就在键盘上。",
          "en": "Type meigui to find rose emoji. Smart Chinese punctuation, optional Chinese–English spacing, V-mode calculations and uppercase RMB amounts keep common tasks on the keyboard."
        }
      },
      {
        "kicker": {
          "zh": "更新",
          "en": "Updates"
        },
        "title": {
          "zh": "下一版，在应用里更新",
          "en": "Get the next version in the app"
        },
        "body": {
          "zh": "每 6 小时自动检查，发现新版时显示版本号与更新说明。设置中可查看最近与下次计划检查、关闭自动检查、管理登录后自动启动；安装前验证更新签名，保留词库与偏好。",
          "en": "Check automatically every six hours and see the new version and release notes. Settings show the last and next scheduled check, automatic-check controls and login startup. Updates are signature-verified, retaining dictionaries and preferences."
        }
      }
    ]
  },
