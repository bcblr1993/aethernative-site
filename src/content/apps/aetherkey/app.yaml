  "faq": {
    "eyebrow": "FAQ",
    "title": {
      "zh": "开始之前，了解这些。",
      "en": "Before you start."
    },
    "lead": {
      "zh": "安装、词库与使用边界。",
      "en": "Installation, dictionaries and current limits."
    },
    "items": [
      {
        "q": {
          "zh": "如何安装和启用？",
          "en": "How do I install and enable it?"
        },
        "a": {
          "zh": "打开 DMG，双击「安装 AetherKey.app」并按向导操作。到系统设置 → 键盘 → 文本输入 → 编辑添加 AetherKey 拼音，再从菜单栏切换。若暂时找不到，请注销重新登录。",
          "en": "Open the DMG and run the setup app. Add AetherKey Pinyin under System Settings → Keyboard → Text Input → Edit, then select it from the menu bar. Log out and back in if it is not listed."
        }
      },
      {
        "q": {
          "zh": "输入会上传吗？",
          "en": "Is my typing uploaded?"
        },
        "a": {
          "zh": "1.0.0 客户端的拼音转换、用户学习与自定义短语在本机完成，没有输入上传接口。访问官网或 GitHub 下载、反馈时，适用相应网站的隐私政策。",
          "en": "Version 1.0.0 converts pinyin and stores learning and custom phrases locally, with no typing-upload interface. Website visits, downloads and feedback are subject to the respective website policies."
        }
      },
      {
        "q": {
          "zh": "能完全代替搜狗吗？",
          "en": "Can it fully replace Sogou?"
        },
        "a": {
          "zh": "适合偏好本机处理和简洁原生界面的全拼用户。首版不含云同步、双拼、语音、手写和自动更新；依赖这些能力时，搜狗等成熟输入法可能更适合。",
          "en": "It suits full-pinyin users who prefer local processing and a focused native interface. The first release lacks cloud sync, shuangpin, voice, handwriting and automatic updates; mature input methods may better serve those needs."
        }
      },
      {
        "q": {
          "zh": "所有汉字都能输入吗？",
          "en": "Can I type every Chinese character?"
        },
        "a": {
          "zh": "覆盖随包 Unihan 数据中有普通话读音的 44,359 个汉字，不等于全部 Unicode 汉字都有读音或候选。多音字排序与整句效果仍会随场景变化；可逐字选择并保存个人短语。",
          "en": "The bundled Unihan data covers 44,359 characters with Mandarin readings, not every Unicode ideograph. Reading order and phrase results vary; select individual characters and save personal phrases."
        }
      }
    ]
  },
