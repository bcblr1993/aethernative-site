          "zh": "输入 meigui 查找玫瑰 Emoji；智能中文标点、可关闭的中英自动空格、V 模式计算与人民币大写，让常用操作就在键盘上。",
          "en": "Type meigui to find rose emoji. Smart Chinese punctuation, optional Chinese–English spacing, V-mode calculations and uppercase RMB amounts keep common tasks on the keyboard."
