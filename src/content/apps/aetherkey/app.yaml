  "faq": {
    "eyebrow": "FAQ",
    "title": {
      "zh": "开始之前，了解这些。",
      "en": "Before you start."
    },
    "lead": {
      "zh": "安装、词库与使用边界。",
      "en": "Installation, dictionaries and current limits."
    },
    "items": [
      {
        "q": {
          "zh": "已经有系统拼音，为什么还要试 AetherKey？",
          "en": "Why try AetherKey if I already use macOS Pinyin?"
        },
        "a": {
          "zh": "如果你喜欢随内容变化的紧凑候选面板，想直接在拼音中间修改、右键管理常用词，可以体验 AetherKey 这套交互。系统拼音同样有词频学习和多种中文输入方式；如果你只想零额外安装，它仍然很合适。",
          "en": "Try AetherKey if you prefer its compact, content-adaptive candidates, inline pinyin editing and direct word-management controls. macOS Pinyin also learns word frequencies and offers several input methods; it remains a good fit when you want no additional installation."
        }
      },
      {
        "q": {
          "zh": "支持哪些双拼？怎么切换？",
          "en": "Which shuangpin layouts are available?"
        },
        "a": {
          "zh": "1.0.3 支持小鹤双拼与微软双拼。在通用设置的「拼音方案」选择，或从输入法菜单直接切换。默认仍为全拼。微软分号键输入 ing；三种方案共用词库、学习和候选偏好。",
          "en": "Version 1.0.3 supports Flypy and Microsoft shuangpin. Select a layout in General Settings or the input-method menu. Full pinyin remains the default. Microsoft uses semicolon for ing; all three layouts share dictionaries, learning and candidate preferences."
        }
      },
      {
        "q": {
          "zh": "如何安装和启用？",
          "en": "How do I install and enable it?"
        },
        "a": {
          "zh": "打开 DMG，双击「安装 AetherKey.app」并按向导操作。到系统设置 → 键盘 → 文本输入 → 编辑添加 AetherKey 拼音，再从菜单栏切换。若暂时找不到，请注销重新登录。",
          "en": "Open the DMG and run the setup app. Add AetherKey Pinyin under System Settings → Keyboard → Text Input → Edit, then select it from the menu bar. Log out and back in if it is not listed."
        }
      },
      {
        "q": {
          "zh": "输入会上传吗？",
          "en": "Is my typing uploaded?"
        },
        "a": {
          "zh": "拼音转换、用户学习与自定义短语在本机完成，没有输入上传接口。开启自动更新检查后，每 6 小时联网检查版本；可在设置关闭。官网、GitHub 下载和反馈适用各自隐私政策。",
          "en": "Pinyin conversion, learning and custom phrases stay local, with no typing-upload interface. Optional update checks contact the server every six hours and can be disabled. Website, GitHub downloads and feedback follow their respective policies."
        }
      },
      {
        "q": {
          "zh": "能完全代替搜狗吗？",
          "en": "Can it fully replace Sogou?"
        },
        "a": {
          "zh": "适合偏好本机处理和简洁原生界面的全拼与双拼用户。当前不含云同步、语音、手写；依赖这些能力时，搜狗等成熟输入法可能更适合。",
          "en": "It suits full-pinyin and shuangpin users who prefer local processing and a focused native interface. The current release lacks cloud sync, voice, handwriting; mature input methods may better serve those needs."
        }
      },
      {
        "q": {
          "zh": "所有汉字都能输入吗？",
          "en": "Can I type every Chinese character?"
        },
        "a": {
          "zh": "覆盖随包 Unihan 数据中有普通话读音的 44,359 个汉字，不等于全部 Unicode 汉字都有读音或候选。多音字排序与整句效果仍会随场景变化；可逐字选择并保存个人短语。",
          "en": "The bundled Unihan data covers 44,359 characters with Mandarin readings, not every Unicode ideograph. Reading order and phrase results vary; select individual characters and save personal phrases."
        }
      }
    ]
