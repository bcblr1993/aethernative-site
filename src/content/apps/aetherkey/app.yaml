  "notice": {
    "zh": "2.0.0 大版本发布：全新本机 LM / Bigram 整句引擎与多音字重排（模糊音默认关闭）、英文词库与中英混输、双拼同音候选穿插、U 模式拆字（u）、URL/邮箱智能标点与成对符号补全/退格、,/. 翻页与 [/] 以词定字及 ; 次选、百宝箱（⌃⇧V 剪贴板历史 / ⌃⇧E 快捷短语），以及本地/iCloud 文件夹双向词库同步。",
    "en": "AetherKey 2.0.0 is here: on-device LM/Bigram sentence decoding and polyphone reranking (fuzzy pinyin off by default), English & mixed CN/EN input, shuangpin homophone interleaving, U-mode radical lookup (u), URL/email smart punctuation with paired Backspace, ,/. paging, [/] character extraction, ; 2nd-candidate commit, Toolbox (⌃⇧V clipboard history / ⌃⇧E quick snippets), and local/iCloud folder two-way sync."
