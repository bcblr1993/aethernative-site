  "faq": {
    "eyebrow": "FAQ",
    "title": {
      "zh": "开始之前，了解这些。",
      "en": "Before you start."
    },
    "lead": {
      "zh": "安装、词库与使用边界。",
      "en": "Installation, dictionaries and current limits."
    },
    "items": [
      {
        "q": {
          "zh": "已经有系统拼音，为什么还要试 AetherKey？",
          "en": "Why try AetherKey if I already use macOS Pinyin?"
        },
        "a": {
          "zh": "如果你喜欢随内容变化的紧凑候选面板，想直接在拼音中间修改、右键管理常用词，可以体验 AetherKey 这套交互。系统拼音同样有词频学习和多种中文输入方式；如果你只想零额外安装，它仍然很合适。",
          "en": "Try AetherKey if you prefer its compact, content-adaptive candidates, inline pinyin editing and direct word-management controls. macOS Pinyin also learns word frequencies and offers several input methods; it remains a good fit when you want no additional installation."
        }
      },
      {
        "q": {
          "zh": "支持哪些双拼？怎么切换？",
          "en": "Which shuangpin layouts are available?"
        },
        "a": {
          "zh": "1.1.0 支持小鹤、微软、自然码与搜狗四种双拼（以及全拼和五笔 86）。在通用设置的「输入方案」选择，或从输入法菜单直接切换，设置页内附带对应 QWERTY 键位速查表。微软与搜狗均用分号键输入 ing；全部拼音方案共用词库、简繁设置与候选偏好。",
          "en": "Version 1.1.0 supports Flypy, Microsoft, ZRM and Sogou shuangpin alongside full pinyin and Wubi 86. Select a layout in General Settings or the input-method menu, with live QWERTY keymap charts in Settings. Both Microsoft and Sogou use semicolon for ing; all pinyin layouts share dictionaries, script conversion and candidate preferences."
        }
      },
      {
        "q": {
          "zh": "如何切换简繁体、调整候选面板或按应用设置默认中英文？",
          "en": "How do I switch Simplified/Traditional, customize the panel, or set per-app defaults?"
        },
        "a": {
          "zh": "在通用设置或输入法菜单可开关「输出繁体中文」，也可按 ⌃⇧F 在输入时原位切换简繁体（与简体共享词频和置顶）。面板支持横排/竖排方向、5–9 个每页候选数与 14–19 pt 预设字号（引擎支持 13–22 pt）。终端和常见编辑器默认英文，也可在设置「按应用自动中英文」或输入法菜单为任意 .app 单独指定默认中英文规则。",
          "en": "Toggle Traditional Chinese in General Settings, the input-method menu, or with ⌃⇧F in place while typing (pins and learned frequencies stay unified). Customize horizontal/vertical layout, 5–9 candidates per page, and 14–19 pt font presets (13–22 pt engine range). Terminals and code editors default to English automatically, and you can override any .app in Settings or the menu."
        }
      },
      {
        "q": {
          "zh": "如何安装和启用？",
          "en": "How do I install and enable it?"
        },
        "a": {
          "zh": "打开 DMG，双击「安装 AetherKey.app」并按向导操作。到系统设置 → 键盘 → 文本输入 → 编辑添加 AetherKey 拼音，再从菜单栏切换。若暂时找不到，请注销重新登录。",
          "en": "Open the DMG and run the setup app. Add AetherKey Pinyin under System Settings → Keyboard → Text Input → Edit, then select it from the menu bar. Log out and back in if it is not listed."
        }
      },
      {
        "q": {
          "zh": "输入会上传吗？",
          "en": "Is my typing uploaded?"
        },
        "a": {
          "zh": "拼音转换、用户学习与自定义短语在本机完成，没有输入上传接口。开启自动更新检查后，每 6 小时联网检查版本；可在设置关闭。官网、GitHub 下载和反馈适用各自隐私政策。",
          "en": "Pinyin conversion, learning and custom phrases stay local, with no typing-upload interface. Optional update checks contact the server every six hours and can be disabled. Website, GitHub downloads and feedback follow their respective policies."
        }
      },
      {
        "q": {
          "zh": "如何用 U 模式拆字、百宝箱、模糊音与多台 Mac 同步词库？",
          "en": "How do U-mode radical lookup, Toolbox, fuzzy pinyin, and multi-Mac sync work?"
        },
        "a": {
          "zh": "输入 u 加部件拼音可拆字查生僻字（如 umumumu → 森）；按 ⌃⇧V 打开剪贴板历史（自动过滤密码管理器隐私条目）、⌃⇧E 打开快捷短语，也可在输入流用 vjb / vcy / vbq 呼出百宝箱。2.0.0 起模糊音默认关闭，可在设置按规则独立开启；在词库设置中指定本地目录或 iCloud Drive 文件夹即可无账号双向同步词库与短语。",
          "en": "Type u plus component pinyin to look up rare characters (e.g. umumumu → 森). Press ⌃⇧V for privacy-filtered Clipboard History, ⌃⇧E for Quick Snippets, or type vjb / vcy / vbq in-stream for the Toolbox. Fuzzy pinyin is off by default starting in 2.0.0 and can be enabled per rule in Settings. Pick a local or iCloud Drive folder in Lexicon Settings for account-free two-way sync."
        }
      },
      {
        "q": {
          "zh": "能完全代替搜狗吗？",
          "en": "Can it fully replace Sogou?"
        },
        "a": {
          "zh": "适合偏好本机处理、简洁原生界面和文件夹自主同步的全拼与双拼用户。当前不含账号云输入、语音与手写；依赖这些能力时，搜狗等成熟输入法可能更适合。",
          "en": "It suits full-pinyin and shuangpin users who prefer local processing, a focused native interface and folder-based sync. The current release lacks account cloud input, voice and handwriting; mature input methods may better serve those needs."
        }
      },
      {
        "q": {
          "zh": "所有汉字都能输入吗？",
          "en": "Can I type every Chinese character?"
        },
        "a": {
          "zh": "覆盖随包 Unihan 数据中有普通话读音的 44,359 个汉字，不等于全部 Unicode 汉字都有读音或候选。多音字排序与整句效果仍会随场景变化；可逐字选择并保存个人短语。",
          "en": "The bundled Unihan data covers 44,359 characters with Mandarin readings, not every Unicode ideograph. Reading order and phrase results vary; select individual characters and save personal phrases."
        }
      }
    ]
