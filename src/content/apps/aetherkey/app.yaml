  "features": {
    "eyebrow": {
      "zh": "为什么选择 AetherKey",
      "en": "Why AetherKey"
    },
    "title": {
      "zh": "少一些配置，让常用的操作更直接。",
      "en": "Fewer settings to manage. Everyday actions within reach."
    },
    "lead": {
      "zh": "如果你只想在一台 Mac 上安静地打字，这些是 AetherKey 为你做好的取舍。",
      "en": "If you want focused typing on one Mac, these are the choices AetherKey makes for you."
    },
    "items": [
      {
        "kicker": {
          "zh": "离线",
          "en": "Offline"
        },
        "title": {
          "zh": "输入和学习，留在你的 Mac",
          "en": "Typing and learning stay on your Mac"
        },
        "body": {
          "zh": "拼音转换使用随包提供的词库，用户学习和自定义短语保存在本机。无需登录；客户端没有云输入、广告或数据统计模块。",
          "en": "Pinyin conversion uses bundled dictionaries. Learned words and custom phrases are stored locally. No login, cloud conversion, advertising or analytics module."
        }
      },
      {
        "kicker": {
          "zh": "候选",
          "en": "Candidates"
        },
        "title": {
          "zh": "贴近光标，也留出空间",
          "en": "Close to your caret, with room to write"
        },
        "body": {
          "zh": "候选面板宽度随内容适配，支持翻页与展开，浅色和深色随系统变化。出现和收起采用轻量渐变，连续输入保持位置跟随。 可选开启四方向键选词：← / ↑ 上一个，→ / ↓ 下一个，空格确认。默认关闭，按自己的习惯选择。",
          "en": "Content-adaptive width, paging and expanded candidates, with system light and dark appearance. Gentle fades and continuous caret following keep the panel near your text. Optionally enable all four arrows: Left/Up select the previous candidate, Right/Down select the next, and Space confirms. Off by default."
        }
      },
      {
        "kicker": {
          "zh": "五笔",
          "en": "Wubi"
        },
        "title": {
          "zh": "熟悉的五笔，也能直接用",
          "en": "Wubi 86, ready to choose"
        },
        "body": {
          "zh": "在输入方案中选择五笔 86，支持简码、词组与满四码后继续输入顶字。不确定拆字时，用 z + 拼音查字和编码。学习、自定义短语、置顶和忘记与拼音分开保存。",
          "en": "Select Wubi 86 for short codes, phrases and fifth-key commit. Use z + pinyin to look up text and its Wubi code. Learning, phrases, pins and forgotten words are stored separately from pinyin."
        }
      },
      {
        "kicker": {
          "zh": "双拼",
          "en": "Shuangpin"
        },
        "title": {
          "zh": "熟悉的双拼，直接选就能用",
          "en": "Pick your familiar two-key layout"
        },
        "body": {
          "zh": "全拼、小鹤双拼、微软双拼可从设置和输入法菜单切换，无需修改配置文件。整句、拼音编辑、候选词置顶与忘记共用同一套本机词库，换方案不用重新学习。",
          "en": "Choose full pinyin, Flypy or Microsoft shuangpin in Settings or the input-method menu, with no configuration files to edit. Sentence candidates, inline editing, pins and forgotten words share one local dictionary across layouts."
        }
      },
      {
        "kicker": {
          "zh": "编辑",
          "en": "Editing"
        },
        "title": {
          "zh": "拼音打错，不用从头再来",
          "en": "Fix pinyin without starting over"
        },
        "body": {
          "zh": "左右键移动到拼音中间，直接插入、退格或向前删除。开启四方向键选词后，使用 Option + 左右键按音节移动拼音光标；分步选词后也能继续编辑。快捷键帮助随开关状态同步变化。",
          "en": "Move inside pinyin to insert or delete letters. With four-arrow selection enabled, Option + Left/Right still moves the composition caret by syllable. Continue editing after partial commits; shortcut help follows your setting."
        }
      },
      {
        "kicker": {
          "zh": "组词",
          "en": "Sentences"
        },
        "title": {
          "zh": "接着前文，候选更贴近表达",
          "en": "Candidates informed by the preceding text"
        },
        "body": {
          "zh": "准确音节优先于歧义词与模糊音；结合光标前最多四个相邻汉字，从本地词库查找续词。例如“快捷 jian”推荐“键”，“文 jian”推荐“件”，“时 jian”推荐“间”。保留置顶、自定义与忘记规则；没有可用前文时使用普通候选排序。",
          "en": "Exact syllables precede ambiguous and fuzzy alternatives. Up to four adjacent Chinese characters before the caret guide local dictionary continuations, such as 快捷 jian → 键 and 时 jian → 间. Pins, custom phrases and forgotten words remain respected. Without usable context, normal ordering applies."
        }
      },
      {
        "kicker": {
          "zh": "管理",
          "en": "Preferences"
        },
        "title": {
          "zh": "常用词置顶，不想要的词忘记",
          "en": "Pin useful words and forget unwanted ones"
        },
        "body": {
          "zh": "右键候选词即可置顶、取消置顶或忘记，也支持键盘快捷键。记录按输入编码保存在本机，五笔与拼音隔离，重启与更新后保留；忘记只影响对应拼音，需要时可重新添加自定义短语恢复。",
          "en": "Right-click a candidate to pin, unpin or forget it, or use keyboard shortcuts. Preferences are stored per reading and survive restarts and updates. Forgotten words can be restored by adding a custom phrase."
        }
      },
      {
        "kicker": {
          "zh": "字库",
          "en": "Characters"
        },
        "title": {
          "zh": "名字里的字，也值得打出来",
          "en": "Uncommon names deserve to be typed"
        },
        "body": {
          "zh": "基于 Unicode Unihan 17.0.0 整理 44,359 个有普通话读音的汉字、52,987 条读音映射，覆盖全部 8,105 个通用规范汉字。生僻字可通过翻页逐字选择，自定义短语可直接保存姓名。",
          "en": "Unicode Unihan 17.0.0 supplies 44,359 characters with Mandarin readings and 52,987 reading pairs, covering all 8,105 standard Chinese characters. Page through uncommon characters or save a name as a custom phrase."
        }
      },
      {
        "kicker": {
          "zh": "顺手",
          "en": "Convenience"
        },
        "title": {
          "zh": "Emoji、标点和数字，一起照顾",
          "en": "Emoji, punctuation and numbers"
        },
        "body": {
          "zh": "输入 meigui 查找玫瑰 Emoji；智能中文标点、可关闭的中英自动空格、V 模式计算与人民币大写，让常用操作就在键盘上。 “中文使用英文标点”默认关闭，Ctrl + . 可在输入中切换。",
          "en": "Type meigui to find rose emoji. Smart Chinese punctuation, optional Chinese–English spacing, V-mode calculations and uppercase RMB amounts keep common tasks on the keyboard. English punctuation in Chinese mode is optional and off by default; toggle with Ctrl + . while composing."
        }
      },
      {
        "kicker": {
          "zh": "更新",
          "en": "Updates"
        },
        "title": {
          "zh": "下一版，在应用里更新",
          "en": "Get the next version in the app"
        },
        "body": {
          "zh": "每 6 小时自动检查，发现新版时显示版本号与更新说明。设置中可查看最近与下次计划检查、关闭自动检查、管理登录后自动启动；安装前验证更新签名，保留词库与偏好。",
          "en": "Check automatically every six hours and see the new version and release notes. Settings show the last and next scheduled check, automatic-check controls and login startup. Updates are signature-verified, retaining dictionaries and preferences."
        }
      },
      {
        "kicker": {
          "zh": "设置",
          "en": "Settings"
        },
        "title": {
          "zh": "每个页面，都清晰顺手",
          "en": "Clear controls on every page"
        },
        "body": {
          "zh": "侧边导航直达通用、词库、更新与快捷键四页。设置按用途分组，支持系统明暗外观；自定义短语、六小时更新检查与登录启动都可直接管理。圆角实心 A 字牌统一菜单栏品牌。",
          "en": "Sidebar navigation leads to General, Dictionary, Updates and Shortcuts. Grouped settings follow system light/dark appearance, with direct controls for phrases, six-hour update checks and login startup. A solid rounded A badge unifies the menu-bar identity."
        }
      }
    ]
  },
