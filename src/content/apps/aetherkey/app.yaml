    "title": {
      "zh": "哪款输入法，更适合你的习惯？",
      "en": "Which input method fits the way you work?"
    },
    "lead": {
      "zh": "相对搜狗的云服务生态，AetherKey 把无需账号、本机转换和紧凑界面作为默认体验；相对鼠须管的深度定制路线，常用词管理可以直接在界面完成。系统拼音的优势是随 Mac 即用。选择 AetherKey，是选择一套支持全拼与两种双拼、直接可控的日常操作。",
      "en": "Compared with Sogou’s cloud ecosystem, AetherKey focuses on account-free local conversion and a compact interface. Compared with Rime’s deep customization, common word-management actions are available directly in the UI. macOS Pinyin is built in. Choose AetherKey for full pinyin, two shuangpin layouts and direct everyday controls."
    },
