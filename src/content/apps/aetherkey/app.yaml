  "faq": {
    "eyebrow": "FAQ",
    "title": {
      "zh": "开始之前，了解这些。",
      "en": "Before you start."
    },
    "lead": {
      "zh": "安装、词库与使用边界。",
      "en": "Installation, dictionaries and current limits."
    },
    "items": [
      {
        "q": {
          "zh": "已经有系统拼音，为什么还要试 AetherKey？",
          "en": "Why try AetherKey if I already use macOS Pinyin?"
        },
        "a": {
          "zh": "如果你喜欢随内容变化的紧凑候选面板，想直接在拼音中间修改、右键管理常用词，可以体验 AetherKey 这套交互。系统拼音同样有词频学习和多种中文输入方式；如果你只想零额外安装，它仍然很合适。",
          "en": "Try AetherKey if you prefer its compact, content-adaptive candidates, inline pinyin editing and direct word-management controls. macOS Pinyin also learns word frequencies and offers several input methods; it remains a good fit when you want no additional installation."
        }
      },
      {
        "q": {
          "zh": "如何安装和启用？",
          "en": "How do I install and enable it?"
