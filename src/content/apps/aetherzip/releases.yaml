    platform: mac
    download: https://github.com/bcblr1993/AetherZip/releases/download/v1.0.2/AetherZip-1.0.2-arm64.dmg
    github: https://github.com/bcblr1993/AetherZip/releases/tag/v1.0.2
    sha256: 76c3b984c8415103ef526dbc184c26ee0964705a4908a0f9816f024270f9fc2c
    sparkle:
      edSignature: "6fTpvFp58LaD2T36ILe28H45yQZx4w1c9vKezL1lPqsdlILDGLdiTOJm+MwATeOw6ZYRKVQ55KbMtvskaet7Bg=="
      length: 4436768
    badge: { zh: 正式版 · 已通过 Apple 公证, en: "Release · Apple notarized" }
    summary:
      zh: 修复解压与批量任务的边界问题，完善分卷识别、预览与拖拽清理，并启用可验证的应用内更新。
      en: Fixes extraction and batch-task edge cases, improves split-volume handling and preview/export cleanup, and enables signed in-app updates.
    notes:
      - title: { zh: 解压安全与可靠性修复, en: "Extraction reliability fixes" }
        items:
          - { zh: 同名批量任务在执行时分配独立输出；选择性解压不会自动回收原归档。, en: "Batch tasks choose distinct output names at execution time. Selective extraction never automatically trashes the source archive." }
          - { zh: 同名目录折叠改为校验后的单次发布，保留其他目录结构与选择路径。, en: "Matching-folder flattening now publishes once after validation, preserving other folder layouts and selected paths." }
          - { zh: 支持从后续 RAR、ZIP、7z 分卷定位首卷并去重；缺首卷时明确提示。, en: "Resolve secondary RAR, ZIP and 7z volumes to their first volume, deduplicate batches and report missing first volumes." }
      - title: { zh: 预览、导出与更新改进, en: "Preview, export and update improvements" }
        items:
          - { zh: 关闭归档不再回填旧清单；退出等待预览和导出清理，拖拽导出沿用当前编码。, en: "Closed archives no longer restore stale listings. Exit waits for preview/export cleanup, and exports preserve the chosen encoding." }
          - { zh: 补齐官网签名更新订阅，保持原 Developer ID 签名并轮换更新密钥。, en: "Adds the signed website update feed and rotates the update key while retaining the existing Developer ID signature." }
