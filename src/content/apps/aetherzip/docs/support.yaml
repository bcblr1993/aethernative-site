title: { zh: 使用帮助, en: "Support" }
heading: { zh: "归档问题，\n从这里开始。", en: "Archive help\nstarts here." }
lead: { zh: AetherZip Beta 使用说明与反馈入口。, en: "AetherZip Beta usage and feedback." }
sections:
  - heading: { zh: 安装与 Finder 快速操作, en: "Installation and Finder actions" }
    steps:
      - { zh: 打开 DMG，将 AetherZip 拖入 Applications，启动应用。, en: "Open the DMG, drag AetherZip into Applications and launch it." }
      - { zh: 在系统设置 → 通用 → 登录项与扩展 → 访达中启用 AetherZip 压缩与解压。, en: "Enable AetherZip in System Settings → General → Login Items & Extensions → Finder." }
      - { zh: 在 Finder 选中文件后，使用右键菜单的快速操作或服务进行压缩、加密和解压。, en: "Select files in Finder and use Quick Actions or Services to compress, encrypt or extract them." }
  - heading: { zh: 密码与分卷, en: "Passwords and split archives" }
    list:
      - { zh: ZIP 加密创建使用 ASCII 密码；需要中文密码或隐藏文件名时选择 7z。, en: "Use ASCII passwords when creating encrypted ZIP files. Choose 7z for Chinese passwords or hidden filenames." }
      - { zh: 将所有 7z 分卷放在同一目录，从 .001 文件打开。, en: "Keep all 7z volumes in one folder and open the .001 file." }
      - { zh: 没有密码无法解密。请妥善保管密码。, en: "Decryption requires the correct password. Keep it safe." }
  - heading: { zh: 当前边界, en: "Current limits" }
    list:
      - { zh: 仅支持 Apple 芯片和 macOS 26+；界面目前为中文。RAR 不能创建。, en: "Apple silicon and macOS 26+ only, with a Chinese interface. RAR creation is not available." }
      - { zh: 尚不支持归档内编辑、修改密码、损坏修复或自动更新。通过本页下载新版。, en: "Archive editing, password changes, damage repair and automatic updates are not available. Download new versions from this site." }
      - { zh: 强制结束进程或断电可能留下临时目录；正常取消或退出会等待清理。请勿在任务进行中手动删除临时目录。, en: "Forced termination or power loss can leave temporary folders. Normal cancellation or exit waits for cleanup. Do not manually delete temporary folders while a task is running." }
  - heading: { zh: 反馈, en: "Feedback" }
    body:
      - { zh: 请描述格式、文件大小、操作步骤及系统版本。请勿上传密码或敏感原文件。, en: "Include the archive format, file size, steps and macOS version. Do not upload passwords or sensitive source files." }
    links:
      - { label: { zh: 官网反馈, en: "Website feedback" }, href: /feedback/?app=aetherzip }
      - { label: GitHub Issues, href: https://github.com/bcblr1993/AetherZip/issues }
