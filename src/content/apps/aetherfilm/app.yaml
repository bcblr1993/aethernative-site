# AetherFilm 软件介绍
name: AetherFilm
order: 7
repo: https://github.com/bcblr1993/AetherFilm
icon: ./media/icon.png
minimumSystemVersion: "26.0"
tech: [Swift 6, SwiftUI, Liquid Glass, VLCKit, AMSMB2]

tagline:
  zh: 轻一点的私人影院，流式播放你的本地与 NAS 视频
  en: A native personal video player streaming your local and NAS media

summary:
  zh: "Apple 芯片 Mac 与 iPhone / iPad 原生轻量视频播放器：支持本地文件与 SMB NAS 范围流式播放，MP4 / MOV / MKV 硬件加速解码，多音轨与外挂字幕切换，播放进度记忆与极简 Liquid Glass 原生质感。"
  en: "A lightweight native video player for Apple silicon Mac, iPhone and iPad: local files and SMB NAS range streaming, MP4 / MOV / MKV hardware decoding, audio & subtitle selection, resume progress and Liquid Glass design."

platforms:
  - id: mac
    status: available
    requirement: { zh: Apple 芯片 · macOS 26.0+, en: Apple silicon · macOS 26.0+ }
  - id: ios
    status: dev
    requirement: { zh: iPhone / iPad · iOS 26.0+, en: iPhone / iPad · iOS 26.0+ }

cardStats:
  - value: "SMB NAS"
    label: { zh: 范围流式边下边播, en: Range Streaming }
  - value: "Liquid Glass"
    label: { zh: 原生质感设计, en: Native Design }
  - value: "多格式硬解"
    label: { zh: 硬件加速解码, en: Hardware Acceleration }

hero:
  eyebrow: { zh: 私人影院 · SMB NAS · 原生体验, en: Personal Cinema · SMB NAS · Native Experience }
  title: { zh: "轻一点的\n私人影院。", en: "Your personal cinema,\nlighter and native." }
  lead:
    zh: "添加自己的影片，快速找到内容，稳定流畅播放。\n告别臃肿转码与复杂库管理，本地文件与 NAS 共享边下边播。"
    en: "Add your media, browse a compact library, and enjoy reliable playback.\nNo heavy transcoding or complicated media servers—stream directly from local disks and NAS shares."
  requirements:
    zh: Apple 芯片 Mac（macOS 26.0+）／ iPhone、iPad（iOS 26.0+）
    en: Apple silicon Mac (macOS 26.0+) / iPhone, iPad (iOS 26.0+)

features:
  eyebrow: { zh: 核心功能, en: Core Features }
  title: { zh: 专注观影本质，流畅原生质感。, en: Focused on viewing, crafted for macOS and iOS. }
  lead:
    zh: 原生 Swift 6 与 SwiftUI 打造，提供纯净低耗的私人播放体验。
    en: Built with native Swift 6 and SwiftUI for a lightweight and responsive experience.
  items:
    - kicker: { zh: 片源, en: Sources }
      title: { zh: 本地文件与 SMB NAS 共享, en: Local files & SMB NAS shares }
      body:
        zh: 拖入本地视频或添加多个 SMB2/SMB3 连接，凭据安全存入系统钥匙串；采用范围流式播放，无需提前下载整部影片。
        en: Drag in local files or add SMB2/SMB3 connections with credentials secured in Keychain; range streaming starts playback without downloading full files.
      details:
        - { zh: 本地保存播放进度，退出重开随时接着看。, en: Saves playback progress and resumes seamlessly across restarts. }
        - { zh: 接近片尾自动标记已看，当前目录按自然顺序连播。, en: Automatically marks videos as watched near completion and continues in natural order. }
    - kicker: { zh: 解码, en: Playback }
      title: { zh: 多容器格式与硬件加速解码, en: Multi-format support & hardware decoding }
      body:
        zh: 广泛支持 MP4、MOV、MKV、AVI 等主流容器；充分调动 Apple Silicon 硬件加速解码 H.264 与 HEVC 影片。
        en: Broad support for MP4, MOV, MKV and AVI containers with Apple Silicon hardware acceleration for H.264 and HEVC.
      details:
        - { zh: 多音轨即时切换，适应多语种片源与音频配置。, en: Switch between embedded audio tracks instantly. }
        - { zh: 支持内嵌与外挂 SRT、ASS、VTT 字幕，提供时间轴延迟微调。, en: Supports embedded and external SRT, ASS, VTT subtitles with timing adjustments. }
    - kicker: { zh: 设计, en: Design }
      title: { zh: 原生 Liquid Glass 控制与无障碍支持, en: Liquid Glass controls & accessibility }
      body:
        zh: 现代原生半透明质感，深度支持系统深浅色外观、减少透明度（Reduce Transparency）与 VoiceOver 屏幕朗读。
        en: Modern translucent aesthetics with deep support for light/dark appearance, Reduce Transparency, and VoiceOver.
      details:
        - { zh: 完整的 Mac 键盘快捷键与触控手势控制。, en: Full keyboard shortcuts on Mac and intuitive touch gestures. }
        - { zh: 严格保护隐私，零数据埋点、广告或云端账户要求。, en: Zero tracking, telemetry, ads, or account requirements. }

faq:
  eyebrow: FAQ
  title: { zh: 常见问题, en: Questions }
  lead: { zh: 关于 AetherFilm 的常见问题与解答。, en: Frequently asked questions about AetherFilm. }
  items:
    - q: { zh: AetherFilm 与 Infuse 有什么不同？, en: How does AetherFilm differ from Infuse? }
      a: { zh: AetherFilm 专注于极简、轻量的纯原生播放与 SMB NAS 直连体验，不依赖复杂的在线媒体服务器或第三方账户体系，专注核心播放体验。, en: AetherFilm focuses on an ultra-lightweight, native playback and direct SMB streaming experience without requiring complex media servers or cloud accounts. }
    - q: { zh: 从列表移除视频会删除 NAS 或本地的原文件吗？, en: Does removing a video delete the original file? }
      a: { zh: 不会。AetherFilm 严格遵循只读原则，从 App 媒体库中移除视频或断开 NAS 连接绝不会修改或删除磁盘上的原始视频文件。, en: No. AetherFilm is strictly read-only; removing an entry from your library never deletes the original file from your disk or NAS. }
    - q: { zh: 为什么目前仅支持 Apple 芯片和 macOS 26+？, en: Why does it require Apple Silicon and macOS 26+? }
      a: { zh: AetherFilm 基于现代 Swift 6 严格并发与系统原生 Liquid Glass 交互组件打造，专注于 Apple Silicon 硬件解码与现代平台特性。, en: AetherFilm is built on Swift 6 strict concurrency and native Liquid Glass controls, taking full advantage of Apple Silicon hardware decoding and modern OS capabilities. }

cta:
  title: { zh: 开启轻量顺畅的观影体验。, en: Start your lightweight native film journey. }
  note: { zh: Apple 芯片 Mac · macOS 26.0+（iOS 同步验证中）, en: Apple silicon Mac · macOS 26.0+ (iOS testing alongside) }
