tagline:
  zh: 轻一点的私人影院，流式播放你的本地与 NAS 视频
  en: A native personal video player streaming your local and NAS media
summary:
  zh: 面向 Apple 芯片 Mac 的轻量私人视频播放器，支持本地文件与 SMB NAS 流式播放、H.264 / HEVC 硬件加速、多音轨与字幕切换、播放进度记忆。iPhone / iPad 版本正在验证中。
  en: A lightweight personal video player for Apple silicon Mac, with local files and SMB NAS streaming, H.264 / HEVC hardware acceleration, audio and subtitle selection, and saved playback progress. The iPhone and iPad version is undergoing validation.
