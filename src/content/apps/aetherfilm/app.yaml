hero:
  eyebrow:
    zh: 私人影院 · SMB NAS · 原生体验
    en: Personal Cinema · SMB NAS · Native Experience
  title:
    zh: |-
      轻一点的
      私人影院。
    en: |-
      Your personal cinema,
      lighter and native.
  lead:
    zh: |-
      添加自己的影片，浏览本地文件与 NAS 共享，接着上次的位置播放。
      无需提前下载整部影片，也无需搭建媒体服务器。
    en: |-
      Browse your local files and NAS shares, then continue from your saved position.
      Start streaming without downloading the entire film or setting up a media server.
  requirements:
    zh: Apple 芯片 Mac（macOS 26.0+）／ iPhone、iPad（iOS 26.0+）
    en: Apple silicon Mac (macOS 26.0+) / iPhone, iPad (iOS 26.0+)
features:
  eyebrow:
    zh: 核心功能
    en: Core Features
  title:
    zh: 专注观影本质，原生轻量体验。
    en: Focused on viewing, crafted for macOS and iOS.
  lead:
    zh: 原生 Swift 6 与 SwiftUI 打造，提供纯净低耗的私人播放体验。
    en: Built with native Swift 6 and SwiftUI for a lightweight and responsive experience.
  items:
    - kicker:
        zh: 片源
        en: Sources
      title:
        zh: 本地文件与 SMB NAS 共享
        en: Local files & SMB NAS shares
      body:
        zh: 拖入本地视频或添加多个 SMB2/SMB3 连接，凭据安全存入系统钥匙串；采用范围流式播放，无需提前下载整部影片。
        en: Drag in local files or add SMB2/SMB3 connections with credentials secured in Keychain; range streaming starts playback without downloading full files.
      details:
        - zh: 本地保存播放进度，退出重开随时接着看。
          en: Saves playback progress and resumes seamlessly across restarts.
        - zh: 接近片尾自动标记已看，当前目录按自然顺序连播。
          en: Automatically marks videos as watched near completion and continues in natural order.
    - kicker:
        zh: 解码
        en: Playback
      title:
        zh: 多容器格式与硬件加速解码
        en: Multi-format support & hardware decoding
      body:
        zh: 支持 MP4、MOV、MKV、AVI 常见容器，以及 H.264 / HEVC 硬件加速解码；具体播放能力以实测组合为准。
        en: Supports common MP4, MOV, MKV and AVI containers with H.264 and HEVC hardware acceleration; playback support depends on the tested media combination.
      details:
        - zh: 多音轨即时切换，适应多语种片源与音频配置。
          en: Switch between embedded audio tracks instantly.
        - zh: 支持内嵌与外挂 SRT、ASS、VTT 字幕，提供字幕延迟调节。
          en: Supports embedded and external SRT, ASS and VTT subtitles with timing adjustments.
    - kicker:
        zh: 设计
        en: Design
      title:
        zh: 原生 Liquid Glass 控制与无障碍支持
        en: Liquid Glass controls & accessibility
      body:
        zh: 采用系统原生 Liquid Glass 控件，跟随浅色与深色外观，并提供减少透明度和辅助功能标签；完整 VoiceOver 体验仍在验证中。
        en: Uses native Liquid Glass controls, follows light and dark appearance, and provides Reduce Transparency handling and accessibility labels. Full VoiceOver acceptance is still in progress.
      details:
        - zh: 完整的 Mac 键盘快捷键与触控手势控制。
          en: Full keyboard shortcuts on Mac and intuitive touch gestures.
        - zh: 零数据埋点、广告或云端账户要求。
          en: No tracking, telemetry, ads or cloud account requirements.
faq:
  eyebrow: FAQ
  title:
    zh: 常见问题
    en: Questions
  lead:
    zh: 关于 AetherFilm 的常见问题与解答。
    en: Frequently asked questions about AetherFilm.
  items:
    - q:
        zh: AetherFilm 与 Infuse 有什么不同？
        en: How does AetherFilm differ from Infuse?
      a:
        zh: AetherFilm 专注于轻量的原生播放与 SMB NAS 直连，不要求在线媒体服务器或云端账户，首版聚焦本地与 NAS 日常观看。
        en: AetherFilm focuses on lightweight native playback and direct SMB streaming. It does not require an online media server or cloud account, and its first release focuses on everyday local and NAS viewing.
    - q:
        zh: 从列表移除视频会删除原文件吗？
        en: Does removing a video delete the original file?
      a:
        zh: 不会。移除媒体库条目或断开 NAS 连接不会删除本地磁盘或 NAS 上的原始视频文件。
        en: No. Removing a library entry or disconnecting a NAS source does not delete the original video on your local disk or NAS.
    - q:
        zh: 当前可以下载哪个版本？
        en: Which version can I download now?
      a:
        zh: macOS 当前公开版本为 v0.1.0，适用于 Apple 芯片 Mac 和 macOS 26.0 及以上。iPhone / iPad 版本尚未公开分发。
        en: The current public macOS release is v0.1.0, for Apple silicon Macs running macOS 26.0 or later. The iPhone and iPad version is not publicly distributed yet.
    - q:
        zh: 新版图标和 NAS 优化什么时候提供？
        en: When will the new icon and NAS improvements be available?
      a:
        zh: 官网已采用选定的蓝紫玻璃 A 新图标。v0.1.1 候选包含新图标、NAS 常用目录、上次目录与视频行恢复，以及自动连播开关，目前仍在测试和验收中，尚未公开下载。正式发布后会更新版本记录和下载入口。
        en: The website now uses the selected blue and violet glass A icon. The v0.1.1 candidate includes this icon, NAS folder shortcuts, last-folder and video-row restoration, and an auto-play toggle. It is still under testing and acceptance and is not available for public download. Release notes and downloads will be updated after publication.
